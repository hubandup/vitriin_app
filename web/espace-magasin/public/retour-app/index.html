<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Retour à Vitriin</title>
<style>
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;font:16px/1.4 system-ui,sans-serif;color:#2D2D2D;text-align:center}
a{display:none;padding:14px 26px;border-radius:15px;background:#e5087e;color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<p id="msg">Un instant…</p>
<a id="back">Revenir dans l'application</a>
<script>
// Relais de l'autorisation Facebook / Google ouverte par l'app mobile dans le navigateur du téléphone.
// Aller : ?to=<page d'autorisation>, on note que le parcours vient de l'app (la page racine s'en sert au retour).
// Retour : ?oauth=…, on rend la main à l'app. Seule l'issue passe, jamais de jeton.
(() => {
  const q = new URLSearchParams(location.search), to = q.get("to");
  const AUTH_HOSTS = ["www.facebook.com", "m.facebook.com", "facebook.com", "accounts.google.com"];
  if (to) {
    let target = null;
    try { target = new URL(to); } catch {}
    if (!target || target.protocol !== "https:" || !AUTH_HOSTS.includes(target.hostname)) {
      document.getElementById("msg").textContent = "Lien non autorisé.";
      return;
    }
    try { localStorage.setItem("vitriin-oauth-app", String(Date.now())); } catch {}
    location.replace(target.href);
    return;
  }
  const out = new URLSearchParams();
  for (const k of ["oauth", "count", "message"]) if (q.has(k)) out.set(k, q.get(k));
  const link = "vitriin://oauth?" + out;
  const a = document.getElementById("back");
  a.href = link;
  location.replace(link);
  // Certains navigateurs bloquent l'ouverture automatique : le bouton prend le relais.
  setTimeout(() => { document.getElementById("msg").textContent = "Connexion terminée."; a.style.display = "inline-block"; }, 900);
})();
</script>
</body>
</html>
