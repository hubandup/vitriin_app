.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sab));background:#2D2D2D;color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:14px;z-index:80;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.load{padding:60px 0;text-align:center;color:var(--muted)}
@keyframes fade{from{opacity:0}to{opacity:1}}

    case "new_price": return { price: v, old: o, badge: o ? `−${Math.round((1 - v / o) * 100)} %` : "Nouveau", saving: o != null ? Math.max(0, o - v) : null };
    case "x_plus_y": return { price: v, old: o, badge: `${p.xy?.[0] ?? 2} + ${p.xy?.[1] ?? 1} offert`, saving: null };
    case "cashback": return { price: null, old: null, badge: `${v} % cagnottés`, saving: null };
    case "free_with_condition": return { price: null, old: null, badge: "Offert", saving: null };
  }
  return { price: null, old: null, badge: p.mechanic || "Promo", saving: null };
}
const init = (s) => (s?.name || "?").trim()[0].toUpperCase();
const logo = (s) => s.logo_url || s.network_logo;
const mapsUrl = (s) => s.lat != null ? `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([s.name, s.address, s.city].filter(Boolean).join(" "))}`;
function dist(a, s) {
  if (!a || s?.lat == null) return null;
  const r = (x) => x * Math.PI / 180, dLat = r(s.lat - a.lat), dLng = r(s.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(s.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
function clientId() {
  let id = ls.get("vitriin-client");
  if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join(""); ls.set("vitriin-client", id); }
  return id;
}
const geo = (timeout = 9000) => new Promise((ok) => {
  if (!navigator.geolocation) return ok(null);
  navigator.geolocation.getCurrentPosition((x) => ok({ lat: x.coords.latitude, lng: x.coords.longitude }), () => ok(null), { enableHighAccuracy: false, timeout, maximumAge: 600000 });
});

/* ---------- Données ---------- */
async function loadNearby() {
  if (!S.pos) { S.items = []; return; }
  let km0 = radius(), data = [];
  for (const k of [km0, 20, 50]) {
    if (k < km0) continue;
    const r = await sb.rpc("vitrine_nearby", { p_lat: S.pos.lat, p_lng: S.pos.lng, p_km: k, p_demo: DEMO });
    if (r.error) { toast(errText(r.error)); break; }
    data = r.data || []; S.wide = k > km0;
    if (data.length) break;
  }
  S.items = data.map(x => ({ ...x, d: dist(S.pos, x.store) }));
}
async function setPlace(q) {
  const { data, error } = await sb.rpc("vitrine_search", { p_q: q, p_demo: DEMO });
  if (error) return toast(errText(error));
  const pts = (data || []).filter(s => s.lat != null);
  if (!pts.length) return toast(`Aucun commerce Vitriin trouvé pour « ${q} ».`);
  const c = pts.find(s => (s.city || "").toLowerCase().startsWith(q.toLowerCase())) || pts[0];
  S.pos = { lat: c.lat, lng: c.lng, label: c.city || q }; ls.set("vt-pos", JSON.stringify(S.pos));
  S.items = null; route();
}
async function locate() {
  const p = await geo();
  if (!p) return toast("Position indisponible : choisis ta ville.");
  S.pos = { ...p, label: "Autour de moi" };
  const r = await sb.rpc("vitrine_nearby", { p_lat: p.lat, p_lng: p.lng, p_km: 50, p_demo: DEMO });
  const near = (r.data || []).map(x => ({ c: x.store.city, d: dist(p, x.store) })).sort((a, b) => a.d - b.d)[0];
  if (near?.c && near.d < 15) S.pos.label = near.c;
  ls.set("vt-pos", JSON.stringify(S.pos)); S.items = null; route();
}

/* ---------- Actions compte ---------- */
function needLogin(pending) {
  if (S.session) return false;
  if (pending) ss.set("vt-pending", JSON.stringify(pending));

}
async function toggleSave(promo, store) {
  if (needLogin({ save: promo.id, back: location.pathname })) return;
  const on = !isSaved(promo.id);
  const q = on ? sb.from("customer_saves").upsert({ store_promotion_id: promo.id }, { onConflict: "user_id,store_promotion_id", ignoreDuplicates: true })
    : sb.from("customer_saves").delete().eq("store_promotion_id", promo.id);
  const { error } = await q; if (error) return toast(errText(error));
  if (on) S.me.saves.unshift({ promo, store }); else S.me.saves = S.me.saves.filter(x => x.promo.id !== promo.id);
  toast(on ? "Promo enregistrée." : "Promo retirée.");
  return on;
}
async function toggleFollow(store) {
  if (needLogin({ follow: store.id, back: location.pathname })) return;
  const on = !isFollowing(store.id);
  const q = on ? sb.from("customer_follows").upsert({ store_id: store.id }, { onConflict: "user_id,store_id", ignoreDuplicates: true })
    : sb.from("customer_follows").delete().eq("store_id", store.id);
  const { error } = await q; if (error) return toast(errText(error));
  await refreshMe(); toast(on ? `Tu suis ${store.name}.` : `Tu ne suis plus ${store.name}.`);
  return on;
}
async function savePrefs(ch) {
  const p = { ...(S.me?.prefs || {}), ...ch, updated_at: new Date().toISOString() };
  const row = { first_name: p.first_name || null, radius_km: p.radius_km || 5, interests: p.interests || [], alerts: p.alerts !== false, updated_at: p.updated_at };
  const { error } = await sb.from("customer_prefs").upsert(row, { onConflict: "user_id" });
  if (error) { toast(errText(error)); return false; }
  if (ch.alerts != null) await sb.from("customer_follows").update({ alerts: !!ch.alerts }).eq("user_id", S.session.user.id);
  S.me.prefs = { ...S.me.prefs, ...row }; return true;
}
async function runPending() {
  const raw = ss.get("vt-pending"); if (!raw || !S.session) return;
  ss.set("vt-pending", null);
  try {
    const p = JSON.parse(raw);
    if (p.follow) { await sb.from("customer_follows").upsert({ store_id: p.follow }, { onConflict: "user_id,store_id", ignoreDuplicates: true }); }
    if (p.save) { await sb.from("customer_saves").upsert({ store_promotion_id: p.save }, { onConflict: "user_id,store_promotion_id", ignoreDuplicates: true }); }
    await refreshMe();
  } catch {}
}

      <p style="font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.4">Les alertes par email arrivent bientôt pour les commerces que tu suis.</p></div>
    <div class="pad" style="padding-top:18px;display:flex;flex-direction:column;gap:10px">
      <a class="btn line" href="/magasin/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h11a5 5 0 0 1 0 10h-1M16 21l4-4-4-4"/></svg>Passer en mode commerçant</a>
      <button class="btn line" id="out" style="color:#b3261e">Se déconnecter</button></div>`);
  $$("[data-int]").forEach(b => b.onclick = async () => { const set = new Set(P.interests || []); set.has(b.dataset.int) ? set.delete(b.dataset.int) : set.add(b.dataset.int); if (await savePrefs({ interests: [...set] })) pageProfile(); });
  $("#al").onclick = async () => { if (await savePrefs({ alerts: P.alerts === false })) pageProfile(); };
  $("#rad").onclick = async () => { const opts = [3, 5, 10, 20, 50], n = opts[(opts.indexOf(radius()) + 1) % opts.length] || 5; ls.set("vt-radius", n); if (await savePrefs({ radius_km: n })) { S.items = null; pageProfile(); } };
  $("#acc").onclick = accountSheet;
  $("#out").onclick = async () => { await sb.auth.signOut(); await refreshMe(); go("/v/"); };
}
function accountSheet() {
  const M = S.me || {};
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="cp" style="text-align:left" role="dialog" aria-modal="true" aria-label="Mon compte"><h3>Mon compte</h3><p style="font-size:13.5px;color:var(--muted);margin:6px 0 0">${esc(M.email || "")}</p>
    <label for="fn" style="display:block;font-size:13px;font-weight:600;margin:16px 0 7px">Ton prénom</label><input class="inp" id="fn" maxlength="40" value="${esc(M.prefs?.first_name || "")}" autocomplete="given-name">
    <button class="btn p" id="fn-ok" style="margin-top:12px">Enregistrer</button>
    <p style="font-size:12px;color:var(--muted);line-height:1.5;margin:14px 0 0"><a href="https://www.vitriin.fr/cgu" target="_blank" rel="noopener" style="color:var(--p)">CGU</a> · <a href="https://www.vitriin.fr/confidentialite" target="_blank" rel="noopener" style="color:var(--p)">Confidentialité</a></p>
    <button class="btn line" id="del" style="margin-top:12px;color:#b3261e">Supprimer mon compte</button><button class="btn" id="x" style="margin-top:6px;color:var(--muted);font-weight:600">Fermer</button></div>`;
  ov.onclick = (e) => { if (e.target === ov || e.target.id === "x") ov.remove(); };
  document.body.appendChild(ov);
  $("#fn-ok", ov).onclick = async () => { if (await savePrefs({ first_name: $("#fn", ov).value.trim() })) { ov.remove(); route(); toast("C'est noté."); } };
  $("#del", ov).onclick = async () => {
    if ($("#del", ov).dataset.c !== "1") { $("#del", ov).dataset.c = "1"; $("#del", ov).textContent = "Confirmer : tout supprimer définitivement"; return; }
    const { error } = await sb.rpc("customer_delete_account"); if (error) return toast(errText(error));
    await sb.auth.signOut(); ov.remove(); await refreshMe(); toast("Compte supprimé."); go("/v/");
  };
}

function pageAuth(why) {
  document.title = "Connexion · Vitriin";
  $("#tabs").classList.add("hidden");
  app().innerHTML = `<div class="auth"><div><button class="back" id="bk" aria-label="Retour">${IC.back}</button></div>
    <div style="padding-top:34px;text-align:center"><span class="logo">V</span><h2>Bienvenue sur Vitriin</h2><p>${esc(why || "Entre ton email, on t'envoie un lien de connexion. C'est tout.")}</p></div>
    <form id="lf" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px">
      <label for="em" style="font-size:13px;font-weight:600">Ton email</label><input class="inp" id="em" type="email" autocomplete="email" inputmode="email" placeholder="prenom@exemple.fr" required>
      <button class="btn p" id="go">Recevoir mon lien de connexion</button>
      <p style="text-align:center;font-size:13px;color:var(--muted);margin:0">Pas de mot de passe : un simple lien, valable une fois.</p></form>
    <div class="legal">En continuant, tu acceptes nos <a href="https://www.vitriin.fr/cgu" target="_blank" rel="noopener">CGU</a> et notre <a href="https://www.vitriin.fr/confidentialite" target="_blank" rel="noopener">politique de confidentialité</a>.</div></div>`;
  $("#bk").onclick = () => history.length > 1 ? history.back() : go("/v/");
  $("#lf").onsubmit = async (e) => {
    e.preventDefault(); const email = $("#em").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Adresse email invalide.");
    $("#go").disabled = true;
    let back = location.pathname === "/v/connexion" ? "/v/" : location.pathname;
    try { back = JSON.parse(ss.get("vt-pending") || "{}").back || back; } catch {}
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + back, shouldCreateUser: true } });
    if (error) { $("#go").disabled = false; return toast(errText(error)); }
    $("#lf").innerHTML = `<div style="text-align:center"><div style="font-weight:700;font-size:20px">Vérifie tes emails</div><p>On vient d'envoyer un lien à<br><b style="color:var(--ink)">${esc(email)}</b>.<br>Ouvre-le sur ce téléphone pour te connecter.</p></div>`;
  };
}

async function pageStore(slug) {
  const { data, error } = await sb.rpc("vitrine_store", { p_slug: slug });
  if (error || !data) return notFound("Ce commerce n'existe pas ou plus.");
  const s = data.store, list = (data.promos || []).map(p => ({ promo: p, store: s, d: dist(S.pos, s) }));
  document.title = `${s.name} · Vitriin`;
  const on = isFollowing(s.id);
  shell("feed", `<div class="pad"><button class="back" id="bk" aria-label="Retour">${IC.back}</button></div>
    <div class="pad row" style="gap:14px;padding-top:18px"><span class="av" style="width:64px;height:64px;border-radius:20px;background:var(--p);color:#fff;font-size:24px">${logo(s) ? `<img src="${esc(logo(s))}" alt="">` : init(s)}</span>
      <div style="flex:1;min-width:0"><h1 style="font-size:20px">${esc(s.name)}</h1><div style="font-size:13px;color:var(--muted);margin-top:3px">${esc([catLabel(s.category), s.city, km(dist(S.pos, s))].filter(Boolean).join(" · "))}</div>${s.demo ? `<div style="margin-top:6px"><span class="pill" style="background:#fff4d6;color:#7a5600">Commerce de démonstration</span></div>` : ""}</div></div>
    <div class="pad" style="display:flex;gap:10px;padding-top:16px"><button class="btn ${on ? "line" : "p"}" id="fl" style="flex:1">${on ? "Suivi ✓" : "Suivre"}</button><a class="btn line" style="flex:1" href="${mapsUrl(s)}" target="_blank" rel="noopener">${IC.go} Itinéraire</a></div>
    ${s.address ? `<p class="pad" style="font-size:13px;color:var(--muted);margin:12px 0 0">${esc(s.address)}</p>` : ""}
    <div class="sect"><span>${list.length ? `${list.length} promo${list.length > 1 ? "s" : ""} en cours` : "Promos en cours"}</span>${list.length ? `<button class="lnk" data-full>Plein écran${IC.chev}</button>` : ""}</div>
    <div class="list">${list.length ? list.map(cardHtml).join("") : emptyHtml("Pas de promo en ce moment", "Suis ce commerce pour être prévenu de ses prochaines promos.")}</div>`);
  $("#bk").onclick = () => history.length > 1 ? history.back() : go("/v/");
  $("#fl").onclick = async () => { const r = await toggleFollow(s); if (r != null) pageStore(slug); };
  $("[data-full]") && ($("[data-full]").onclick = () => openReels(list, 0));
  bindCards(app(), list);
}

async function pagePromo(id) {
  const { data, error } = await sb.rpc("vitrine_promo", { p_id: id });
  if (error || !data) return notFound("Cette promo est terminée ou n'existe plus.");
  await pageFeed();
  openReels([{ promo: data.promo, store: data.store, d: dist(S.pos, data.store) }], 0, true);
}

function notFound(msg) { shell("feed", `<div class="pad" style="padding-top:30px">${emptyHtml(msg, "Découvre les autres promos autour de toi.")}<a class="btn p" href="/v/" data-link>Voir les promos</a></div>`); }

/* ---------- Plein écran façon reels ---------- */
function openReels(list, start, direct) {
  if (!list.length) return;
  const el = document.createElement("div"); el.className = "reels"; el.id = "reels"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Promos en plein écran");
  el.innerHTML = list.map((x, k) => { const p = x.promo, s = x.store, pr = pricing(p), sv = isSaved(p.id); return `<section class="reel">
    ${p.img ? `<img src="${esc(p.img)}" alt="">` : ""}<div class="shade"></div>
    <div class="prog">${list.length > 1 ? list.slice(0, 8).map((_, j) => `<i class="${j === Math.min(k, 7) ? "on" : ""}"></i>`).join("") : ""}</div>
    <div class="rh"><button class="rb gl" data-x aria-label="Fermer">${IC.back}</button><a class="av" href="/v/m/${esc(s.slug)}" data-store="${k}">${logo(s) ? `<img src="${esc(logo(s))}" alt="">` : init(s)}</a>
      <a href="/v/m/${esc(s.slug)}" data-store="${k}" style="flex:1;min-width:0;line-height:1.25"><b>${esc(s.name)}</b><span>${esc([s.city, km(x.d)].filter(Boolean).join(" · "))}</span></a></div>
    <div class="side"><button data-sv="${k}" aria-pressed="${sv}"><i class="gl">${IC.save(sv)}</i><span>${sv ? "Enregistré" : "Enregistrer"}</span></button>
      <button data-cp="${k}"><i class="gl">${IC.coupon}</i>Coupon</button>
      <button data-sh="${k}"><i class="gl">${IC.share}</i>Partager</button></div>
    <div class="rinfo"><small>${esc(catLabel(s.category))} · Jusqu'au ${day(p.ends_at)}</small><h3>${esc(p.title)}</h3>${p.text || p.sub ? `<p>${esc(p.text || p.sub)}</p>` : ""}
      <div class="prc" style="margin-top:13px;align-items:center">${pr.price != null ? `<strong>${eur(pr.price)}</strong>${pr.old ? `<s>${eur(pr.old)}</s>` : ""}` : ""}<span class="bdg">${esc(pr.badge)}</span></div>
      <a class="rcta" href="${mapsUrl(s)}" target="_blank" rel="noopener">${IC.go}Trouver en magasin${x.d != null ? ` · ${km(x.d)}` : ""}</a>
      ${k < list.length - 1 ? `<div class="next"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>Promo suivante</div>` : direct ? `<a class="next" href="/v/" data-close style="color:#fff">Voir les autres promos près de moi</a>` : ""}</div>
  </section>`; }).join("");
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  el.scrollTop = start * window.innerHeight;
  const close = () => { el.remove(); document.body.style.overflow = ""; if (direct) history.replaceState({}, "", "/v/"); };
  $$("[data-x],[data-close]", el).forEach(b => b.onclick = (e) => { e.preventDefault(); close(); });
  $$("[data-store]", el).forEach(a => a.onclick = (e) => { e.preventDefault(); close(); go(`/v/m/${list[+a.dataset.store].store.slug}`); });
  $$("[data-sv]", el).forEach(b => b.onclick = async () => { const x = list[+b.dataset.sv]; if (!S.session) { close(); needLogin({ save: x.promo.id, back: `/v/p/${x.promo.id}` }); return; } const on = await toggleSave(x.promo, x.store); if (on != null) { b.innerHTML = `<i class="gl">${IC.save(on)}</i><span>${on ? "Enregistré" : "Enregistrer"}</span>`; b.setAttribute("aria-pressed", on); } });
  $$("[data-cp]", el).forEach(b => b.onclick = () => coupon(list[+b.dataset.cp]));
  $$("[data-sh]", el).forEach(b => b.onclick = () => { const x = list[+b.dataset.sh]; share(x.promo.title, `${x.promo.title} chez ${x.store.name}`, `${location.origin}/v/p/${x.promo.id}`); });
}
async function coupon(x) {
  const p = x.promo, s = x.store;
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="cp" role="dialog" aria-modal="true" aria-label="Coupon"><small>${esc(p.title)}</small><h3>Code produit</h3><div class="load" style="padding:40px 0">Activation…</div></div>`;
  ov.onclick = (e) => { if (e.target === ov || e.target.closest("[data-x]")) ov.remove(); };
  document.body.appendChild(ov);
  const pos = S.pos?.label === "Autour de moi" ? S.pos : await geo(4000);
  const { data, error } = await sb.rpc("vitrine_reveal", { p_id: p.id, p_client_id: clientId(), p_lat: pos?.lat ?? null, p_lng: pos?.lng ?? null });
  if (error) { ov.remove(); return toast(errText(error)); }
  const code = data?.ean || data?.code;
  $(".cp", ov).innerHTML = `<small>${esc(p.title)}</small><h3>${code ? "Code produit" : "Promo activée"}</h3>
    ${code ? `<svg class="bc" id="bc"></svg><div class="code">${esc(data.ean || data.code)}</div>` : `<p style="color:var(--muted);font-size:14px;line-height:1.5">Cette promo s'applique directement en caisse chez ${esc(s.name)}, sans code.</p>`}
    <div class="hint">${IC.clock}Présentez ce code en caisse</div><button class="btn p" data-x style="margin-top:18px">Fermer</button>`;
  if (code && window.JsBarcode) { try { const ean = data.ean && /^\d{13}$/.test(data.ean); JsBarcode("#bc", ean ? data.ean : code, { format: ean ? "EAN13" : "CODE128", displayValue: false, height: 100, margin: 0, width: 2.2 }); } catch { $("#bc", ov)?.remove(); } }
  if (S.session) refreshMe();
}
async function share(title, text, url) {
  try { if (navigator.share) return await navigator.share({ title, text, url }); } catch { return; }
  try { await navigator.clipboard.writeText(url); toast("Lien copié."); } catch { toast(url); }
}

/* ---------- Routeur ---------- */
function go(path) { history.pushState({}, "", path); route(); }
async function route() {
  $("#reels")?.remove(); document.body.style.overflow = "";
  const parts = location.pathname.replace(/^\/v\/?/, "").split("/").filter(Boolean);
  window.scrollTo(0, 0);
  try {
    if (!parts.length) await pageFeed();
    else if (parts[0] === "promos") await pagePromos();
    else if (parts[0] === "suivies") await pageFollows();
    else if (parts[0] === "profil" || parts[0] === "compte") await pageProfile();
    else if (parts[0] === "connexion") S.session ? go("/v/profil") : pageAuth();
    else if (parts[0] === "m" && parts[1]) await pageStore(decodeURIComponent(parts[1]));
    else if (parts[0] === "p" && /^[0-9a-f-]{36}$/i.test(parts[1] || "")) await pagePromo(parts[1]);
    else notFound("Page introuvable.");
  } catch (e) { notFound(errText(e)); }
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-link]");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target) return;
  e.preventDefault(); go(a.getAttribute("href"));
});
addEventListener("popstate", route);
sb.auth.onAuthStateChange(async (ev) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") { await refreshMe(); if (ev === "SIGNED_IN") { await runPending(); route(); } } });
(async () => { await refreshMe(); await runPending(); route(); })();
</script>
</body>
</html>
