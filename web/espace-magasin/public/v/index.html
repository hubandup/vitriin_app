<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitriin · Les promos près de chez vous</title>
<meta name="description" content="Les promos de vos commerces, près de chez vous. Présentez le coupon en caisse.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vitriin">
<link rel="manifest" href="/v/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Racing+Sans+One&display=swap" rel="stylesheet">
<style>
/* Vitriin · app particulier. Écrans de MOD-077, charte de la Centrale (MOD-085) : blanc, tuiles #F6F5F3 sans bordure,
   titres en graisse 500, boutons en pastille encre, magenta réservé à l'accent (« J'en profite »), menu du bas en pastille. */
:root{
  --p:#e5087e; --v:#951b81; --grad:linear-gradient(100deg,#e5087e 0%,#951b81 100%);
  --ink:#2D2D2D; --ink2:#55514C; --muted:#6F6A63; --faint:#6F6A63; --line:#ECE8E2; --line2:#D8D4CE; --chip:#EBE8E3; --surf:#F6F5F3; --pink:#FBE6F1;
  --rose:#FDF1F7; --sand:#faf6f0; --mint:#f2f6f2; --beige:#e6d4be; --sage:#aec0ae; --green:#3f8a55;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input{font-family:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
img{display:block}
.hidden{display:none!important}
b,strong,h1,h2,h3,h4{font-weight:600}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}
@media (min-width:560px){body{background:#e9e6e1}#app{max-width:430px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08)}}
#app{position:relative;min-height:100dvh;background:#fff}
.scr{padding:calc(var(--sat) + 22px) 0 calc(122px + var(--sab))}
.pad{padding-left:20px;padding-right:20px}
h1{font-size:34px;font-weight:500;letter-spacing:-.035em;margin:0;line-height:1.08}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;background:#fff}
.search{display:flex;align-items:center;gap:9px;background:var(--surf);border-radius:999px;padding:0 16px;min-height:50px;color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 8px}
.chip{flex:none;font-size:14px;font-weight:600;padding:0 16px;min-height:44px;border-radius:999px;border:none;background:var(--surf);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.reel>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.1) 55%,rgba(0,0,0,.25) 100%)}
.tag{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:999px}
.bdg{background:var(--p);color:#fff;font-family:'Racing Sans One',sans-serif;font-weight:400;font-size:16px;line-height:1;padding:6px 10px 5px;border-radius:12px}
.prc{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 9px;margin-top:7px}
.prc strong,.prc s,.mini,.bdg{white-space:nowrap}
.sect{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 12px}
.sect span{font-weight:600;font-size:20px;letter-spacing:-.02em}
.lnk{color:var(--ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:3px;min-height:40px;white-space:nowrap;flex:none}
.list{display:flex;flex-direction:column;gap:11px;padding:0 20px}
.dot{width:18px;height:18px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;flex:none;overflow:hidden}
.dot img{width:100%;height:100%;object-fit:cover;background:#fff}
.mini{font-family:'Racing Sans One',sans-serif;font-size:15px;font-weight:400;line-height:1;color:#fff;background:var(--p);padding:5px 8px 4px;border-radius:10px}
.empty{text-align:center;padding:50px 30px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--surf);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty b{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.empty p{font-size:13px;margin:5px 0 0;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border-radius:999px;font-weight:600;font-size:15.5px}
.btn.p{background:var(--ink);color:#fff;font-weight:600;font-size:17px;min-height:58px;border-radius:999px}
.btn.soft{background:var(--surf);color:var(--ink);font-weight:600;font-size:14.5px}
.btn.line{background:var(--surf);border:none;font-weight:600;font-size:14.5px}
.btn[disabled]{opacity:.55}
.eco{background:var(--ink);border-radius:28px;padding:20px 22px;color:#fff;margin-bottom:16px}
.eco b{display:block;font-family:'Racing Sans One',sans-serif;font-weight:400;font-size:38px;line-height:1;margin-top:6px;color:#fff}
.pill{background:#DDF1EA;color:#08705A;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
/* Commerces suivis, façon liste d'abonnements Instagram */
.ftabs{display:flex;background:var(--surf);border-radius:999px;padding:4px;margin:14px 20px 0}
.ftabs button{flex:1;min-height:42px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--muted)}
.ftabs button.on{color:#fff;background:var(--ink)}
.fsort{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px;font-size:14px;color:var(--muted)}
.fsort b{color:var(--ink)}
.frow{display:flex;align-items:center;gap:13px;padding:9px 20px}
.frow .ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:var(--line2);flex:none}
.frow .ring.new{background:linear-gradient(135deg,#e5087e,#951b81)}
.frow .ring .av{width:100%;height:100%;border:2.5px solid #fff;background:var(--chip);color:var(--ink);font-size:18px}
.frow .nm{flex:1;min-width:0;line-height:1.3}
.frow .nm b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .nm span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fbtn{min-width:92px;padding:0 14px;min-height:40px;border-radius:999px;background:var(--surf);color:var(--ink);font-weight:600;font-size:13.5px}
.frow .fbtn.go{background:var(--ink);color:#fff}
.fbtn{font-weight:600;font-size:12.5px;padding:0 15px;min-height:40px;border-radius:999px;flex:none}
.box{background:var(--surf);border:none;border-radius:24px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:56px;width:100%;text-align:left;font-size:14.5px}
.li+.li{border-top:1px solid #E2DED8}
.li .sp{flex:1}
.tg{width:44px;height:26px;border-radius:999px;padding:3px;display:flex;flex:none;background:var(--line2)}
.tg i{width:20px;height:20px;border-radius:50%;background:#fff}
.tg.on{background:var(--p);justify-content:flex-end}
.int{font-size:14px;font-weight:600;padding:0 16px;min-height:44px;border-radius:999px;background:var(--surf);color:var(--ink);border:none}
.int.on{background:var(--ink);color:#fff}
/* Dock flottant (même dessin que l'espace magasin, sans le « + ») */
nav.tabs{position:fixed;left:16px;right:16px;bottom:calc(18px + var(--sab));z-index:20;height:72px;border-radius:999px;background:#fff;box-shadow:0 12px 32px rgba(45,45,45,.16),0 0 0 1px var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px}
@media (min-width:560px){nav.tabs{left:calc(50% - 199px);right:auto;width:398px}}
nav.tabs a{display:flex;align-items:center;justify-content:center;height:52px;min-width:52px;border-radius:999px;color:var(--ink2);font-size:0;font-weight:600;white-space:nowrap;transition:background .15s}
nav.tabs a svg{width:22px;height:22px;flex:none}
nav.tabs a.on{background:var(--ink);color:#fff;font-size:14px;padding:0 18px}nav.tabs a.on svg{margin-right:8px}
@media (max-width:389px){nav.tabs{left:12px;right:12px}nav.tabs a{height:48px;min-width:48px}nav.tabs a.on{padding:0 14px;font-size:13.5px}nav.tabs a.on svg{margin-right:7px}}
@media (max-width:339px){nav.tabs{padding:0 8px}nav.tabs a{min-width:44px}}
/* Auth */
.auth{min-height:100dvh;background:#fff;display:flex;flex-direction:column;padding:calc(var(--sat) + 20px) 26px calc(26px + var(--sab))}
.logo{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:19px;background:var(--grad);color:#fff;font-weight:600;font-size:30px}
.auth h2{font-weight:500;font-size:34px;letter-spacing:-.035em;margin:18px 0 0;line-height:1.08}
.auth p{font-size:14.5px;color:var(--muted);margin:7px 0 0;line-height:1.45}
.inp{width:100%;min-height:56px;border:1.5px solid var(--line2);border-radius:18px;padding:0 16px;font-size:17px;font-weight:600;outline:none;background:#fff}
.inp:focus{border-color:var(--ink)}
.back{width:44px;height:44px;border-radius:50%;background:var(--surf);border:none;display:flex;align-items:center;justify-content:center}
.legal{text-align:center;font-size:11.5px;color:var(--faint);line-height:1.5}
.legal a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
/* Reels */
.reels{position:fixed;inset:0;z-index:40;background:#000;overflow-y:scroll;scroll-snap-type:y mandatory}
.reels.out{transition:transform .25s ease-out}
.apb{position:fixed;top:0;left:0;right:0;z-index:90;height:calc(env(safe-area-inset-top, 0px) + 38px);padding:env(safe-area-inset-top, 0px) 8px 0 16px;display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;font-size:13px;font-weight:600}
.apb button{color:#fff;font-weight:600;font-size:13px;padding:0 12px;min-height:30px;border-radius:999px;background:rgba(255,255,255,.16)}
.swh{position:fixed;left:50%;top:calc(var(--sat) + 74px);transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;animation:swh 3.6s ease forwards;pointer-events:none}
@keyframes swh{0%,8%{opacity:0;transform:translate(-50%,-6px)}14%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (min-width:560px){.reels{max-width:430px;margin:0 auto}}
.reel{position:relative;height:100dvh;scroll-snap-align:start;overflow:hidden;background:#1a1a1a}
.reel .shade{background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.25) 42%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.3) 100%)}
.rh{position:absolute;top:calc(var(--sat) + 14px);left:16px;right:16px;display:flex;align-items:center;gap:10px;color:#fff}
.gl{background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.rh .av{width:36px;height:36px;font-size:15px;background:rgba(255,255,255,.2);color:#fff}
.rh b{display:block;font-size:14px}.rh span{font-size:11.5px;color:rgba(255,255,255,.75)}
.side{position:absolute;right:12px;bottom:calc(var(--sab) + 150px);display:flex;flex-direction:column;gap:16px;align-items:center}
.side button,.side a{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:11px;font-weight:600}
.side i{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.side button,.side a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.side button.pop i{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
.rinfo{position:absolute;left:0;right:76px;bottom:0;padding:0 16px calc(var(--sab) + 22px);color:#fff}
.rinfo small{color:rgba(255,255,255,.6);font-size:12px}
.rinfo h3{font-size:22px;letter-spacing:-.01em;margin:6px 0 0}
.rinfo p{color:rgba(255,255,255,.78);font-size:13.5px;line-height:1.4;margin:6px 0 0}
.rinfo .prc strong{font-size:32px;letter-spacing:-.02em}.rinfo .prc s{color:rgba(255,255,255,.4);font-size:17px}
.rinfo .bdg{font-size:14px;border-radius:9px}
.rcta{position:relative;margin-top:16px;width:calc(100% + 60px);background:var(--p);color:#fff;font-weight:600;font-size:16.5px;min-height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:9px}
.next{display:flex;flex-direction:column;align-items:center;margin-top:12px;color:rgba(255,255,255,.45);font-size:11px;font-weight:600;width:calc(100% + 60px)}
/* Coupon */
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,16,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .18s}
.cp{width:100%;max-width:380px;background:#fff;border-radius:30px;padding:24px 22px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.cp small{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cp h3{font-size:19px;margin:4px 0 0}
.cp svg.bc{max-width:100%;height:auto;margin:18px 0 6px}
.cp .code{font-size:18px;font-weight:600;letter-spacing:.16em;word-break:break-all}
.cp .hint{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(106px + var(--sab));background:#2D2D2D;color:#fff;font-weight:600;font-size:14px;padding:13px 20px;border-radius:999px;z-index:80;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.load{padding:60px 0;text-align:center;color:var(--muted)}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* Feuille « J'en profite » : code flouté, affiché 2 minutes à la demande */
.ov.sh{align-items:flex-end;padding:0}
@media (min-width:560px){.ov.sh{align-items:center;padding:24px}}
.sht{width:100%;max-width:430px;background:#fff;border-radius:30px 30px 0 0;padding:10px 20px calc(22px + var(--sab));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out;max-height:100dvh;overflow-y:auto}
@media (min-width:560px){.sht{border-radius:30px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line2)}
.t1{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em}.t2{font-size:12.5px;color:var(--muted);margin-top:2px}
.xb{width:44px;height:44px;border-radius:50%;background:var(--surf);display:flex;align-items:center;justify-content:center;flex:none}
.cbox{position:relative;border:none;border-radius:24px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;background:var(--surf)}
.cbox small{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cbody{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;transition:filter .3s}
.cbody.blur{filter:blur(9px);user-select:none;pointer-events:none}
.cbody svg{max-width:100%;height:96px}
.cbody .qrb svg{height:100%}.cbody .g2{margin-top:6px}
.cbody .code{font-size:20px;font-weight:600;letter-spacing:.16em;word-break:break-all;text-align:center}
.cveil{position:absolute;inset:34px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.cveil span{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.92);padding:4px 10px;border-radius:999px}
.btn.dark{background:var(--ink);color:#fff;width:auto;padding:0 22px}
.btn.dark.full{width:100%}
.ctime{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.live{width:44px;height:6px;border-radius:999px;background:linear-gradient(90deg,#e5087e,#951b81,#5ebca3,#e5087e);background-size:300% 100%;animation:live 1.6s linear infinite}
@keyframes live{from{background-position:0 0}to{background-position:300% 0}}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2 .btn{font-size:13.5px;min-height:48px;padding:0 8px}
.keep{display:flex;align-items:center;gap:12px;padding:16px;border-radius:22px;background:var(--surf);text-align:left;width:100%}
.keep i{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.keep span{flex:1;font-size:13.5px;line-height:1.35}.keep em{font-style:normal;color:var(--muted)}
/* Validation en caisse par code vendeur ou QR */
.qrb{width:min(220px,62vw);aspect-ratio:1;border-radius:22px;overflow:hidden;border:none;background:#fff}
.qrb svg{display:block;width:100%;height:100%}
.pin{width:190px;text-align:center;font-family:inherit;font-weight:600;font-size:32px;line-height:1;letter-spacing:.45em;padding:12px 0 12px .45em;border:2px solid var(--line2);border-radius:20px;color:var(--ink);background:#fff}
.pin:focus{outline:none;border-color:var(--ink)}
.pin.err{border-color:#D0342C;animation:shk .32s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* Écran « Profité » */
.done{position:fixed;inset:0;z-index:70;background:#fff;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(var(--sat) + 18px) 22px calc(26px + var(--sab));gap:12px;animation:fade .2s}
@media (min-width:560px){.done{max-width:430px;margin:0 auto}}
.done .ok{position:relative;width:108px;height:108px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;margin-top:30px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.done .ok b{position:absolute;border-radius:50%}
.done h2{font-size:34px;font-weight:500;letter-spacing:-.035em;margin:0;line-height:1.08}
.done .fcard{width:100%;border:none;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surf)}
/* Ajout à l'écran d'accueil */
.ibar{position:absolute;top:calc(var(--sat) + 10px);left:10px;right:10px;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;background:rgba(20,20,20,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff}
.ibar .wm{font-weight:600;font-size:18px;letter-spacing:-.03em}
.ibar span{flex:1;font-size:12px;line-height:1.3;color:rgba(255,255,255,.86)}
.ibar .get{background:#fff;color:var(--ink);font-weight:600;font-size:13px;padding:0 14px;min-height:36px;border-radius:999px}
.reel.wb .rh{top:calc(var(--sat) + 76px)}
.strip{position:fixed;left:16px;right:16px;bottom:calc(102px + var(--sab));z-index:19;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 16px;border-radius:22px;background:var(--ink);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media (min-width:560px){.strip{max-width:398px;margin:0 auto}}

    $("#code", root).focus();

// Photo de profil : recadrée en carré 320 px (JPEG), rangée dans avatars/<uid>/, l'ancienne est supprimée.
async function pickAvatar() {
  if (APERCU) return apercuNo();
  const inp = Object.assign(document.createElement("input"), { type: "file", accept: "image/*" });
  inp.onchange = async () => {
    const f = inp.files?.[0]; if (!f) return;
    try {
      const bmp = await createImageBitmap(f), n = Math.min(bmp.width, bmp.height), c = document.createElement("canvas");
      c.width = c.height = 320;
      c.getContext("2d").drawImage(bmp, (bmp.width - n) / 2, (bmp.height - n) / 2, n, n, 0, 0, 320, 320);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
      const uid = S.session.user.id, path = `${uid}/${Date.now()}.jpg`, old = S.me?.prefs?.avatar_url;
      const up = await sb.storage.from("avatars").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) return toast(errText(up.error));
      if (!(await savePrefs({ avatar_url: sb.storage.from("avatars").getPublicUrl(path).data.publicUrl }))) return;
      if (old) { const k = old.split("/avatars/")[1]; if (k) await sb.storage.from("avatars").remove([k]); }
      toast("Photo mise à jour."); route();
    } catch { toast("Cette image n'a pas pu être lue."); }
  };
  inp.click();
}

// Stories : un rond par commerce qui a des promos autour de vous, les commerces suivis d'abord.

// Arrivée par un lien (post, QR code, newsletter) : la promo s'ouvre tout de suite en plein écran,
// suivie des autres promos du même commerce. En fermant, on arrive sur la fiche du commerce.
// Promo terminée : on montre directement les promos en cours du même commerce, sinon sa fiche.
async function pagePromo(id) {
  shell(null, `<div class="load">Chargement…</div>`);
  const { data, error } = await sb.rpc("vitrine_promo", { p_id: id });
  if (error || !data?.store?.slug) return notFound("Cette promo est terminée ou n'existe plus.");
  const s = data.store; ls.set("vt-origin", s.slug);
  const r = await sb.rpc("vitrine_store", { p_slug: s.slug });
  const more = (!r.error && r.data?.promos || []).filter(p => p.id !== id).map(p => ({ promo: p, store: r.data.store, d: dist(S.pos, r.data.store) }));
  if (data.ended) {
    if (!more.length) { history.replaceState({}, "", `/v/m/${s.slug}`); route(); return toast(`Cette promo est terminée. Suivez ${s.name} pour ne pas rater la prochaine.`); }
    toast(`Cette promo est terminée. Voici les promos en cours chez ${s.name}.`);
    return openReels(more, 0, s.slug);
  }
  openReels([{ promo: data.promo, store: s, d: dist(S.pos, s) }, ...more], 0, s.slug);
}

}

/* ---------- J'en profite : code flouté, affiché 2 minutes devant la caisse ---------- */
// Chaque affichage est enregistré côté serveur (vitrine_reveal) avec un indice de confiance
// (position, heure). Le code se refloute après 2 minutes : on le réaffiche en caisse.
const SHOW_SECONDS = 120;
const fakeBars = () => `<svg viewBox="0 0 290 96" preserveAspectRatio="none" aria-hidden="true">${[3,1,1,2,1,3,2,1,1,1,3,2,1,2,2,1,3,1,1,2,1,1,3,2,2,1,1,3,1,2,1,2,3,1,1,2,1,3,2,1].reduce((a, w, i) => { if (i % 2 === 0) a.h += `<rect x="${a.x}" y="0" width="${w * 3}" height="96" fill="#2D2D2D"/>`; a.x += w * 3 + 1; return a; }, { x: 0, h: "" }).h}</svg>`;
// Aperçu flouté avant « Afficher » : il montre la forme de CE mode (QR, saisie du code vendeur, code-barres,
// code promo web ou message), jamais celle d'un autre mode (BUG-014).
const fakeQr = () => { const n = 21, c = 6, f = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="none" stroke="#2D2D2D" stroke-width="${c}"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="#2D2D2D"/>`;
  let m = ""; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const corner = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12); if (!corner && (x * 7 + y * 13 + x * y) % 3 === 0) m += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}" fill="#2D2D2D"/>`; }
  return `<div class="qrb" style="border:none"><svg viewBox="-${c / 2} -${c / 2} ${n * c + c} ${n * c + c}" aria-hidden="true">${f(0, 0)}${f(14, 0)}${f(0, 14)}${m}</svg></div>`; };
const fakeFor = (chk) => chk === "qr" ? fakeQr()
  : chk === "pin" ? `<span class="t2" style="text-align:center">Le vendeur tape le code du magasin.</span><div class="pin" style="color:var(--faint)">····</div>`
  : chk === "web" ? `<div class="code" style="font-size:26px">PROMO00</div><div class="g2" style="width:100%"><div class="btn line">Copier le code</div><div class="btn line">Aller sur le site</div></div>`
  : chk === "ean" ? `${fakeBars()}<div class="code">0 000000 000000</div>`
  : `<p style="font-size:14.5px;line-height:1.5;margin:6px 0;color:var(--ink)">La promo s'applique directement en caisse. Montrez cet écran au vendeur.</p>`;
async function coupon(x) {
  const p = x.promo, s = x.store, pr = pricing(p);
  // UN seul mode de validation par promo (BUG-013) : qr (le vendeur scanne le QR), pin (le vendeur tape son code),
  // ean (code-barres ou code en caisse), web (code promo sur le site internet) ou none (le client confirme).
  const chk = ["qr", "pin", "ean", "web", "none"].includes(p.check) ? p.check : p.check === "vendor" ? "qr" : p.pin ? "pin" : "none";
  const byVendor = chk === "qr" || chk === "pin";
  const M = {
    qr: ["Votre QR code est prêt", "Afficher mon QR code", "Montrez ce QR au vendeur"],
    pin: ["Validation par le vendeur", "Faire valider par le vendeur", "Le vendeur tape son code"],
    ean: ["Votre code est prêt", "Afficher mon code", "Scannez en caisse"],
    web: ["Votre code promo", "Afficher le code promo", "Code promo · site internet"],
    none: ["Votre promo", "J'en profite", "Promo active"],
  }[chk];
  const ov = document.createElement("div"); ov.className = "ov sh";
  let timer = null, lock = null, shown = false;
  const stop = () => { clearInterval(timer); timer = null; try { lock?.release(); } catch {} lock = null; };
  ov.innerHTML = `<div class="sht" role="dialog" aria-modal="true" aria-label="J'en profite">
    <div class="grab"></div>
    <div class="row" style="gap:12px"><span class="av">${logo(s) ? `<img src="${esc(logo(s))}" alt="">` : init(s)}</span>
      <div style="flex:1;min-width:0"><b class="t1">${esc(p.title)}</b><div class="t2">${esc(s.name)} · jusqu'au ${day(p.ends_at)}</div></div>
      <button class="xb" data-x aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="cbox"><small id="clab">${M[0]}</small>
      <div class="cbody blur" id="cbody">${fakeFor(chk)}</div>
      <div class="cveil" id="cveil"><button class="btn dark" id="show"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>${M[1]}</button><span>${chk === "web" ? "À utiliser sur le site du magasin" : "À faire devant la caisse"}</span></div>
      <div class="ctime hidden" id="ctime"><i class="live"></i><span id="cleft">2:00</span><span>· luminosité au maximum</span></div></div>
    <div class="g2"><a class="btn line" href="${mapsUrl(s)}" target="_blank" rel="noopener">${IC.go}Y aller${x.d != null ? ` · ${km(x.d)}` : ""}</a><button class="btn line" id="c-sh"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10.5 13.5M21 3l-7 18-4-9-9-4 20-5Z"/></svg>Envoyer à un ami</button></div>
    ${isSaved(p.id) ? "" : `<button class="keep" id="keep"><i>${IC.bookmark(true)}</i><span><b>Garder ce code</b><br><em>Retrouvez-le dans Mes promos</em></span>${IC.chev}</button>`}
    <button class="btn dark full ${byVendor ? "hidden" : ""}" id="used" disabled>C'est fait, je l'ai utilisé</button></div>`;
  // QR de validation (MOD-075) : à usage unique, renouvelé toutes les 9 minutes ; on surveille la validation.
  let qrPoll = null, qrRenew = null;
  const stopQr = () => { clearInterval(qrPoll); clearTimeout(qrRenew); qrPoll = qrRenew = null; };
  const shut = () => { stop(); stopQr(); ov.remove(); };
  const startQr = async () => {
    stopQr();
    const box = $("#qrbox", ov), hint = $("#qrhint", ov); if (!box) return;
    try {
      await loadLib("/lib/qrcode.min.js");
      // Aperçu depuis l'espace magasin : QR d'exemple, non valable.
      const tok = APERCU ? null : (await sb.rpc("vitrine_use_token", { p_id: p.id, p_client_id: clientId() })).data;
      if (!APERCU && (!tok || !ov.isConnected)) throw new Error("no token");
      const q = qrcode(0, "M"); q.addData(APERCU ? `${location.origin}/magasin/` : `${location.origin}/magasin/?v=${tok}`); q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      hint.textContent = APERCU ? "Aperçu : chez le client, ce QR est unique." : "Le vendeur le scanne depuis son espace Vitriin.";
      if (APERCU) return;
    } catch {
      box.innerHTML = ""; hint.textContent = "QR indisponible pour l'instant. Nouvel essai dans quelques secondes…";
      qrRenew = setTimeout(startQr, 5000); return;
    }
    qrPoll = setInterval(async () => {
      if (!ov.isConnected) return stopQr();
      const { data } = await sb.rpc("vitrine_use_status", { p_id: p.id, p_client_id: clientId() });
      if (data === true) { shut(); done(x); }
    }, 2500);
    qrRenew = setTimeout(startQr, 9 * 60 * 1000);
  };
  // Code vendeur (mode pin) : le vendeur tape le code à 4 chiffres de son magasin sur ce téléphone.
  const bindPin = () => {
    const f = $("#pin", ov); if (!f) return;
    f.oninput = async () => {
      f.value = f.value.replace(/\D/g, "").slice(0, 4); f.classList.remove("err");
      if (f.value.length < 4) return;
      if (APERCU) { f.value = ""; return apercuNo(); }
      f.disabled = true;
      const { data, error } = await sb.rpc("vitrine_validate_use", { p_id: p.id, p_client_id: clientId(), p_pin: f.value });
      if (!error && data === "ok") { shut(); return done(x); }
      f.disabled = false; f.value = ""; void f.offsetWidth; f.classList.add("err"); f.focus();
      $("#pinmsg", ov).textContent = error ? errText(error)
        : data === "locked" ? "Trop d'essais. Réessayez dans 15 minutes."
        : data === "no_reveal" ? "Rouvrez la promo, puis faites valider."
        : data === "wrong_mode" ? "Cette promo ne se valide plus par code vendeur : rouvrez-la."
        : "Code incorrect. Il se trouve dans l'espace magasin Vitriin.";
    };
  };
  ov.onclick = (e) => { if (e.target === ov || e.target.closest("[data-x]")) shut(); };
  document.body.appendChild(ov);
  $("#c-sh", ov).onclick = () => share(p.title, `${p.title} chez ${s.name}`, `${location.origin}/v/p/${p.id}`);
  $("#keep", ov) && ($("#keep", ov).onclick = async () => {
    if (!S.session) { if (APERCU) return apercuNo(); shut(); $("#reels")?.remove(); document.body.style.overflow = ""; needLogin({ save: p.id, back: `/v/p/${p.id}` }); return; }
    if (await toggleSave(p, s)) $("#keep", ov)?.remove();
  });
  const blur = () => {
    stop(); $("#cbody", ov).classList.add("blur"); $("#cveil", ov).classList.remove("hidden"); $("#ctime", ov).classList.add("hidden");
    $("#clab", ov).textContent = "Code masqué"; $("#show", ov).lastChild.textContent = "Afficher à nouveau"; $("#show", ov).disabled = false;
  };
  $("#show", ov).onclick = async () => {
    const btn = $("#show", ov); btn.disabled = true; btn.lastChild.textContent = "Un instant…";
    const pos = APERCU ? null : await geo(4000);
    const { data, error } = APERCU ? await sb.rpc("vitrine_preview_code", { p_id: p.id })
      : await sb.rpc("vitrine_reveal", { p_id: p.id, p_client_id: clientId(), p_lat: pos?.lat ?? null, p_lng: pos?.lng ?? null });
    if (error) { btn.disabled = false; btn.lastChild.textContent = M[1]; return toast(errText(error)); }
    const code = data?.ean || data?.code, ean = !!(data?.ean && /^\d{13}$/.test(data.ean));
    const msg = (t) => `<p style="font-size:14.5px;line-height:1.5;margin:6px 0;color:var(--ink)">${t}</p>`;
    const body = $("#cbody", ov);
    if (chk === "qr") body.innerHTML = `<div class="qrb" id="qrbox" aria-label="QR code de validation"></div><span class="t2" id="qrhint">Un instant…</span>`;
    else if (chk === "pin") body.innerHTML = `<span class="t2" style="text-align:center">Montrez cet écran au vendeur : il tape le code du magasin.</span>
      <input class="pin" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Code vendeur à 4 chiffres"><span class="t2" id="pinmsg"></span>`;
    else if (chk === "web") body.innerHTML = code ? `<div class="code">${esc(code)}</div>
      <div class="g2" style="width:100%"><button class="btn line" id="c-copy">Copier le code</button>${s.website ? `<a class="btn p" style="min-height:54px;font-size:15.5px" href="${esc(s.website)}" target="_blank" rel="noopener">Aller sur le site</a>` : ""}</div>`
      : msg(`Code promo indisponible : contactez ${esc(s.name)}.`);
    else if (code) body.innerHTML = `<svg id="bc"></svg><div class="code">${esc(code)}</div>`;
    else body.innerHTML = msg(`La promo s'applique directement en caisse chez ${esc(s.name)}.<br>Montrez cet écran au vendeur.`);
    if (chk === "ean" && code && window.JsBarcode) { try { JsBarcode($("#bc", ov), ean ? data.ean : code, { format: ean ? "EAN13" : "CODE128", displayValue: false, height: 96, margin: 0, width: 2.2 }); } catch { $("#bc", ov)?.remove(); } }
    $("#c-copy", ov) && ($("#c-copy", ov).onclick = () => navigator.clipboard?.writeText(code).then(() => toast("Code copié"), () => toast(code)));
    body.classList.remove("blur"); $("#cveil", ov).classList.add("hidden");
    $("#clab", ov).textContent = M[2];
    $("#used", ov).disabled = false; shown = true;
    try { lock = await navigator.wakeLock?.request("screen"); } catch {}
    if (chk === "qr") startQr();
    else if (chk === "pin") bindPin();
    else if (chk !== "web") { // code et promo en caisse : affichés 2 minutes
      $("#ctime", ov).classList.remove("hidden");
      let left = SHOW_SECONDS; $("#cleft", ov).textContent = "2:00";
      timer = setInterval(() => { left--; if (!$("#cleft", ov)) return stop(); $("#cleft", ov).textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; if (left <= 0) blur(); }, 1000);
    }
    if (S.session) refreshMe();
  };
  // Le client confirme lui-même (code-barres, code promo, sans validation).
  $("#used", ov).onclick = async () => {
    if (!shown) return;
    if (APERCU) { shut(); return apercuNo(); }
    $("#used", ov).disabled = true;
    const { data } = await sb.rpc("vitrine_confirm_use", { p_id: p.id, p_client_id: clientId() });
    if (data === true) { shut(); return done(x); }
    // Refusé : la validation de la promo a changé depuis l'affichage.
    toast("Cette promo se valide désormais avec le vendeur : rouvrez-la."); shut();
  };
}

/* ---------- Après la caisse : « Profité » ---------- */
function done(x) {
  const p = x.promo, s = x.store, pr = pricing(p), fo = isFollowing(s.id);
  $("#reels")?.remove(); document.body.style.overflow = "";
  const el = document.createElement("div"); el.className = "done"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Promo utilisée");
  el.innerHTML = `<div style="align-self:flex-end"><button class="xb" data-x aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="ok"><b style="left:-24px;top:8px;width:10px;height:10px;background:#5ebca3"></b><b style="right:-26px;top:24px;width:8px;height:8px;background:var(--v);border-radius:2px"></b><b style="right:-12px;bottom:-4px;width:12px;height:12px;background:#f5ecd3"></b>
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div style="font-size:15px;color:var(--muted);margin-top:8px">Bien joué !</div>
    <h2>${pr.saving ? `${eur(pr.saving)} économisés` : "Promo utilisée"}</h2>
    <p style="font-size:14.5px;color:var(--muted);line-height:1.5;margin:0;max-width:300px">${esc(p.title)} chez ${esc(s.name)}, aujourd'hui.</p>
    <div style="flex:1;min-height:20px"></div>
    ${fo ? (S.session ? `<a class="btn line" href="/v/promos" data-link style="width:100%">Voir mes économies</a>` : "") : `<div class="fcard"><div class="row" style="gap:12px"><span class="av" style="width:48px;height:48px">${logo(s) ? `<img src="${esc(logo(s))}" alt="">` : init(s)}</span>
      <div style="flex:1"><b style="font-size:16px">Ne ratez plus leurs promos</b><div style="font-size:13.5px;color:var(--muted);margin-top:2px">Soyez prévenu dès leur prochaine offre.</div></div></div>
      <button class="btn p" id="d-fo">Suivre ${esc(s.name)}</button>${S.session ? "" : `<div style="text-align:center;font-size:12.5px;color:var(--muted)">Gratuit · une adresse email suffit</div>`}</div>`}
    <div class="g2" style="width:100%"><button class="btn line" id="d-sh">Partager le bon plan</button><a class="btn line" href="/v/" data-link>Autres promos</a></div>`;
  const shut = () => el.remove();
  document.body.appendChild(el);
  $("[data-x]", el).onclick = () => { shut(); if (location.pathname.startsWith("/v/p/")) history.replaceState({}, "", `/v/m/${s.slug}`); route(); };
  $$("a[data-link]", el).forEach(a => a.addEventListener("click", shut));
  $("#d-sh", el).onclick = () => share(p.title, `Bon plan : ${p.title} chez ${s.name}`, `${location.origin}/v/p/${p.id}`);
  $("#d-fo", el) && ($("#d-fo", el).onclick = async () => {
    if (!S.session) { if (APERCU) return apercuNo(); shut(); needLogin({ follow: s.id, back: `/v/m/${s.slug}` }); return; }
    if (await toggleFollow(s)) { shut(); go(`/v/m/${s.slug}`); }
  });
}

/* ---------- Télécharger l'application ---------- */
function installSheet() { const u = storeUrl(); if (u) location.href = u; }
async function share(title, text, url) {
  try { if (navigator.share) return await navigator.share({ title, text, url }); } catch { return; }
  try { await navigator.clipboard.writeText(url); toast("Lien copié."); } catch { toast(url); }
}

/* ---------- Onboarding (première connexion) : envies, commerces, alertes ---------- */
function maybeOnboard() {
  const uid = S.session?.user?.id;
  if (!uid || S.me?.prefs?.first_name || ls.get("vt-onb-" + uid) || $(".onb")) return;
  const O = { name: "", ints: new Set(S.me?.prefs?.interests || []), fol: new Set((S.me?.follows || []).map(f => f.id)), alerts: true, step: 0 };
  const stores = (() => { const m = new Map(); (S.origin?.list || []).concat(S.items || []).forEach(x => m.set(x.store.id, x.store)); (S.me?.follows || []).forEach(f => m.set(f.id, f)); return [...m.values()].slice(0, 12); })();
  const cats = [...new Set([...Object.keys(CAT), ...(S.items || []).map(x => x.store.category).filter(Boolean)])];
  const el = document.createElement("div"); el.className = "onb"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Bienvenue");
  document.body.appendChild(el);
  const finish = async () => {
    ls.set("vt-onb-" + uid, "1");
    await savePrefs({ first_name: O.name.trim() || null, interests: [...O.ints], alerts: O.alerts });
    const add = [...O.fol].filter(id => !isFollowing(id));
    if (add.length) await sb.from("customer_follows").upsert(add.map(store_id => ({ store_id })), { onConflict: "user_id,store_id", ignoreDuplicates: true });
    await refreshMe(); el.remove(); route(); toast(O.name ? `Bienvenue ${O.name.trim()} !` : "Bienvenue sur Vitriin !");
  };
  const draw = () => {
    const bars = `<div class="bars">${[0, 1, 2].map(i => `<i class="${i <= O.step ? "on" : ""}"></i>`).join("")}<span style="flex:1"></span><button class="lnk" id="o-skip" style="color:var(--muted)">Passer</button></div>`;
    if (O.step === 0) el.innerHTML = `${bars}<h2>Bienvenue sur Vitriin</h2>
      <label for="o-n" style="font-size:13px;font-weight:600">Votre prénom</label><input class="inp" id="o-n" maxlength="40" autocomplete="given-name" value="${esc(O.name)}" style="margin-top:-6px">
      <b style="font-size:19px;margin-top:10px">Qu'est-ce qui vous fait craquer ?</b><p class="sub">On mettra ces promos en premier.</p>
      <div class="chipset">${cats.map(c => `<button class="int ${O.ints.has(c) ? "on" : ""}" data-i="${esc(c)}" aria-pressed="${O.ints.has(c)}">${picto(c)}${esc(catLabel(c))}</button>`).join("")}</div>
      <span style="flex:1"></span><button class="btn dark full" id="o-next">Continuer</button>`;
    else if (O.step === 1) el.innerHTML = `${bars}<h2>Vos commerces près de chez vous</h2><p class="sub">Suivez-les : leurs promos arrivent en premier dans votre fil.</p>
      <div>${stores.length ? stores.map((st, k) => `<div class="sl"><span class="av" style="width:48px;height:48px">${logo(st) ? `<img src="${esc(logo(st))}" alt="">` : init(st)}</span>
        <span style="flex:1;min-width:0"><b style="display:block;font-size:15px">${esc(st.name)}</b><small style="font-size:12.5px;color:var(--muted)">${esc([catLabel(st.category), km(dist(S.pos, st))].filter(Boolean).join(" · "))}</small></span>
        <button class="fbtn" data-f="${k}" style="${O.fol.has(st.id) ? "background:#f4f3f0" : "background:var(--p);color:#fff"}">${O.fol.has(st.id) ? "Suivi" : "Suivre"}</button></div>`).join("")
        : `<p class="sub" style="margin-top:8px">Choisissez une ville dans Découvrir pour voir les commerces autour de vous.</p>`}</div>
      <span style="flex:1"></span><button class="btn dark full" id="o-next">Continuer${O.fol.size ? ` · ${O.fol.size} suivi${O.fol.size > 1 ? "s" : ""}` : ""}</button>`;
    else el.innerHTML = `${bars}<h2>Ne ratez aucune promo</h2><p class="sub">Une alerte quand un commerce que vous suivez publie une nouvelle offre. Rien d'autre.</p>
      <button class="li box" id="o-al" role="switch" aria-checked="${O.alerts}" style="margin-top:6px"><span class="sp">Alertes promos</span><span class="tg ${O.alerts ? "on" : ""}"><i></i></span></button>
      ${storeUrl() ? `<a class="btn line" href="${esc(storeUrl())}">Obtenir l'application Vitriin</a>` : ""}
      <span style="flex:1"></span><button class="btn p" id="o-next">C'est parti</button>`;
    $("#o-skip", el).onclick = finish;
    $("#o-n", el) && ($("#o-n", el).oninput = (e) => { O.name = e.target.value; });
    $$("[data-i]", el).forEach(b => b.onclick = () => { const c = b.dataset.i; O.ints.has(c) ? O.ints.delete(c) : O.ints.add(c); b.classList.toggle("on"); b.setAttribute("aria-pressed", O.ints.has(c)); });
    $$("[data-f]", el).forEach(b => b.onclick = () => { const id = stores[+b.dataset.f].id; O.fol.has(id) ? O.fol.delete(id) : O.fol.add(id); draw(); });
    $("#o-al", el) && ($("#o-al", el).onclick = () => { O.alerts = !O.alerts; draw(); });
    $("#o-next", el).onclick = () => { if (O.step < 2) { O.step++; draw(); el.scrollTop = 0; } else finish(); };
  };
  draw();
}

/* ---------- Routeur ---------- */
function go(path) { history.pushState({}, "", path); route(); }
async function route() {
  $("#reels")?.remove(); document.body.style.overflow = "";
  const parts = location.pathname.replace(/^\/v\/?/, "").split("/").filter(Boolean);
  window.scrollTo(0, 0);
  try {
    if (!parts.length) await pageFeed();
    else if (parts[0] === "promos") await pagePromos();
    else if (parts[0] === "suivies") await pageFollows();
    else if (parts[0] === "profil" || parts[0] === "compte") await pageProfile();
    else if (parts[0] === "connexion") S.session ? go("/v/profil") : pageAuth();
    else if (parts[0] === "m" && parts[1]) await pageStore(decodeURIComponent(parts[1]));
    else if (parts[0] === "p" && /^[0-9a-f-]{36}$/i.test(parts[1] || "")) await pagePromo(parts[1]);
    else notFound("Page introuvable.");
  } catch (e) { notFound(errText(e)); }
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-link]");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target) return;
  e.preventDefault(); go(a.getAttribute("href"));
});
addEventListener("popstate", route);
sb.auth.onAuthStateChange(async (ev) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") { await refreshMe(); if (ev === "SIGNED_IN") { $("#gate")?.remove(); await runPending(); route(); maybeOnboard(); } } });
if (APERCU) {
  document.documentElement.style.setProperty("--sat", "calc(env(safe-area-inset-top, 0px) + 38px)");
  const b = document.createElement("div"); b.className = "apb";
  b.innerHTML = `<span>Aperçu : ce que voient vos clients</span><button>Fermer</button>`;
  b.querySelector("button").onclick = () => parent.postMessage("vitriin:apercu-close", location.origin);
  document.body.appendChild(b);
}
(async () => { await refreshMe(); if (!APERCU) await runPending(); route(); if (!APERCU) { maybeOnboard(); autoLocate(); } })();
</script>
</body>
