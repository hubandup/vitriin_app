<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vitriin Manager</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--p:#e5087e;--v:#951b81;--grad:linear-gradient(90deg,#e5087e,#951b81);--ink:#2D2D2D;--muted:#8a847c;--line:#ECE8E2;--bg:#f6f3ee;--card:#fff;--ok:#0c9875;--err:#c0352b;--warn:#b26a00;--t-ok:#e7f5f0;--t-err:#fdecea;--t-warn:#fff4e0;--t-p:#fdf0f6}
@media (prefers-color-scheme:dark){:root{--ink:#f1ede7;--muted:#a39d94;--line:#2f2b27;--bg:#151312;--card:#1f1c1a;--t-ok:#173a30;--t-err:#3d1f1c;--t-warn:#3a2c14;--t-p:#3a1a2c}}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--p)}
.shell{display:flex;min-height:100vh}
.side{flex:none;width:236px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}.brand img{width:38px;height:38px;border-radius:10px;flex:none}
.brand b{display:block;font-size:15.5px;letter-spacing:-.02em}.brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.sect{margin:20px 0 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:0 10px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:none;border-radius:11px;text-align:left;font-weight:600;font-size:14px;background:transparent;color:var(--ink)}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--t-p);color:var(--v)}
.nav svg{flex:none;opacity:.85}
.nav em{font-style:normal;background:var(--err);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 7px;margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 6px}
.side-foot .me{font-size:12.5px;color:var(--muted);word-break:break-all}
.side-foot .me button{border:none;background:none;padding:0;color:var(--p);font-weight:700;font-size:12.5px;display:block;margin-top:2px}
.main{flex:1;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
@media (max-width:860px){
  .shell{flex-direction:column}
  .side{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px 14px 0}
  .sect,.side-foot .mail{display:none}
  .navs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;margin-top:10px}.navs .nav{display:contents}
  .nav button{white-space:nowrap;padding:9px 11px}
  .side-foot{flex-direction:row;align-items:center;justify-content:space-between;padding:8px 2px 10px}
  .wrap{padding:16px 16px 60px}
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
h2{font-size:18px;margin:0}h3{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0;line-height:1.45}
.ck{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}.kpi span{font-size:12.5px;color:var(--muted)}.kpi small{display:block;font-size:12px;margin-top:4px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--err)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.on{border-color:var(--p);box-shadow:0 0 0 2px rgba(229,8,126,.15)}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px}
.chart i{flex:1;background:var(--grad);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.chart.v i{background:#2f6fdb}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.todo:last-child{border-bottom:none}
.todo .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--err)}.todo .dot.w{background:var(--warn)}
.todo b{display:block;font-size:13.5px}.todo span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.logo{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--muted)}
.lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.stats div{background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center}.stats b{display:block;font-size:16px}.stats span{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-p{border:none;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;padding:10px 14px}
.btn-s{border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;padding:8px 12px;text-decoration:none;display:inline-block;color:var(--ink)}
.btn-s.sm{padding:5px 9px;font-size:12px;border-radius:9px}
button:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--t-ok);color:var(--ok);white-space:nowrap}
.pill.err{background:var(--t-err);color:var(--err)}.pill.warn{background:var(--t-warn);color:var(--warn)}.pill.grey{background:var(--bg);color:var(--muted)}.pill.p{background:var(--t-p);color:var(--p)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{color:var(--muted);font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
td small{display:block;color:var(--muted);font-size:12px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--card);color:var(--ink)}
.search{max-width:280px}
select.in{width:auto}
.auth{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.auth h1{margin:0 0 4px;font-size:22px}
label.f{display:block;font-size:12.5px;font-weight:700;margin-top:14px}label.f .in{margin-top:6px}
.err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);z-index:9}
.hidden{display:none}
.help{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--muted)}.help b{color:var(--ink)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.list{list-style:none;margin:0;padding:0}.list li:last-child{border-bottom:none}
pre{background:var(--bg);border-radius:12px;padding:12px;font-size:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.ch{display:inline-flex;gap:4px}.ch span{font-size:11px;font-weight:700;border-radius:6px;padding:2px 5px;background:var(--bg);color:var(--muted)}
.ch .ok{background:var(--t-ok);color:var(--ok)}.ch .ko{background:var(--t-err);color:var(--err)}
.back{border:none;background:none;color:var(--muted);font-weight:700;padding:0;margin-bottom:8px}
.todo{cursor:pointer;border-radius:10px}.todo:hover{background:var(--bg)}.todo>div{flex:1;min-width:0}
.todo .x{border:none;background:none;color:var(--muted);font-size:12px;font-weight:700;padding:2px 4px;white-space:nowrap;opacity:.8}.todo .x:hover{color:var(--p)}
.todo .dot.b{background:#2f6fdb}
.ov{position:fixed;inset:0;background:rgba(20,16,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:8}
.modal{background:var(--card);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal h3{font-size:17px;margin:0 0 4px}.modal .why{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin:14px 0}
.modal ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;line-height:1.6}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}.acts>*{text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;color:var(--muted)}.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.msg{border-radius:14px;padding:11px 13px;margin-top:10px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;max-width:85%}
.msg.client{background:var(--bg)}.msg.staff{background:var(--t-p);margin-left:auto}.msg.internal{background:var(--t-warn);margin-left:auto;border:1px dashed var(--warn)}
.msg small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:700}
textarea.in{min-height:110px;resize:vertical}
.prog{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--grad);border-radius:999px}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.step:last-child{border-bottom:none}
.step .ok{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted)}
.step .ok.y{background:var(--ok);color:#fff}.step small{color:var(--muted);margin-left:auto;white-space:nowrap}
.unread{width:8px;height:8px;border-radius:50%;background:var(--p);display:inline-block;margin-right:6px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast hidden" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Vitriin Manager : poste de pilotage de l'équipe Vitriin. Chaque fonction
// serveur appelée ici vérifie is_platform_admin() ; la page n'a que la clé publique.
const SUPABASE_URL = "https://zjugauidrijghesgsmap.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqdWdhdWlkcmlqZ2hlc2dzbWFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMjQ4NjIsImV4cCI6MjA5OTgwMDg2Mn0.my-aiIKcse_2N98x1xV0l-mvyXuXlZ34DqnFFTYHWpU";
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY, { auth: { storageKey: "vitriin-manager-auth" } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (n) => new Intl.NumberFormat("fr-FR").format(Math.round(n || 0));
const cnum = (n) => n >= 1e4 ? Math.round(n / 1e3) + " k" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(".", ",").replace(",0", "") + " k" : nf(n);
const day = (d) => d ? new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }).replace(".", "") : "—";
const since = (d) => { if (!d) return "jamais"; const j = Math.floor((Date.now() - new Date(d)) / 864e5); return j <= 0 ? "aujourd'hui" : j === 1 ? "hier" : `il y a ${j} j`; };
const errText = (e) => (e && (e.message || e.error_description)) || String(e);
const ls = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let tt; const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.remove("hidden"); clearTimeout(tt); tt = setTimeout(() => el.classList.add("hidden"), 3800); };
const rpc = async (n, a) => { const { data, error } = await sb.rpc(n, a); if (error) throw error; return data; };

const svg = (p) => `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const NAV = [
  ["PILOTAGE", [["home", "Accueil", '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'],
    ["support", "Support", '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/>'],
    ["clients", "Clients", '<path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/>'],
    ["stores", "Magasins", '<path d="M3 9 4.6 4.5h14.8L21 9"/><path d="M3.4 9h17.2v1.6a2.6 2.6 0 0 1-5.2 0 2.6 2.6 0 0 1-5.2 0 2.6 2.6 0 0 1-5.2 0V9Z"/><path d="M5 11.4V20h14v-8.6"/>']]],
  ["COMMERCIAL", [["demos", "Démos", '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'],
    ["site", "Site web", '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>']]],
  ["TECHNIQUE", [["health", "Santé", '<path d="M3 12h4l3-8 4 16 3-8h4"/>']]],
];
const UI = { tab: ls.get("m-tab", "home"), demo: ls.get("m-demo", true), net: null, q: "", sf: "all" };
const C = {}; // cache des réponses serveur, par onglet
const MILESTONES = [["Validation Meta (App Review)", "2026-11-30"], ["Bêta Brisach prête", "2026-12-08"]];
let busy = false;

/* ---------- Connexion ---------- */
function showLogin(msg = "") {
  $("app").innerHTML = `<div class="auth"><h1>Vitriin Manager</h1><p class="sub">Espace réservé à l'équipe Vitriin.</p>
    <label class="f">Email<input class="in" id="l-email" type="email" autocomplete="username"></label>
    <label class="f">Mot de passe<input class="in" id="l-pass" type="password" autocomplete="current-password"></label>
    <div class="err" id="l-err">${esc(msg)}</div><button class="btn-p" id="l-go" style="width:100%;margin-top:6px">Se connecter</button></div>`;
  const go = async () => {
    $("l-go").disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pass").value });
    if (error) { $("l-go").disabled = false; $("l-err").textContent = "Email ou mot de passe incorrect."; return; }
    boot();
  };
  $("l-go").onclick = go; $("l-pass").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const ok = await rpc("is_platform_admin").catch(() => false);
  if (!ok) { await sb.auth.signOut(); return showLogin("Ce compte n'a pas accès au Manager."); }
  UI.email = session.user.email;
  show();
}

/* ---------- Chargement par onglet ---------- */
async function need(tab) {
  const d = UI.demo;
  if (tab === "home") C.home = await rpc("manager_dashboard", { p_demo: d });
  if (tab === "clients" || tab === "demos") C.ov = await rpc("manager_overview");
  if (tab === "clients") C.onb = await rpc("manager_onboarding_all");
  if (tab === "support") C.tk = await rpc("manager_tickets", { p_status: UI.tkf || "active" });
  if (tab === "ticket") C.ticket = await rpc("manager_ticket", { p_id: UI.ticket });
  if (tab !== "home" && !C.home) C.home = await rpc("manager_dashboard", { p_demo: d }).catch(() => null);
  if (tab === "stores") C.stores = await rpc("manager_stores", { p_demo: d });
  if (tab === "health") C.health = await rpc("manager_health", { p_demo: d });
  if (tab === "site") C.site = await rpc("manager_site", { p_days: 30 });
  if (tab === "net") [C.net, C.netOnb] = await Promise.all([rpc("manager_network", { p_id: UI.net }), rpc("manager_onboarding", { p_net: UI.net })]);
}
async function show(tab = UI.tab) {
  UI.tab = tab; ls.set("m-tab", tab === "net" ? "clients" : tab === "ticket" ? "support" : tab);
  frame(`<div class="empty" style="padding:40px 0">Chargement…</div>`);
  try { await need(tab); frame(VIEWS[tab]()); bind(); }
  catch (e) { frame(`<div class="help" style="margin-top:16px">Chargement impossible : ${esc(errText(e))}</div>`); }
}
function frame(inner) {
  const todo = C.home ? todoItems().length : 0, tk = C.home?.ticketsUnread || 0;
  $("app").innerHTML = `<div class="shell">
    <aside class="side"><div class="brand"><img src="/icon-512.png" alt=""><div><b>Vitriin Manager</b><span>Poste de pilotage</span></div></div>
      <div class="navs">${NAV.map(([sect, items]) => `<div class="sect">${sect}</div><nav class="nav">${items.map(([k, l, ic]) => `<button class="${(UI.tab === k || (UI.tab === "net" && k === "clients") || (UI.tab === "ticket" && k === "support")) ? "on" : ""}" data-tab="${k}">${svg(ic)}<span>${l}</span>${k === "home" && todo ? `<em>${todo}</em>` : k === "support" && tk ? `<em>${tk}</em>` : ""}</button>`).join("")}</nav>`).join("")}</div>
      <div class="side-foot"><label class="ck"><input type="checkbox" id="demo-ck" ${UI.demo ? "checked" : ""}> Inclure les démos</label>
        <div class="me"><span class="mail">${esc(UI.email || "")}</span><button id="out">Se déconnecter</button></div></div></aside>
    <main class="main"><div class="wrap"><div id="view">${inner}</div></div></main></div>`;
  $("out").onclick = async () => { await sb.auth.signOut(); showLogin(); };
  $("demo-ck").onchange = (e) => { UI.demo = e.target.checked; ls.set("m-demo", UI.demo); Object.keys(C).forEach(k => delete C[k]); show(UI.tab); };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => show(b.dataset.tab));
}

/* ---------- Petits composants ---------- */
const kpi = (v, l, extra = "", color = "") => `<div class="kpi"><b ${color ? `style="color:${color}"` : ""}>${v}</b><span>${l}</span>${extra}</div>`;
const trend = (a, b) => { if (!b) return a ? `<small class="up">nouveau</small>` : ""; const p = Math.round((a - b) / b * 100); return `<small class="${p >= 0 ? "up" : "down"}">${p >= 0 ? "+" : ""}${p} % vs 30 j précédents</small>`; };
function bars(series, key, cls = "") {
  const max = Math.max(1, ...series.map(s => s[key]));
  return `<div class="chart ${cls}">${series.map(s => `<i style="height:${Math.max(2, s[key] / max * 100)}%" title="${day(s.d)} : ${s[key]}"></i>`).join("")}</div>
    <div class="axis"><span>${day(series[0]?.d)}</span><span>${day(series[series.length - 1]?.d)}</span></div>`;
}
const chState = (ch) => { const s = (k, l) => { const v = ch?.[k]; return `<span class="${v === "active" ? "ok" : v ? "ko" : ""}" title="${v === "active" ? "Connecté" : v === "off" ? "Désactivé par le magasin" : v ? "À reconnecter" : "Non connecté"}">${l}</span>`; }; return `<span class="ch">${s("facebook", "FB")}${s("instagram", "IG")}</span>`; };
const logo = (n) => n.logo_url ? `<img class="logo" src="${esc(n.logo_url)}" alt="">` : `<span class="logo">${esc((n.name || "?").slice(0, 1))}</span>`;

/* ---------- Accueil ---------- */
function vHome() {
  const D = C.home, T = D.todo, st = D.stores || 0;
  const pct = (a) => st ? Math.round(a / st * 100) + " %" : "—";
  const items = todoItems();

/* ---------- À traiter : liste, actions, marquer comme lu ---------- */
const CH = (c) => c === "instagram" ? "Instagram" : "Facebook";
function todoItems() {
  if (!C.home) return [];
  const T = C.home.todo;
  return [
    ...(T.tickets || []).map(x => ({ type: "ticket", x, w: 2, t: `Support · ${x.subject}`, s: `${x.store || x.network || ""} · ${x.created_by_email || ""} · ${since(x.created_at)}` })),
    ...T.accounts.map(x => ({ type: "account", x, w: 0, t: `${x.store} · ${CH(x.channel)} à reconnecter`, s: `${x.network || "Indépendant"}${x.last_error ? " · " + x.last_error : ""}` })),
    ...T.failures.map(x => ({ type: "failure", x, w: 0, t: `Échec ${CH(x.channel)} · « ${x.promo} »`, s: `${x.store} · ${x.network || "Indépendant"} · ${day(x.created_at)}${x.error_message ? " · " + x.error_message : ""}` })),
    ...T.invites.map(x => ({ type: "invite", x, w: 1, t: x.activated ? `${x.store} : compte activé, aucun réseau connecté` : `${x.store} n'a pas activé son compte`, s: `Invité le ${day(x.invited_at)} · ${x.contact_email || "sans email"} · ${x.network || ""}` })),
    ...T.idle.map(x => ({ type: "idle", x, w: 1, t: `${x.network} ne se connecte plus`, s: `Dernière connexion de l'équipe : ${since(x.last_seen)}` })),
  ];
}
const mailto = (to, subject, body) => `mailto:${encodeURIComponent(to || "")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
const SIGN = "\n\nL'équipe Vitriin\nsupport@vitriin.co";
const RECONNECT = (ch) => `Bonjour,\n\nVotre compte ${CH(ch)} n'est plus relié à Vitriin : vos promotions ne peuvent plus y être publiées.\n\nPour le reconnecter (1 minute) :\n1. Ouvrez l'app Vitriin (app.vitriin.co/magasin).\n2. Allez dans Réglages > Comptes connectés.\n3. Touchez « Reconnecter » à côté de ${CH(ch)} et validez avec votre compte Facebook.\n\nSi votre mot de passe Facebook a changé ou si vous n'êtes plus administrateur de la Page, c'est la cause la plus fréquente.` + SIGN;
// Ce qu'il faut faire, élément par élément.
function todoGuide(i) {
  const x = i.x, to = x.owner || x.contact_email, fiche = x.network_id ? `<button class="btn-s" data-goto-net="${x.network_id}">Voir la fiche ${esc(x.network || "client")}</button>` : "";
  const reset = to ? `<button class="btn-s" data-reset="${esc(to)}" data-to="magasin">Renvoyer l'accès à ${esc(to)}</button>` : "";
  const mail = (subject, body) => to ? `<a class="btn-p" href="${mailto(to, subject, body)}">Écrire au gérant (${esc(to)})</a><button class="btn-s" data-copy="${esc(body)}">Copier le message</button>` : `<p class="sub">Aucun email connu pour ce magasin : ajoutez-le dans la fiche du magasin (Espace Centrale).</p>`;
  if (i.type === "ticket") return { h: x.subject, why: `Demande de ${esc(x.created_by_email || "")} (${esc(x.store || x.network || "")}), ${since(x.created_at)}.`, steps: ["Lire la demande et le contexte joint (état des comptes au moment de la demande).", "Répondre depuis le ticket : le client voit la réponse dans son app."], acts: `<button class="btn-p" data-open-ticket="${x.id}">Ouvrir le ticket</button>` };
  if (i.type === "account" || (i.type === "failure" && x.account_issue)) return {
    h: `${x.store} : ${CH(x.channel)} à reconnecter`,
    why: `Meta a refusé l'accès au compte ${CH(x.channel)} de ce magasin${x.last_error || x.error_message ? ` (« ${esc(x.last_error || x.error_message)} »)` : ""}. Causes habituelles : mot de passe Facebook changé, droits d'administration de la Page perdus, ou autorisation Vitriin retirée. Tant qu'il n'est pas reconnecté, ses promos ne partent pas sur ${CH(x.channel)}.`,
    steps: ["Prévenir le gérant avec le mode d'emploi ci-dessous.", "Il reconnecte depuis l'app : Réglages > Comptes connectés > Reconnecter.", "Les promos en échec se republient ensuite depuis Stats > À résoudre."],
    acts: mail(`Vitriin : reconnectez votre compte ${CH(x.channel)}`, RECONNECT(x.channel)) + reset + fiche };
  if (i.type === "failure") return {
    h: `Publication refusée par ${CH(x.channel)}`,
    why: `« ${esc(x.promo)} » n'a pas pu être publiée sur ${CH(x.channel)} pour ${esc(x.store)}${x.error_message ? ` : « ${esc(x.error_message)} »` : ""}. Le compte est bien connecté : c'est le contenu qui a été refusé.`,
    steps: ["Vérifier le visuel : JPEG, format entre 4:5 (portrait) et 1,91:1 (paysage), moins de 8 Mo.", "Vérifier le texte : 2 200 caractères maximum et 30 hashtags au plus sur Instagram.", "Corriger la promo (Espace Centrale, ou le magasin s'il l'a personnalisée), puis republier depuis l'app : Stats > À résoudre > Republier."],
    acts: mail(`Vitriin : votre promo « ${x.promo} » n'a pas été publiée`, `Bonjour,\n\nLa promo « ${x.promo} » n'a pas pu être publiée sur ${CH(x.channel)}${x.error_message ? ` (motif : ${x.error_message})` : ""}.\n\nDans l'app Vitriin, ouvrez Stats > À résoudre puis touchez « Republier ». Si le message revient, répondez-nous et nous regardons ensemble.` + SIGN) + fiche };
  if (i.type === "invite") return x.activated ? {
    h: `${x.store} n'a connecté aucun réseau`,
    why: `Le gérant a activé son compte mais n'a relié ni Facebook ni Instagram : les promos de la centrale ne peuvent pas être publiées pour ce magasin.`,
    steps: ["Envoyer le mode d'emploi de connexion.", "Proposer un appel de 5 minutes si besoin : la connexion se fait avec le compte Facebook administrateur de la Page du magasin."],
    acts: mail("Vitriin : connectez votre Page Facebook et Instagram", `Bonjour,\n\nVotre espace Vitriin est prêt, il ne manque que la connexion à vos réseaux :\n1. Ouvrez l'app Vitriin (app.vitriin.co/magasin).\n2. Réglages > Comptes connectés > Connecter Facebook.\n3. Choisissez la Page de votre magasin (et son compte Instagram).\n\nC'est tout : les promos de votre centrale seront publiées automatiquement sur vos réseaux.` + SIGN) + reset + fiche } : {
    h: `${x.store} n'a pas activé son compte`,
    why: `Invitation envoyée le ${day(x.invited_at)} à ${esc(x.contact_email || "?")}, jamais ouverte. L'email a pu arriver en indésirables, ou l'adresse n'est pas la bonne.`,
    steps: ["Vérifier l'adresse avec la centrale.", "Renvoyer l'invitation.", "Demander au gérant de regarder dans ses courriers indésirables."],
    acts: (x.contact_email && x.network_id ? `<button class="btn-p" data-reinvite="${x.store_id}" data-net-id="${x.network_id}">Renvoyer l'invitation</button>` : "") + fiche };
  if (i.type === "idle") return {
    h: `${x.network} ne se connecte plus`,
    why: `Personne de l'équipe centrale ne s'est connecté depuis ${since(x.last_seen).replace("il y a ", "")}. Risque de désengagement.`,
    steps: ["Prendre des nouvelles, proposer un point de 15 minutes.", "Vérifier dans la fiche client que les magasins publient bien."],
    acts: `<a class="btn-p" href="${mailto((x.emails || []).join(","), "Vitriin : un point sur vos campagnes ?", "Bonjour,\n\nJe prends des nouvelles de vos campagnes sur Vitriin. Avez-vous 15 minutes cette semaine pour faire le point (prochaines promos, magasins à relancer, nouveautés) ?" + SIGN)}">Écrire à l'équipe centrale</a>` + `<button class="btn-s" data-goto-net="${x.network_id}">Voir la fiche ${esc(x.network)}</button>` };
}
function openTodo(i) {
  const g = todoGuide(i);
  const el = document.createElement("div"); el.className = "ov"; el.id = "todo-ov";
  el.innerHTML = `<div class="modal"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><h3>${esc(g.h)}</h3><button class="btn-s sm" data-x>Fermer</button></div>
    <div class="why">${g.why}</div><b style="font-size:13.5px">Pour résoudre</b><ol>${g.steps.map(t => `<li>${t}</li>`).join("")}</ol>
    <div class="acts">${g.acts}<button class="btn-s" data-read-one>Marquer comme lu</button></div></div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.onclick = (e) => { if (e.target === el || e.target.closest("[data-x]")) close(); };
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast("Message copié."), () => toast("Copie impossible.")));
  el.querySelectorAll("[data-goto-net]").forEach(b => b.onclick = () => { close(); UI.net = b.dataset.gotoNet; show("net"); });
  el.querySelectorAll("[data-open-ticket]").forEach(b => b.onclick = () => { close(); UI.ticket = b.dataset.openTicket; show("ticket"); });
  el.querySelectorAll("[data-reinvite]").forEach(b => b.onclick = () => act(b, () => invite([b.dataset.reinvite], b.dataset.netId)));
  bindReset(el);
  el.querySelector("[data-read-one]").onclick = () => { close(); markRead([i.x.key]); };
}
async function markRead(keys) {
  try { await rpc("manager_dismiss", { p_keys: keys }); }
  catch (e) { return toast(errText(e)); }
  await show("home");
  toastUndo(keys.length > 1 ? `${keys.length} éléments marqués comme lus.` : "Marqué comme lu.", async () => { await rpc("manager_dismiss", { p_keys: keys, p_undo: true }); show("home"); });
}
function toastUndo(text, undo) {
  const el = $("toast"); el.innerHTML = `${esc(text)} <button style="border:none;background:none;color:inherit;font-weight:700;text-decoration:underline;margin-left:8px" id="undo">Annuler</button>`;
  el.classList.remove("hidden"); clearTimeout(tt); tt = setTimeout(() => el.classList.add("hidden"), 6000);
  $("undo").onclick = () => { el.classList.add("hidden"); undo(); };
}
function bindReset(root) {
  root.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
    if (!confirm(`Envoyer à ${b.dataset.reset} un email pour choisir un nouveau mot de passe ?`)) return;
    act(b, async () => {
      const { error } = await sb.auth.resetPasswordForEmail(b.dataset.reset, { redirectTo: `${location.origin}/${b.dataset.to}/?bienvenue=1` });
      if (error) throw error; return "Email envoyé à " + b.dataset.reset + ".";
    });
  });
}

  </div>
  <div class="two">
    <div class="card"><h3>Équipe de la centrale</h3>${D.members.length ? `<ul class="list">${D.members.map(m => `<li><span><b>${esc(m.email)}</b><br><small style="color:var(--muted)">${{ owner: "Propriétaire", admin: "Administrateur", member: "Éditeur" }[m.role] || m.role} · dernière connexion ${since(m.last_sign_in_at)}</small></span><button class="btn-s sm" data-reset="${esc(m.email)}" data-to="centrale">Renvoyer l'accès</button></li>`).join("")}</ul>` : `<p class="empty">Aucun utilisateur.</p>`}
      <p class="sub" style="margin-top:10px">Contact : ${esc(n.support_email || "—")} · ${esc(n.phone || "—")}</p></div>
    <div class="card"><h3>Promos de la centrale</h3>${P.length ? `<ul class="list">${P.slice(0, 12).map(p => `<li><span><b>${esc(p.title)}</b>${p.is_mandatory ? ' <span class="pill p">Obligatoire</span>' : ""}<br><small style="color:var(--muted)">${day(p.starts_at)} → ${day(p.ends_at)} · ${p.active}/${p.sent} activées · ${p.relayed} relayées</small></span><b>${cnum(p.views)} vues</b></li>`).join("")}</ul>` : `<p class="empty">Aucune promo envoyée.</p>`}</div>
  </div>
  ${onbHtml(C.netOnb)}
  <h3 style="margin-top:18px">Magasins</h3>
  <div class="tw"><table><tr><th>Magasin</th><th>Compte</th><th>Réseaux</th><th class="r">Publications 30 j</th><th class="r">À valider</th><th>Dernière connexion</th><th></th></tr>
    ${S.map(s => `<tr><td><b>${esc(s.name)}</b><small>${esc(s.postal_code || "")} ${esc(s.city || "")}</small></td>
      <td>${s.activated ? `<span class="pill">Activé</span>` : s.invited_at ? `<span class="pill warn">Invité le ${day(s.invited_at)}</span>` : `<span class="pill grey">Pas invité</span>`}<small>${esc(s.contact_email || "")}</small></td>
      <td>${chState(s.channels)}</td><td class="r">${nf(s.pub30)}</td><td class="r">${s.pending ? `<span class="pill warn">${s.pending}</span>` : "0"}</td><td>${s.activated ? since(s.last_seen) : "—"}</td>
      <td class="r">${!s.activated && s.contact_email ? `<button class="btn-s sm" data-inv="${s.id}">Inviter</button>` : s.activated && s.contact_email ? `<button class="btn-s sm" data-reset="${esc(s.contact_email)}" data-to="magasin">Renvoyer l'accès</button>` : ""}</td></tr>`).join("")}
  </table></div>`;
}

/* ---------- Magasins ---------- */
const SF = [["all", "Tous"], ["off", "Sans réseau"], ["broken", "À reconnecter"], ["pending", "Pas activés"], ["idle", "Sans publication 30 j"], ["indep", "Indépendants"]];
function storeMatch(s) {
  const v = Object.values(s.channels || {});
  if (UI.sf === "off" && v.includes("active")) return false;
  if (UI.sf === "broken" && !v.some(x => x === "error" || x === "revoked")) return false;
  if (UI.sf === "pending" && s.activated) return false;
  if (UI.sf === "idle" && s.last_pub && Date.now() - new Date(s.last_pub) < 30 * 864e5) return false;
  if (UI.sf === "indep" && s.network_id) return false;
  const q = UI.q.trim().toLowerCase();
  return !q || [s.name, s.city, s.postal_code, s.network, s.owner, s.contact_email].some(x => String(x || "").toLowerCase().includes(q));
}
function vStores() {
  const list = C.stores.filter(storeMatch);
  return `<div class="bar"><div><h2>Magasins</h2><p class="sub">${nf(list.length)} sur ${nf(C.stores.length)}.</p></div>
    <div class="row"><input class="in search" id="q" placeholder="Nom, ville, centrale, email…" value="${esc(UI.q)}"><select class="in" id="sf">${SF.map(([k, l]) => `<option value="${k}" ${UI.sf === k ? "selected" : ""}>${l}</option>`).join("")}</select></div></div>
  <div class="tw"><table><tr><th>Magasin</th><th>Centrale</th><th>Gérant</th><th>Réseaux</th><th>Dernière publication</th><th>Dernière connexion</th></tr>
    ${list.slice(0, 500).map(s => `<tr ${s.network_id ? `class="click" data-net="${s.network_id}"` : ""}><td><b>${esc(s.name)}</b><small>${esc(s.postal_code || "")} ${esc(s.city || "")}</small></td><td>${esc(s.network || "Indépendant")}</td>
      <td>${s.activated ? esc(s.owner || "") : `<span class="pill ${s.invited_at ? "warn" : "grey"}">${s.invited_at ? "Invité" : "Pas activé"}</span><small>${esc(s.contact_email || "")}</small>`}</td>
      <td>${chState(s.channels)}</td><td>${s.last_pub ? since(s.last_pub) : "—"}</td><td>${s.activated ? since(s.last_seen) : "—"}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Aucun magasin ne correspond.</td></tr>`}
  </table></div>${list.length > 500 ? `<p class="sub">Affichage limité à 500 lignes : affinez la recherche.</p>` : ""}`;
}

/* ---------- Démos ---------- */
function demoCard(sec) {
  const n = C.ov.networks.find(x => x.is_demo && x.demo_sector === sec.key);
  const st = n ? `<div class="stats"><div><b>${nf(n.stores)}</b><span>magasins</span></div><div><b>${nf(n.connected)}</b><span>connectés</span></div><div><b>${nf(n.promos)}</b><span>promos</span></div><div><b>${nf(n.published)}</b><span>publiées</span></div></div>` : `<p class="sub" style="margin:14px 0">Démo pas encore générée.</p>`;
  return `<div class="card ${n?.active ? "on" : ""}">
    <div class="row" style="justify-content:space-between"><span class="lbl">${esc(sec.label)}</span>${n?.active ? `<span class="pill">Démo active</span>` : ""}</div>
    <div class="row" style="gap:12px;margin-top:10px;flex-wrap:nowrap">${logo(n || { name: sec.brand })}<h3 style="margin:0">${esc(n?.name || sec.brand)}</h3></div>${st}
    <div class="row">
      ${n && !n.active ? `<button class="btn-p" data-use="${n.id}">Utiliser cette démo</button>` : ""}
      ${n?.active ? `<a class="btn-s" href="/centrale/" target="_blank" rel="noopener">Ouvrir la centrale</a><a class="btn-s" href="/magasin/" target="_blank" rel="noopener">Ouvrir l'app magasin</a>` : ""}
      ${sec.generated ? `<button class="btn-s" data-build="${sec.key}" data-has="${n ? 1 : 0}">${n ? "Réinitialiser" : "Générer"}</button>` : ""}
    </div></div>`;
}
function vDemos() {
  return `<div class="bar"><div><h2>Démos</h2><p class="sub">Choisissez la démo à montrer : votre centrale et le compte magasin de démonstration basculent dessus. « Réinitialiser » remet les dates et les chiffres à jour.</p></div></div>
  <div class="grid">${C.ov.sectors.map(demoCard).join("")}</div>
  <div class="help" style="margin-top:14px"><b>Pour la présenter :</b> centrale sur <b>app.vitriin.co/centrale</b> avec votre compte ; app magasin sur <b>app.vitriin.co/magasin</b> avec magasin.demo@vitriin.co. Rechargez les onglets déjà ouverts.</div>`;
}

/* ---------- Santé ---------- */
function vHealth() {
  const H = C.health, A = H.accounts || {}, P = H.pubStatus || {}, tot = (P.published || 0) + (P.failed || 0);
  return `<div class="bar"><div><h2>Santé technique</h2><p class="sub">Publications et comptes sociaux sur 30 jours${UI.demo ? ", démos comprises" : ""}.</p></div></div>
  <div class="kpis">
    ${kpi(tot ? Math.round((P.published || 0) / tot * 100) + " %" : "—", "publications réussies", `<small style="color:var(--muted)">${nf(P.published)} publiées · ${nf(P.failed)} échecs · ${nf(P.pending)} programmées</small>`)}
    ${kpi(nf(A.active), "comptes sociaux actifs")}
    ${kpi(nf((A.error || 0) + (A.revoked || 0)), "comptes à reconnecter", "", (A.error || 0) + (A.revoked || 0) ? "var(--err)" : "var(--ok)")}
    ${kpi(nf(A.off), "réseaux désactivés par le magasin")}
    ${kpi(nf(H.users.total), "comptes utilisateurs", `<small style="color:var(--muted)">${nf(H.users.invitedPending)} invitation(s) jamais ouverte(s)</small>`)}
    ${kpi(H.lastMetrics ? since(H.lastMetrics) : "—", "dernière collecte des stats Meta")}
  </div>
  <div class="card" style="margin-top:14px"><h3>Échecs par cause</h3>${H.failByCause.length ? `<ul class="list">${H.failByCause.map(f => `<li><span><b>${f.channel === "instagram" ? "Instagram" : "Facebook"}</b> · ${esc(f.cause)}<br><small style="color:var(--muted)">dernier : ${day(f.last)}</small></span><b>${nf(f.n)}</b></li>`).join("")}</ul>` : `<p class="empty">Aucun échec sur 30 jours.</p>`}</div>
  <div class="help" style="margin-top:14px">Les emails non délivrés et les erreurs des fonctions serveur se consultent pour l'instant dans Supabase (Logs). Ils remonteront ici quand l'envoi d'emails passera par votre propre service (SMTP).</div>`;
}

/* ---------- Site web ---------- */
const SNIPPET = `<script>
/* Vitriin : mesure d'audience sans cookie. */
(function(){var U="${SUPABASE_URL}/rest/v1/rpc/track_visit",K="${ANON_KEY}";
var V;try{var k="vt_"+new Date().toISOString().slice(0,10);V=localStorage.getItem(k);if(!V){V=Math.random().toString(36).slice(2,12);localStorage.setItem(k,V)}}catch(e){}
var q=new URLSearchParams(location.search),w=innerWidth,dev=w<700?"mobile":w<1100?"tablet":"desktop",ref="";try{ref=document.referrer?new URL(document.referrer).hostname:"";if(ref===location.hostname)ref=""}catch(e){}
function send(ev,p){try{fetch(U,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json",apikey:K,Authorization:"Bearer "+K},body:JSON.stringify({p_path:p||location.pathname,p_ref:ref,p_source:q.get("utm_source"),p_device:dev,p_visitor:V,p_event:ev,p_site:location.hostname})})}catch(e){}}
var last="";function view(){if(location.pathname!==last){last=location.pathname;send("view")}}
view();var ps=history.pushState;history.pushState=function(){ps.apply(this,arguments);setTimeout(view,0)};addEventListener("popstate",view);
document.addEventListener("click",function(e){var a=e.target.closest("a,button");if(!a)return;var t=(a.textContent+" "+(a.getAttribute("href")||"")).toLowerCase();
if(/d[ée]mo/.test(t))send("demo_click");else if(/essai|inscri|cr[ée]er (mon|un) compte|commencer/.test(t))send("signup_click")});})();
<\/script>`;
function vSite() {
  const D = C.site;
  return `<div class="bar"><div><h2>Site web · vitriin.fr</h2><p class="sub">30 derniers jours. Mesure sans cookie : ni adresse IP ni donnée personnelle conservée.</p></div></div>
  ${D.last ? "" : `<div class="help" style="margin-bottom:14px"><b>Aucune visite reçue pour l'instant.</b> Le compteur doit être ajouté au site (voir en bas de page).</div>`}
  <div class="kpis">${kpi(nf(D.views), "pages vues")}${kpi(nf(D.visitors), "visiteurs")}${kpi(nf(D.demo), "clics « démo »")}${kpi(nf(D.signup), "clics « essai / inscription »")}${kpi(D.visitors ? (D.demo / D.visitors * 100).toFixed(1).replace(".", ",") + " %" : "—", "visiteurs qui demandent une démo")}</div>
  <div class="card" style="margin-top:14px"><h3>Visites par jour</h3>${bars(D.series, "n", "v")}</div>
  <div class="two">
    <div class="card"><h3>Pages les plus vues</h3>${D.pages.length ? `<ul class="list">${D.pages.map(p => `<li><span>${esc(p.path)}</span><b>${nf(p.n)}</b></li>`).join("")}</ul>` : `<p class="empty">—</p>`}</div>
    <div class="card"><h3>Provenance</h3>${D.sources.length ? `<ul class="list">${D.sources.map(p => `<li><span>${esc(p.src)}</span><b>${nf(p.n)}</b></li>`).join("")}</ul>` : `<p class="empty">—</p>`}
      <h3 style="margin-top:16px">Appareils</h3><ul class="list">${Object.entries(D.devices || {}).map(([k, v]) => `<li><span>${{ mobile: "Mobile", tablet: "Tablette", desktop: "Ordinateur" }[k] || k}</span><b>${nf(v)}</b></li>`).join("") || "<li><span>—</span></li>"}</ul></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Compteur à installer sur vitriin.fr</h3><p class="sub">Dans Lovable : demandez d'ajouter ce code juste avant &lt;/body&gt; de index.html. Il compte les pages vues (navigation comprise), la provenance (utm_source ou site d'origine), l'appareil et les clics sur les boutons « démo » et « essai ».</p>
    <pre id="snip">${esc(SNIPPET)}</pre><button class="btn-s" id="copy-snip">Copier le code</button></div>`;
}

const VIEWS = { home: vHome, support: vSupport, ticket: vTicket, clients: vClients, net: vNet, stores: vStores, demos: vDemos, health: vHealth, site: vSite };

/* ---------- Actions ---------- */
async function act(btn, fn, okMsg) {
  if (busy) return; busy = true; if (btn) btn.disabled = true;
  try { const m = await fn(); toast(m || okMsg || "Fait."); }
  catch (e) { toast(errText(e)); }
  finally { busy = false; if (btn) btn.disabled = false; }
}
async function invite(ids, networkId) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(`${SUPABASE_URL}/functions/v1/network-stores-invite`, { method: "POST", headers: { "Content-Type": "application/json", apikey: ANON_KEY, Authorization: "Bearer " + session.access_token }, body: JSON.stringify({ network_id: networkId, store_ids: ids }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Envoi impossible.");
  const res = j.results || [], ok = res.filter(x => x.status === "invited" || x.status === "linked").length, ko = res.filter(x => x.status === "failed");
  return `${ok} invitation${ok > 1 ? "s" : ""} envoyée${ok > 1 ? "s" : ""}${ko.length ? ` · ${ko.length} en échec (${ko[0].reason})` : ""}.`;
}
function bind() {
  const v = $("view");
  v.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => show(b.dataset.tab));
  v.querySelectorAll("[data-net]").forEach(r => r.onclick = () => { UI.net = r.dataset.net; show("net"); });
  if ($("q")) { $("q").oninput = (e) => { UI.q = e.target.value; const pos = e.target.selectionStart; $("view").innerHTML = vStores(); bind(); $("q").focus(); $("q").setSelectionRange(pos, pos); }; }
  if ($("sf")) $("sf").onchange = (e) => { UI.sf = e.target.value; $("view").innerHTML = vStores(); bind(); };
  if ($("copy-snip")) $("copy-snip").onclick = () => navigator.clipboard.writeText(SNIPPET).then(() => toast("Code copié."), () => toast("Copie impossible : sélectionnez le texte."));
  bindReset(v);
  // À traiter
  const items = todoItems();
  v.querySelectorAll("[data-todo]").forEach(r => r.onclick = (e) => { if (!e.target.closest("[data-read]")) openTodo(items[+r.dataset.todo]); });
  v.querySelectorAll("[data-read]").forEach(b => b.onclick = (e) => { e.stopPropagation(); markRead([items[+b.dataset.read].x.key]); });
  if ($("read-all")) $("read-all").onclick = () => { if (confirm(`Marquer les ${items.length} éléments comme lus ?`)) markRead(items.map(i => i.x.key)); };
  // Support
  v.querySelectorAll("[data-tkf]").forEach(b => b.onclick = () => { UI.tkf = b.dataset.tkf; show("support"); });
  v.querySelectorAll("[data-ticket]").forEach(r => r.onclick = () => { UI.ticket = r.dataset.ticket; show("ticket"); });
  v.querySelectorAll("[data-goto-net]").forEach(b => b.onclick = () => { UI.net = b.dataset.gotoNet; show("net"); });
  if ($("tk-st")) {
    const id = C.ticket.ticket.id, reload = async () => { await need("ticket"); C.home = await rpc("manager_dashboard", { p_demo: UI.demo }).catch(() => C.home); frame(vTicket()); bind(); };
    $("tk-st").onchange = (e) => act(null, async () => { await rpc("manager_ticket_set", { p_id: id, p_status: e.target.value }); await reload(); return "Statut mis à jour."; });
    $("tk-prio").onclick = () => act($("tk-prio"), async () => { await rpc("manager_ticket_set", { p_id: id, p_priority: C.ticket.ticket.priority === "high" ? "normal" : "high" }); await reload(); return "Priorité mise à jour."; });
    const send = (solve) => { const body = $("tk-body").value.trim(), internal = $("tk-int").checked; if (!body && !solve) return toast("Écrivez une réponse.");
      act(null, async () => { await rpc("manager_ticket_reply", { p_id: id, p_body: body, p_internal: internal, p_status: solve ? "resolved" : null }); await reload(); return internal ? "Note ajoutée." : solve ? "Réponse envoyée, ticket résolu." : "Réponse envoyée au client."; }); };
    $("tk-send").onclick = () => send(false); $("tk-solve").onclick = () => send(true);
  }
  // Intégration
  v.querySelectorAll("[data-onb]").forEach(c => c.onchange = () => act(null, async () => { C.netOnb = await rpc("manager_onboarding_toggle", { p_net: UI.net, p_step: c.dataset.onb, p_done: c.checked }); $("view").innerHTML = vNet(); bind(); return "Étape mise à jour."; }));
  v.querySelectorAll("[data-inv]").forEach(b => b.onclick = () => act(b, async () => { const m = await invite([b.dataset.inv], C.net.network.id); await need("net"); $("view").innerHTML = vNet(); bind(); return m; }));
  if ($("inv-all")) $("inv-all").onclick = () => { const ids = C.net.stores.filter(s => !s.activated && s.contact_email).map(s => s.id); if (!confirm(`Envoyer l'invitation à ${ids.length} gérant(s) ?`)) return; act($("inv-all"), async () => { const m = await invite(ids.slice(0, 200), C.net.network.id); await need("net"); $("view").innerHTML = vNet(); bind(); return m; }); };
  v.querySelectorAll("[data-use]").forEach(b => b.onclick = () => act(b, async () => { await rpc("manager_activate_demo", { p_network_id: b.dataset.use }); await need("demos"); $("view").innerHTML = vDemos(); bind(); return "Démo activée. Rechargez la centrale et l'app magasin si elles sont ouvertes."; }));
  v.querySelectorAll("[data-build]").forEach(b => b.onclick = () => {
    if (b.dataset.has === "1" && !confirm("Réinitialiser cette démo ? Ses magasins, promos et chiffres seront recréés.")) return;
    b.textContent = "Génération…";
    act(b, async () => { await rpc("manager_build_demo", { p_sector: b.dataset.build }); await need("demos"); $("view").innerHTML = vDemos(); bind(); return "Démo prête."; });
  });
}
boot().catch(e => showLogin(errText(e)));
</script>
