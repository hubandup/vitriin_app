<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vitriin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vitriin">
<link rel="manifest" href="/magasin/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Racing+Sans+One&display=swap" rel="stylesheet">
<style>
/* Vitriin App · maquette Claude Design « Vitriin App » (magenta), version démo. */
:root{
  --p:#e5087e; --v:#951b81; --grad:linear-gradient(100deg,#e5087e 0%,#951b81 100%);
  --ink:#2D2D2D; --muted:#7b766f; --faint:#a8a29b; --line:#EEECE8; --bg:#f6f3ee;
  --rose:#fdf1f4; --rose2:#fde7ef; --mint:#eef5f0; --teal:#0c9875; --teal2:#5ebca3;
  --sand:#faf6ee; --sandline:#ecdcc0; --red:#c8342b;--blue:#2f6fdb; --redbg:#fdeeec; --lilac:#f7eef6;
  --fb:#1877F2; --ig:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,textarea{font-family:inherit;color:var(--ink)}
img{display:block}
.hidden{display:none!important}
.num{font-family:'Racing Sans One','DM Sans',sans-serif;font-weight:400;letter-spacing:.01em}
@media (min-width:560px){
  body{background:#e9e6e1}
  #app{max-width:430px;margin:0 auto;background:#fff;min-height:100dvh;box-shadow:0 0 40px rgba(0,0,0,.08);position:relative}
}
#app{position:relative;min-height:100dvh;overflow-x:hidden}
.screen{padding:calc(var(--sat) + 18px) 16px calc(var(--nav) + var(--sab) + 28px)}
h1.title{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{font-size:14px;color:var(--muted);margin-top:3px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.chev{flex:none;opacity:.8}

/* ---- Header ---- */
.head{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none;overflow:hidden}
.av img,.rav img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.head .sp b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.head .sp span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.client-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--rose);color:var(--p);font-weight:700;font-size:15px;padding:13px;border-radius:14px}

/* ---- Cartes d'alerte ---- */
.hero{margin-top:12px;width:100%;display:flex;align-items:center;gap:14px;background:var(--grad);color:#fff;border-radius:20px;padding:16px;text-align:left;box-shadow:0 10px 26px rgba(229,8,126,.28)}
.hero .ic{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.hero b{display:block;font-size:16.5px;line-height:1.25}
.hero span{display:block;font-size:13.5px;opacity:.9;margin-top:3px}
.due{margin-top:12px;width:100%;display:flex;align-items:center;gap:14px;background:var(--sand);border:1.5px solid var(--sandline);border-radius:18px;padding:14px 16px;text-align:left}
.due .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;color:#6b5a3e}
.due b{display:block;font-size:15px;line-height:1.3}
.due span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.warn{margin-top:12px;display:flex;align-items:center;gap:12px;background:var(--redbg);border-radius:18px;padding:12px 12px 12px 14px}
.warn .igi{width:34px;height:34px;border-radius:10px;background:var(--ig);display:flex;align-items:center;justify-content:center;flex:none}
.warn p{margin:0;font-size:14px;color:#8a2a22;line-height:1.35;flex:1}
.btn-red{background:var(--red);color:#fff;font-weight:700;font-size:13.5px;padding:10px 15px;border-radius:999px;white-space:nowrap;flex:none}
.ok-note{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--mint);border-radius:16px;padding:12px 14px;font-size:14px;color:#2f6e52;font-weight:600}

/* ---- KPI ---- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.kpi{border-radius:18px;padding:14px 12px;min-height:96px}
.kpi .num{font-size:30px;line-height:1}
.kpi span{display:block;font-size:13px;color:var(--muted);margin-top:8px;line-height:1.3}
.k1{background:var(--rose)}.k1 .num{color:var(--p)}
.k2{background:var(--mint)}.k2 .num{color:var(--teal)}
.k3{background:var(--redbg)}.k3 .num{color:var(--red)}

/* ---- Sections ---- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.link{color:var(--p);font-weight:700;font-size:15px;display:flex;align-items:center;gap:3px}
.carousel{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.pc{flex:none;width:68%;max-width:240px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;scroll-snap-align:start;text-align:left}
.pc .im{position:relative;height:138px;background:var(--bg)}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .body{padding:11px 12px 13px}
.pc b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{display:flex;align-items:baseline;gap:7px;margin-top:5px;flex-wrap:wrap}
.price .num{font-size:21px;color:var(--p)}
.price s{font-size:13px;color:var(--faint)}
.tag{position:absolute;top:9px;left:9px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px}
.t-own{background:#f6ecd8;color:#6b5a3e}.t-net{background:#f6e6f4;color:var(--v)}
.disc{position:absolute;top:9px;right:9px;background:var(--p);color:#fff;font-family:'Racing Sans One',sans-serif;font-size:14px;padding:3px 9px;border-radius:9px}
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-pub{background:#e3f3ec;color:var(--teal)}.s-rec{background:var(--rose2);color:var(--p)}.s-act{background:#eef0fb;color:#5b63c4}
.s-sch{background:#fbf0e6;color:#b07a2e}.s-draft{background:#f0eeec;color:var(--muted)}.s-dec{background:var(--redbg);color:var(--red)}
.s-mand{background:#2D2D2D;color:#fff}
.meta{font-size:12.5px;color:var(--muted);margin-left:6px}

/* ---- Activité ---- */
.act{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:none}
.act .th{width:44px;height:44px;border-radius:11px;object-fit:cover;flex:none;background:var(--bg)}
.act b{font-size:14.5px}
.act .ln{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.act .when{font-size:12px;color:var(--faint);white-space:nowrap}
.dot{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.35}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:currentColor}
.d-ok{color:var(--teal)}.d-ko{color:var(--red)}

/* ---- Nav + FAB ---- */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:20}
@media (min-width:560px){.nav{max-width:430px;margin:0 auto}}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#a8a29b;font-size:11.5px;font-weight:600;position:relative}
.nav button.on{color:var(--p)}
.nav .bd{position:absolute;top:7px;left:calc(50% + 4px);background:var(--p);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + var(--sab) + 14px);width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(229,8,126,.42);z-index:21}
@media (min-width:560px){.fab{right:calc(50% - 215px + 16px)}}

/* ---- Promos ---- */
.seg{display:flex;background:#f3f1ed;border-radius:999px;padding:4px;margin-top:16px}
.seg button{flex:1;padding:11px 8px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg .c{background:var(--p);color:#fff;font-size:11.5px;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.intro{font-size:14px;color:var(--muted);line-height:1.45;margin:14px 0}
.card{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px;background:#fff;position:relative;cursor:pointer}
.card.pending{border-color:#f5b8d4}
.card .top{display:flex;gap:11px;padding:10px 11px}
.card .top>img,.card .top>.ph{width:56px;height:56px;border-radius:11px;object-fit:cover;flex:none;background:var(--bg)}
.card .eye{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--rose);color:var(--p);display:flex;align-items:center;justify-content:center;z-index:1}
.card .eye svg{width:18px;height:18px}
.card .eye ~ .top .tags{padding-right:38px}
.card .tags .st{font-size:11px;padding:2px 8px}
.card .small,.card .code{font-size:12.5px;margin-top:3px}
.card .band,.card .foot{padding:8px 11px 10px}
.card .btns{margin-top:7px}
.card .btns button{padding:10px 8px;font-size:14px;border-radius:11px}
.swipe{position:relative;margin-bottom:10px;border-radius:16px;overflow:hidden;background:var(--red)}
.swipe .card{margin-bottom:0;transition:transform .2s ease;touch-action:pan-y}
.swipe.drag .card{transition:none}
.swipe.sw-blue{background:var(--blue)}
.st.s-susp{background:#e6eefb;color:var(--blue)}
.sw-del{position:absolute;right:0;top:0;bottom:0;width:96px;color:#fff;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.card h3{font-size:15.5px;margin:4px 0 0;letter-spacing:-.01em;line-height:1.25}
.card .price .num{font-size:18px}
.badge{background:var(--p);color:#fff;font-family:'Racing Sans One',sans-serif;font-size:13px;padding:2px 8px;border-radius:7px}
.small{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}
.code{display:flex;gap:6px;align-items:flex-start;font-size:13px;margin-top:5px;line-height:1.35}
.code svg{flex:none;margin-top:3px}
.band{background:var(--sand);border-top:1px solid #f0e6d6;padding:12px 13px 13px}
.band .row{font-size:14px;color:#5b4b33;gap:8px}
.btns{display:flex;gap:9px;margin-top:11px}
.btns button{flex:1;padding:13px 8px;border-radius:13px;font-weight:700;font-size:14.5px;white-space:nowrap}
.b-ghost{background:#fff;border:1.5px solid var(--line)!important}
.b-sand{background:#fff;border:1.5px solid var(--sandline)!important}
.b-grad{background:var(--grad);color:#fff}
.b-grad:disabled{background:#e8e5df;color:#a8a29b}
.foot{border-top:1px solid var(--line);padding:11px 13px 13px}
.chans{display:flex;gap:7px;align-items:center}
.ch{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ch.fb{background:var(--fb)}.ch.ig{background:var(--ig);border-radius:9px}
.ch.off{background:#e7e4df!important}
.ch.ko::after{content:"×";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;line-height:13px;text-align:center;font-weight:700;border:1.5px solid #fff}
.see{display:inline-flex;align-items:center;gap:6px;color:var(--p);font-weight:700;font-size:14px;margin-top:9px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}

/* ---- Stats ---- */
.bigk{display:flex;align-items:center;justify-content:space-between;border-radius:18px;padding:18px 20px;margin-top:10px;font-weight:600;font-size:16px}
.bigk .num{font-size:34px}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.skc{border:1px solid var(--line);border-radius:16px;padding:14px}
.skc b{font-size:14.5px}
.skc .num{font-size:30px;margin-top:8px;color:var(--ink);line-height:1}
.skc .small{margin-top:4px}
.split{display:flex;gap:12px;margin-top:9px;font-size:13px;font-weight:600}
.split span{display:flex;align-items:center;gap:5px}
.split span::before{content:"";width:8px;height:8px;border-radius:50%}
.split .f::before{background:var(--fb)}.split .i::before{background:#e1306c}
.eng{display:flex;align-items:center;justify-content:space-between;background:var(--lilac);border-radius:16px;padding:14px 16px;margin-top:10px;font-weight:600}
.eng .num{font-size:26px;color:var(--v)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend .f::before,.legend .i::before{content:"";width:8px;height:8px;border-radius:50%}
.legend .f::before{background:var(--fb)}.legend .i::before{background:#e1306c}
.resolve{background:var(--redbg);border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;margin-top:10px}
.resolve p{margin:0;font-size:13.5px;color:var(--red);font-weight:600;line-height:1.35}
.resolve b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.sp-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sp-row:last-child{border-bottom:none}
.sp-row>img{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.mini div{background:#f6f4f0;border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.mini b{color:var(--ink);font-size:14px;margin-right:4px}

/* ---- Réglages ---- */
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:22px 0 9px}
.box{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px}
.li+.li{border-top:1px solid var(--line)}
.net{background:var(--lilac);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.net .ic{width:42px;height:42px;border-radius:12px;background:var(--v);display:flex;align-items:center;justify-content:center;flex:none}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:#e3f3ec;color:var(--teal)}.p-ko{background:var(--redbg);color:var(--red)}
.tg{width:48px;height:28px;border-radius:999px;background:#dcd8d1;position:relative;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.tg.on{background:var(--teal2)}.tg.on::after{left:23px}
.out{width:100%;margin-top:22px;border:1.5px solid var(--line);border-radius:16px;padding:15px;color:var(--red);font-weight:700;font-size:15.5px}
.reset{display:block;margin:18px auto 0;font-size:12.5px;color:var(--faint);text-decoration:underline}

/* ---- Feuilles & écrans plein ---- */
.ov{position:fixed;inset:0;background:rgba(30,26,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:#fff;width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:10px 18px calc(var(--sab) + 18px);max-height:92dvh;overflow-y:auto;animation:up .22s ease-out}
.grab{width:42px;height:5px;border-radius:3px;background:#e2ded8;margin:0 auto 14px}
.sheet h2{font-size:21px;margin:0;letter-spacing:-.01em}
.choice{width:100%;display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;text-align:left}
.choice:first-of-type{border-color:var(--p)}
.choice .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.choice b{display:block;font-size:16.5px}
.choice span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;border:1.5px solid var(--line);border-radius:14px;padding:9px 0;text-align:center}
.day small{display:block;font-size:12px;font-weight:700}
.day b{display:block;font-size:22px;margin:2px 0}
.day span{font-size:11.5px;color:var(--muted)}
.day.on{background:var(--p);border-color:var(--p);color:#fff}.day.on span{color:#fff}
.day:disabled{opacity:.35}
.hint{font-size:13px;color:#8a6a3a;margin-top:9px;line-height:1.4}
.fl{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:16px;outline:none;background:#fff}
.in:focus{border-color:var(--p)}
.recap{background:var(--rose);border-radius:14px;padding:13px 14px;font-size:14.5px;line-height:1.45;margin-top:14px}
.big-btn{width:100%;margin-top:14px;background:var(--grad);color:#fff;font-weight:700;font-size:16.5px;padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px}
.big-btn:disabled{background:#e8e5df;color:#a8a29b}
.txt-btn{width:100%;margin-top:10px;color:var(--muted);font-weight:600;font-size:15px;padding:10px}
.full{position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;animation:up .22s ease-out}
@media (min-width:560px){.full{max-width:430px;margin:0 auto}}
.full .bar{flex:none;display:flex;align-items:center;padding:calc(var(--sat) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.x{width:40px;height:40px;border-radius:50%;background:#f3f1ed;display:flex;align-items:center;justify-content:center}
.full .bar b{flex:1;text-align:center;font-size:17px;margin-right:40px}
.full .scroll{flex:1;overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
.full .actions{flex:none;border-top:1px solid var(--line);padding:10px 16px calc(var(--sab) + 12px);background:#fff}
.req{color:var(--p)}
.label{display:block;font-size:15px;font-weight:700;margin:20px 0 9px}
.media{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.media button{background:var(--sand);border:1.5px solid #efe7da;border-radius:16px;padding:16px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:700;line-height:1.2;text-align:center}
.media button.net{background:var(--lilac);border-color:#efdcef}
.preview-img{position:relative;border-radius:16px;overflow:hidden;height:190px;background:var(--bg)}
.preview-img img{width:100%;height:100%;object-fit:cover}
.ro-box{opacity:.55}
.ro-line{font-size:14px;color:var(--muted);line-height:1.45;background:var(--bg);border-radius:12px;padding:11px 13px}
.in:disabled{background:#f6f4f1;color:var(--muted)}
.preview-img button{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.types button{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:13px 12px;font-weight:700;font-size:14.5px;text-align:left}
.types button.on{border-color:var(--p);background:var(--rose);color:var(--p)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.two label.pk{color:var(--p);font-weight:700}
.in.pk{border-color:var(--p);background:var(--rose);color:var(--p);font-weight:700}
.calc{display:flex;align-items:center;gap:10px;background:var(--rose);border-radius:14px;padding:13px 14px;margin-top:12px;flex-wrap:wrap}
.calc .num{font-size:24px;color:var(--p)}
.calc s{color:var(--faint);font-size:14px}
.date{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;position:relative}
.date input{border:none;outline:none;font-size:15px;font-weight:700;padding:13px 0;width:100%;background:transparent}
.gen{width:100%;border:1.5px dashed #f2a9c9;background:var(--rose);color:var(--p);font-weight:700;font-size:15px;padding:14px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px}
.codes{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.codechip{display:flex;align-items:center;gap:9px;background:#f6f4f0;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14.5px;letter-spacing:.04em}
.codechip button{margin-left:auto;color:var(--muted);font-size:18px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:9px}
.addrow .in{flex:1;min-width:0}
.addrow button{background:var(--ink);color:#fff;font-weight:700;border-radius:14px;padding:0 16px}
.chk{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:9px;width:100%;text-align:left}
.chk.on{border-color:var(--p);background:var(--rose)}
.chk .bx{width:24px;height:24px;border-radius:7px;border:1.5px solid #cfcac2;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.chk.on .bx{background:var(--p);border-color:var(--p)}
.chk b{display:block;font-size:15px}
.chk span{display:block;font-size:13px;color:var(--muted)}
.blue{background:var(--fb);color:#fff;font-weight:700;font-size:13px;padding:8px 13px;border-radius:999px;margin-left:auto;flex:none}
.todo{text-align:center;font-size:13.5px;color:var(--muted);margin-bottom:2px}

/* ---- Publication en cours ---- */
.pub{text-align:center;padding:10px 4px 6px}
.pub .spin{width:56px;height:56px;border-radius:50%;border:4px solid var(--rose2);border-top-color:var(--p);margin:6px auto 16px;animation:rot .8s linear infinite}
.pub .done{width:62px;height:62px;border-radius:50%;background:#e3f3ec;color:var(--teal);display:flex;align-items:center;justify-content:center;margin:2px auto 14px}
.pub h2{font-size:21px}
.pub .lines{text-align:left;margin:16px 0 4px;border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.pub .lines div{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:15px;font-weight:600}
.pub .lines div+div{border-top:1px solid var(--line)}
.pub .lines em{margin-left:auto;font-style:normal;font-size:13.5px;font-weight:700}

/* ---- Vue client (reels) ---- */
.reels{position:fixed;inset:0;background:#000;z-index:35;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}

.reel{position:relative;height:100dvh;scroll-snap-align:start;overflow:hidden}
.reel>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 45%,rgba(0,0,0,.1) 70%,rgba(0,0,0,.35) 100%)}

.reel .prog i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.32)}
.reel .prog i.on{background:#fff}
.reel .rh{position:absolute;top:calc(var(--sat) + 22px);left:14px;right:14px;display:flex;align-items:center;gap:10px;color:#fff}
.glass{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.reel .back{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}

.reel .rh b{display:block;font-size:15.5px}
.reel .rh span{font-size:12.5px;opacity:.75}
.reel .open{margin-left:auto;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;display:flex;align-items:center;gap:5px}
.pillback{position:absolute;top:calc(var(--sat) + 74px);left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:999px;display:flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:2}
.reel .side{position:absolute;right:12px;bottom:calc(var(--sab) + 140px);display:flex;flex-direction:column;gap:16px;align-items:center}
.reel .side button{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:12px;font-weight:700}
.reel .side i{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.codebox .in2{background:#fff;border-radius:26px;width:100%;max-width:380px;padding:24px 22px 22px;text-align:center}
.codebox small{font-size:12.5px;font-weight:700;letter-spacing:.07em;color:var(--muted)}
.codebox h3{font-size:22px;margin:4px 0 16px}
.bars{position:relative;display:flex;justify-content:center;align-items:stretch;height:110px;gap:0}
.bars.mask{filter:blur(6px);opacity:.6}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.lock i{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.lock span{background:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.digits{font-weight:700;letter-spacing:.18em;font-size:16px;margin-top:10px}
.mask-d{filter:blur(5px)}
.used{background:#e8f5ee;color:var(--teal);border-radius:14px;padding:12px;font-weight:700;font-size:14.5px;margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:center;text-align:left}
.dark-btn{width:100%;margin-top:14px;background:#16130f;color:#fff;font-weight:700;font-size:16px;padding:15px;border-radius:15px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--sab) + 86px);background:#2D2D2D;color:#fff;font-size:14.5px;font-weight:600;padding:12px 18px;border-radius:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .2s;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes rot{to{transform:rotate(360deg)}}
</style>

function mapRow(row, accounts) {
  const pr = row.promotions, det = pr.details || {};
  const pubs = row.publications || [];
  const byCh = { fb: pubs.find(x => x.channel === "facebook"), ig: pubs.find(x => x.channel === "instagram") };
  const ch = {};
  ["fb", "ig"].forEach(c => { const x = byCh[c]; if (x?.status === "published") ch[c] = "ok"; else if (x?.status === "failed") ch[c] = "ko"; });
  const done = pubs.filter(x => x.status === "published" || x.status === "failed");
  const planned = pubs.find(x => x.status === "pending" && new Date(x.published_at) > Date.now());
  let status;
  if (pr.status === "draft") status = "draft";
  else if (done.length) status = "published";
  else if (planned) status = "scheduled";
  else if (row.status === "declined") status = "declined";
  else if (row.status === "active") status = "active";
  else status = "received";
  const start = new Date(pr.starts_at), end = new Date(pr.ends_at);
  const m = (x) => x?.status === "published" && x.metrics ? [+x.metrics.reach || 0, +x.metrics.views || 0, (+x.metrics.reactions || 0) + (+x.metrics.shares || 0), +x.metrics.comments || 0] : null;
  const stats = done.length ? { fb: m(byCh.fb), ig: m(byCh.ig) } : null;
  const sched = planned ? new Date(planned.published_at) : null;
  return {
    id: row.id, spId: row.id, promoId: pr.id, src: pr.created_by_network_id ? "net" : "own",
    // Personnalisation du magasin (si la centrale l'autorise) par-dessus la version centrale.
    suspended: !!row.suspended, ov: row.overrides || {}, base: { title: pr.title, text: pr.description || "", img: pr.media_url },
    kind: pr.promo_type ? "promo" : "post", title: row.overrides?.title || pr.title, img: row.overrides?.media_url || pr.media_url,
    media: row.overrides?.media_url ? [row.overrides.media_url] : Array.isArray(det.media) && det.media.length ? det.media : (pr.media_url ? [pr.media_url] : []),
    formats: Array.isArray(det.formats) ? det.formats : [], mech: pr.mechanic, text: row.overrides?.text || pr.description || "",
    type: pr.promo_type, orig: det.orig ?? null, val: det.val ?? null, xy: det.xy || [2, 1], sub: det.sub || "", cond: det.sub || "",
    start, end, code: pr.discount_code, ean: pr.ean_code, mandatory: pr.is_mandatory, deadline: start > Date.now() ? start : end,
    status, ch, stats, recAt: new Date(row.created_at).getTime(),
    pubAt: done.length ? Math.max(...done.map(x => new Date(x.published_at).getTime())) : null,
    schedAt: sched ? new Date(sched.getFullYear(), sched.getMonth(), sched.getDate()).getTime() : null,
    schedTime: sched ? sched.toTimeString().slice(0, 5) : null, schedSetAt: planned ? new Date(row.activated_at || row.created_at).getTime() : null,
    fav: stats ? (stats.fb?.[2] || 0) + (stats.ig?.[2] || 0) : 0,
    liked: !!prefs.liked[row.id], saved: !!prefs.saved[row.id],
  };
}

async function loadData() {
  const { data: mem, error: e0 } = await sb.from("store_members").select("store_id, stores(id, name, address, city, postal_code, auto_accept, logo_url)").limit(1);
  if (e0) throw e0;
  if (!mem.length) throw new Error("Ce compte n'est rattaché à aucun magasin.");
  const st = mem[0].stores;
  await sb.rpc("demo_tick", { p_store_id: st.id }); // fait avancer la démo ; sans effet ailleurs
  const [net, acc, rows] = await Promise.all([
    sb.rpc("get_store_network", { p_store_id: st.id }),
    sb.from("social_accounts").select("channel, display_name, status").eq("store_id", st.id),
    sb.from("store_promotions").select("id, status, overrides, suspended, created_at, activated_at, promotions(id, title, description, mechanic, promo_type, discount_code, ean_code, media_url, starts_at, ends_at, is_mandatory, status, details, created_by_network_id, created_by_store_id), publications(channel, status, published_at, metrics)").eq("store_id", st.id).eq("hidden", false).order("created_at", { ascending: false }),
  ]);
  const e = net.error || acc.error || rows.error; if (e) throw e;
  const n = net.data?.[0];
  const fb = acc.data.find(a => a.channel === "facebook"), ig = acc.data.find(a => a.channel === "instagram");
  Object.assign(STORE, {
    id: st.id, name: st.name, city: st.city || "", address: st.address || "", autoAccept: st.auto_accept !== false, hasNet: !!n,
    // Logo du magasin, sinon celui de l'enseigne (même règle que la Centrale).
    logo: st.logo_url || n?.logo_url || null, canEdit: !!n?.store_edit, canDelete: !!n?.store_delete, support: n?.support_email || "", phone: n?.phone || "", cgv: n?.cgv_url || "",
    net: n?.network_name || "votre centrale", netFull: n ? `${n.network_name} · ${st.city || ""}` : "Magasin indépendant",
    page: fb?.display_name || "Non connectée", insta: ig?.display_name || "Non connecté",
  });
  S.fb = fb ? (fb.status === "active" ? "ok" : "broken") : "none";
  S.ig = ig ? (ig.status === "active" ? "ok" : "broken") : "none";
  S.promos = rows.data.filter(r => r.promotions).map(r => mapRow(r, acc.data));
}

/* ===================== Calculs ===================== */
function pricing(p) {
  const o = p.orig;
  // Promo saisie par la centrale sans chiffres détaillés : on affiche son texte d'offre tel quel.
  if (p.mech && (p.val == null || (p.type === "x_plus_y" && p.orig == null && p.val == null))) return { price: null, old: null, badge: p.mech };
  if (!p.type) return { price: null, old: null, badge: "" };
  switch (p.type) {
    case "percent": return { price: o != null ? Math.round(o * (100 - p.val)) / 100 : null, old: o, badge: `-${p.val} %` };
    case "amount": return { price: o != null ? Math.max(0, o - p.val) : null, old: o, badge: `-${eur(p.val).replace(",00", "")}` };
    case "new_price": return { price: p.val, old: o, badge: o ? `-${Math.round((1 - p.val / o) * 100)} %` : "Nouveau" };
    case "x_plus_y": return { price: p.val, old: o, badge: `${p.xy?.[0] ?? 2} + ${p.xy?.[1] ?? 1} offert` };
    case "cashback": return { price: null, old: null, badge: `${p.val} % cagnottés` };
    case "free_with_condition": return { price: null, old: null, badge: "Offert" };
  }
  return { price: null, old: null, badge: "" };
}

const pendingNet = () => S.promos.filter(p => p.src === "net" && p.status === "received" && !p.mandatory);

function activity() {
  const ev = [];
  S.promos.forEach(p => {
    if (p.pubAt) ev.push({ t: p.pubAt, p, kind: "pub" });
    if (p.src === "net" && p.status !== "published" && p.recAt) ev.push({ t: p.recAt, p, kind: "rec" });
    if (p.status === "scheduled") ev.push({ t: p.schedSetAt || Date.now(), p, kind: "sch" });
  });
  ev.sort((a, b) => b.t - a.t);
  return ev.slice(0, 7).map(({ t, p, kind }) => {
    let lines = "";
    if (kind === "pub") lines = `<div class="row" style="gap:8px;margin-top:7px">${chanIcons(p)}<span class="sp"></span>${p.ch.ig === "ko" && S.ig === "broken" ? '<button class="btn-red" style="padding:7px 12px" data-act="reconnect">Reconnecter</button>' : ""}</div>`;

// - promo de la centrale en cours ou à venir → Suspendre, si la centrale
//   l'autorise et qu'elle n'est pas obligatoire (déjà suspendue : rien).
const isOver = (p) => Date.now() > new Date(p.end).getTime();
function swipeAction(p) {
  if (p.src === "own" || isOver(p)) return "del";
  if (STORE.canDelete && !p.mandatory && !p.suspended) return "susp";
  return null;
}
function cardPromo(p) {
  const pr = pricing(p);
  const pending = p.status === "received" || (p.mandatory && !["published", "scheduled"].includes(p.status));
  const tags = `${tagSrc(p)}${p.mandatory ? '<span class="st s-mand">Obligatoire</span>' : ""}${statusPill(p)}`;
  const codes = [p.code && `Code ${esc(p.code)}`, p.ean && `EAN ${esc(p.ean)}`].filter(Boolean).join(" · ");
  const codeLine = codes ? `<div class="code">${I.bar}<span>${codes}</span></div>` : "";
  let bottom = "";
  if (p.suspended) {
    bottom = `<div class="foot"><div class="row" style="font-size:13.5px"><span class="sp" style="color:var(--muted)">Suspendue : retirée de votre vitrine.</span><button class="link" style="font-size:14px" data-resume="${p.id}">Reprendre</button></div></div>`;
  } else if (p.status === "received" && p.mandatory || (p.mandatory && p.status === "active")) {
    bottom = `<div class="band"><div class="row">${I.clock}<span>À publier avant le <b>${fmtLong(p.deadline)}</b></span></div><div class="btns"><button class="b-sand" data-sched="${p.id}">Programmer</button><button class="b-grad" data-pub="${p.id}">Publier maintenant</button></div></div>`;
  } else if (p.status === "received") {
    bottom = `<div style="padding:0 13px 13px"><div class="btns" style="margin-top:0"><button class="b-ghost" data-decline="${p.id}">Refuser</button><button class="b-grad" data-activate="${p.id}">Activer</button></div></div>`;
  } else if (p.status === "active") {
    bottom = `<div class="foot"><div class="btns" style="margin-top:0"><button class="b-ghost" data-sched="${p.id}">Programmer</button><button class="b-grad" data-pub="${p.id}">Publier maintenant</button></div></div>`;
  } else if (p.status === "scheduled") {
    bottom = `<div class="foot"><div class="row" style="font-size:14px;gap:8px">${I.clock}<span class="sp">Publication le <b>${fmtDay(p.schedAt)} à ${p.schedTime}</b></span><button class="link" style="font-size:14px" data-pub="${p.id}">Publier maintenant</button></div></div>`;
  } else if (p.status === "declined") {
    bottom = `<div class="foot"><div class="row" style="font-size:14px"><span class="sp" style="color:var(--muted)">Vous avez refusé cette promo.</span><button class="link" style="font-size:14px" data-activate="${p.id}">L'activer</button></div></div>`;
  } else if (p.status === "published") {
    bottom = `<div class="foot"><div class="row">${chanIcons(p)}<span class="sp"></span>${p.ch.ig === "ko" && S.ig === "broken" ? '<button class="btn-red" data-act="reconnect">Reconnecter</button>' : ""}</div></div>`;
  } else if (p.status === "draft") {
    bottom = `<div class="foot"><div class="row"><span class="sp" style="font-size:13.5px;color:var(--muted)">Brouillon · pas encore publié</span></div></div>`;
  }
  // Œil « Voir côté clients » en haut à droite, pour ce que les clients voient déjà.
  const eye = p.status === "published" && p.img && p.kind !== "post" ? `<button class="eye" data-act="clients" data-id="${p.id}" aria-label="Voir côté clients">${I.eye}</button>` : "";
  const card = `<div class="card ${pending ? "pending" : ""}" data-card="${p.id}">${eye}<div class="top">${imgOr(p.img)}<div class="sp"><div class="tags">${tags}</div><h3>${esc(p.title)}</h3>${pr.price != null ? `<div class="price"><span class="num">${eur(pr.price)}</span>${pr.old ? `<s>${eur(pr.old)}</s>` : ""}<span class="badge">${esc(pr.badge)}</span></div>` : pr.badge ? `<div class="price"><span class="num">${esc(pr.badge)}</span></div>` : ""}
    <div class="small">${p.sub ? `<span style="color:var(--ink)">${esc(p.sub)}</span> · ` : ""}Du ${fmtShort(p.start)} au ${fmtShort(p.end)}</div>${codeLine}${fmtLine(p)}</div></div>${bottom}</div>`;
  // Glisser vers la gauche pour supprimer, si c'est permis.
  const act = swipeAction(p);
  return act === "del" ? `<div class="swipe" data-sw="${p.id}"><button class="sw-del" data-del="${p.id}">${I.trash}Supprimer</button>${card}</div>`
    : act === "susp" ? `<div class="swipe sw-blue" data-sw="${p.id}"><button class="sw-del" data-susp="${p.id}">${I.pause}Suspendre</button>${card}</div>` : card;
}

  const eng = sum(0) ? (sum(2) / sum(0) * 100).toFixed(1).replace(".", ",") : "0";
  const pubs = S.promos.filter(p => p.status === "published").sort((a, b) => (b.pubAt || 0) - (a.pubAt || 0));
  const fails = S.promos.filter(p => Object.values(p.ch || {}).includes("ko"));
  const card = (l, i, s) => `<div class="skc"><b>${l}</b><div class="num">${nf(sum(i))}</div><div class="small">${s}</div><div class="split"><span class="f">${nf(t.fb[i])}</span><span class="i">${nf(t.ig[i])}</span></div></div>`;
  return `<div class="screen">
    <h1 class="title">Stats</h1><div class="sub">Suivi de vos publications</div>

    <div class="sec"><h2 style="font-size:16px">Résultats Facebook &amp; Instagram</h2><span style="font-size:13px;color:var(--muted);white-space:nowrap">7 derniers jours</span></div>
    <div class="sk" style="margin-top:0">${card("Portée", 0, "personnes touchées")}${card("Vues", 1, "affichages")}${card("Interactions", 2, "réactions, partages, enregistrements")}${card("Commentaires", 3, "sur vos publications")}</div>
    <div class="eng"><span>Taux d'engagement</span><span class="num">${eng} %</span></div>
    <div class="legend"><span class="f">Facebook</span><span class="i">Instagram</span><span>· source : Meta</span></div>
    ${fails.length ? `<div class="sec" style="margin-bottom:0"><h2 style="font-size:17px;color:var(--red)">À résoudre</h2></div>${fails.map(p => `<div class="resolve"><p class="sp"><b>« ${esc(p.title)} »</b>Échec Instagram : reconnecter le compte</p>${S.ig === "broken" ? '<button class="btn-red" data-act="reconnect">Reconnecter</button>' : `<button class="btn-red" data-retry="${p.id}">Republier</button>`}</div>`).join("")}` : ""}
    <div class="sec"><h2 style="font-size:17px">Statut par promo</h2></div>
    ${pubs.map(p => { const s = (i) => (p.stats?.fb?.[i] || 0) + (p.stats?.ig?.[i] || 0); return `<div class="sp-row"><img onerror="this.style.visibility='hidden'" src="${esc(p.img)}" alt="" loading="lazy"><div class="sp"><div class="row" style="gap:8px"><b class="sp" style="font-size:15px">${esc(p.title)}</b>${tagSrc(p)}</div><div style="margin-top:6px">${chanIcons(p)}</div>${p.stats ? `<div class="mini"><div><b>${nf(s(0))}</b>portée</div><div><b>${nf(s(1))}</b>vues</div><div><b>${nf(s(2))}</b>interactions</div><div><b>${nf(s(3))}</b>commentaires</div></div>` : '<div class="small">Statistiques disponibles dans quelques heures.</div>'}</div></div>`; }).join("")}

/* ===================== Rendu ===================== */
function render(keepScroll) {
  const y = window.scrollY;
  $("#view").innerHTML = ({ home: viewHome, promos: viewPromos, stats: viewStats, settings: viewSettings })[UI.tab]();
  $$("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === UI.tab));
  const n = pendingNet().length;
  $("#nav-bd").textContent = n; $("#nav-bd").classList.toggle("hidden", !n);
  $("#fab").classList.toggle("hidden", !["home", "promos"].includes(UI.tab));
  window.scrollTo(0, keepScroll ? y : 0);
}
function go(tab, sub) { UI.tab = tab; if (sub) UI.promoTab = sub; render(); }
$$("#nav button").forEach(b => b.onclick = () => go(b.dataset.tab));
$("#fab").onclick = () => sheetChoose();

document.addEventListener("click", (e) => {
  if (swiped) { swiped = false; return; }
  const t = e.target.closest("[data-go],[data-act],[data-ptab],[data-activate],[data-decline],[data-pub],[data-sched],[data-toggle],[data-open],[data-edit],[data-retry],[data-del],[data-susp],[data-resume],[data-card]");
  if (!t || t.closest("#layer")) return;
  const ds = t.dataset;
  if (ds.go) { const [a, b] = ds.go.split(":"); go(a, b); }
  else if (ds.ptab) { UI.promoTab = ds.ptab; render(); }
  else if (ds.activate) setStatus(find(ds.activate), "active", (p) => `« ${p.title} » activée. Publiez-la ou programmez-la.`);
  else if (ds.decline) setStatus(find(ds.decline), "declined", (p) => `« ${p.title} » refusée. Votre centrale est informée.`);
  else if (ds.pub) publish(find(ds.pub));
  else if (ds.sched) sheetSchedule(find(ds.sched));
  else if (ds.retry) { const p = find(ds.retry); publish(p, true); }
  else if (ds.toggle === "autoAccept") setAutoAccept(!STORE.autoAccept);
  else if (ds.toggle) { S[ds.toggle] = !S[ds.toggle]; save(); render(true); }
  else if (ds.open) clients(ds.open);
  else if (ds.edit) createForm("promo", find(ds.edit));
  else if (ds.act === "clients") clients(ds.id);
  else if (ds.del) askDelete(find(ds.del));
  else if (ds.susp) askSuspend(find(ds.susp));
  else if (ds.resume) setSuspended(find(ds.resume), false);
  else if (ds.card) { if (closeSwipes()) return; openPromo(find(ds.card)); }
  else if (ds.act === "reconnect") reconnect();
  else if (ds.act === "disconnect") toast("Gardez Instagram connecté pour que vos promos y paraissent.");
  else if (ds.act === "logout") sb.auth.signOut().then(() => location.reload());
});
const find = (id) => S.promos.find(p => p.id === id);

/* ===================== Glisser pour supprimer ===================== */
let swiped = false, drag = null;
function closeSwipes(except) {
  let had = false;
  $$(".swipe.open").forEach(w => { if (w !== except) { w.classList.remove("open"); w.querySelector(".card").style.transform = ""; had = true; } });
  return had;
}
document.addEventListener("pointerdown", (e) => {
  const w = e.target.closest(".swipe"); if (!w || e.target.closest(".sw-del")) return;
  drag = { w, x: e.clientX, y: e.clientY, dx: 0, base: w.classList.contains("open") ? -96 : 0, on: false };
});
document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.on) { if (Math.abs(dx) < 8 || Math.abs(dy) > Math.abs(dx)) { if (Math.abs(dy) > 10) drag = null; return; } drag.on = true; drag.w.classList.add("drag"); closeSwipes(drag.w); }
  drag.dx = dx; const x = Math.max(-110, Math.min(0, drag.base + dx));
  drag.w.querySelector(".card").style.transform = `translateX(${x}px)`;
});
document.addEventListener("pointercancel", () => { if (drag) { drag.w.classList.remove("drag"); drag.w.querySelector(".card").style.transform = drag.base ? "translateX(-96px)" : ""; drag = null; } });
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const { w, on, base, dx } = drag; drag = null;
  if (!on) return;
  swiped = true; setTimeout(() => swiped = false, 50);
  w.classList.remove("drag");
  const open = base + dx < -48;
  w.classList.toggle("open", open); w.querySelector(".card").style.transform = open ? "translateX(-96px)" : "";
});
function askDelete(p) {
  if (!p) return;
  sheet(`<div class="grab"></div><h2>Supprimer « ${esc(p.title)} » ?</h2>
    <p class="small" style="font-size:14px;margin-top:6px">${p.src === "own" ? "La promo disparaît de votre app et de votre vitrine. Les publications déjà faites sur Facebook et Instagram restent en ligne." : "Cette promo est terminée : elle disparaît de votre liste. Votre centrale le voit dans son suivi."}</p>
    <button class="big-btn" id="d-go" style="background:var(--red)">${I.trash}Supprimer</button><button class="txt-btn" data-close>Annuler</button>`);
  $("#d-go").onclick = async () => {
    $("#d-go").disabled = true;
    const { error } = p.src === "own"
      ? await sb.from("promotions").delete().eq("id", p.promoId)
      : await sb.from("store_promotions").update({ hidden: true }).eq("id", p.spId);
    if (error) { closeLayer(); return toast(errText(error)); }
    S.promos = S.promos.filter(x => x.id !== p.id); closeLayer(); render(true); toast("Promo supprimée."); refresh();
  };
}

function askSuspend(p) {
  if (!p) return;
  sheet(`<div class="grab"></div><h2>Suspendre « ${esc(p.title)} » ?</h2>
    <p class="small" style="font-size:14px;margin-top:6px">La promo est retirée de votre vitrine et vous ne la publiez plus. Vous pourrez la reprendre à tout moment tant qu'elle court. Votre centrale le voit dans son suivi.</p>
    <button class="big-btn" id="s-go" style="background:var(--blue)">${I.pause}Suspendre</button><button class="txt-btn" data-close>Annuler</button>`);
  $("#s-go").onclick = () => { $("#s-go").disabled = true; setSuspended(p, true); };
}
async function setSuspended(p, on) {
  if (!p) return;
  const { error } = await sb.from("store_promotions").update({ suspended: on }).eq("id", p.spId);
  if ($("#layer").innerHTML) closeLayer();
  if (error) return toast(errText(error));
  p.suspended = on; render(true); toast(on ? "Promo suspendue." : "Promo reprise."); refresh();
}

/* ===================== Ouvrir une promo ===================== */
function openPromo(p) {
  if (!p) return;
  if (p.src === "own") return createForm(p.kind, p);
  sheetNet(p);
}
// Promo de la centrale : personnalisable (titre, texte, visuel) si la centrale
// l'autorise ; sinon affichée en lecture seule, grisée.
function sheetNet(p) {
  const can = STORE.canEdit, F = { title: p.title, text: p.text, img: p.img };
  const pr = pricing(p), dis = can ? "" : "disabled";
  const draw = () => {
    sheet(`<div class="grab"></div><h2>${can ? "Personnaliser la promo" : "Promo de la centrale"}</h2>
      ${can ? "" : `<p class="hint" style="color:var(--muted)">Votre centrale ${esc(STORE.net)} ne permet pas de modifier ses promos.</p>`}
      <div class="${can ? "" : "ro-box"}">
      <div class="preview-img" style="margin-top:12px"><img onerror="this.style.visibility='hidden'" src="${esc(F.img || "")}" alt="">${can ? '<button id="n-img">Changer</button>' : ""}</div>
      <div class="fl">TITRE</div><input class="in" id="n-title" maxlength="90" value="${esc(F.title)}" ${dis}>
      <div class="fl">TEXTE DU POST</div><textarea class="in" id="n-text" rows="5" maxlength="1500" ${dis}>${esc(F.text)}</textarea>
      <div class="fl">FIXÉ PAR LA CENTRALE</div>
      <div class="ro-line">${[pr.badge, `Du ${fmtShort(p.start)} au ${fmtShort(p.end)}`, p.code && `Code ${esc(p.code)}`, p.ean && `EAN ${esc(p.ean)}`, p.mandatory && "Obligatoire"].filter(Boolean).map(esc).join(" · ")}</div>
      </div>
      ${can ? `<button class="big-btn" id="n-save">Enregistrer</button>${Object.keys(p.ov || {}).length ? '<button class="txt-btn" id="n-reset">Revenir à la version de la centrale</button>' : ""}` : ""}
      <button class="txt-btn" data-close>${can ? "Annuler" : "Fermer"}</button>`);
    if (!can) return;
    $("#n-title").oninput = (e) => F.title = e.target.value;
    $("#n-text").oninput = (e) => F.text = e.target.value;
    $("#n-img").onclick = () => pickMedia("file", (src) => { F.img = src; draw(); });
    const saveOv = async (ov) => {
      const { error } = await sb.from("store_promotions").update({ overrides: ov }).eq("id", p.spId);
      if (error) return toast(errText(error));
      closeLayer(); await refresh(); toast(Object.keys(ov).length ? "Promo personnalisée." : "Version de la centrale rétablie.");
    };
    $("#n-save").onclick = async () => {
      $("#n-save").disabled = true;
      try {
        const ov = {};
        if (F.title.trim() && F.title.trim() !== p.base.title) ov.title = F.title.trim();
        if (F.text.trim() !== (p.base.text || "").trim()) ov.text = F.text.trim();
        const img = await ensureUploaded(F.img);
        if (img && img !== p.base.img) ov.media_url = img;
        await saveOv(ov);
      } catch (e) { toast(errText(e)); $("#n-save").disabled = false; }
    };
    $("#n-reset") && ($("#n-reset").onclick = () => saveOv({}));
  };
  draw();
}

/* ===================== Actions ===================== */
async function setStatus(p, status, msg) {
  const { error } = await sb.from("store_promotions").update({ status }).eq("id", p.spId);
  if (error) return toast(errText(error));
  p.status = status; render(true); toast(msg(p)); refresh();
}
function reconnect() {
  sheet(`<div class="pub"><div class="spin"></div><h2>Connexion à Instagram…</h2><p class="small" style="font-size:14px">Via votre Page Facebook ${esc(STORE.page)}</p></div>`);
  const failed = S.promos.filter(p => p.ch?.ig === "ko");

// Photo prise ou choisie sur le téléphone : convertie en JPEG au format
// Instagram, puis déposée dans le dossier du magasin (bucket promo-media).
async function ensureUploaded(src) {

  const blob = await (await fetch(src)).blob();
  const bmp = await createImageBitmap(blob, { imageOrientation: "from-image" });

  if (ratio < 0.8) { const h = Math.round(sw / 0.8); sy = Math.round((sh - h) / 2); sh = h; }
  else if (ratio > 1.91) { const w = Math.round(sh * 1.91); sx = Math.round((sw - w) / 2); sw = w; }

  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  const jpeg = await new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(new Error("Conversion impossible.")), "image/jpeg", 0.9));
  const path = `${STORE.id}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from("promo-media").upload(path, jpeg, { contentType: "image/jpeg", upsert: false });
  if (error) throw error;
  return sb.storage.from("promo-media").getPublicUrl(path).data.publicUrl;
}

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">${items.map((s, k) => `<button data-lib="${k}" style="aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg)"><img onerror="this.style.visibility='hidden'" src="${esc(s)}" alt="" style="width:100%;height:100%;object-fit:cover"></button>`).join("")}</div>
      <button class="txt-btn" data-close>Annuler</button>`, true);
    $$("[data-lib]").forEach(b => b.onclick = () => { const s = items[+b.dataset.lib]; closeSheetOnly(); done(s); });
    return;
  }
  const input = src === "cam" ? $("#cam") : $("#file");
  input.onchange = () => { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(f); input.value = ""; };
  input.click();
}

/* ===================== Vue client ===================== */
function clients(startId) {
  const list = S.promos.filter(p => p.status === "published" && p.img && p.kind !== "post");
  if (!list.length) return toast("Publiez une promo pour la voir côté clients.");
  const idx = Math.max(0, list.findIndex(p => p.id === startId));
  const layer = $("#layer");
  layer.innerHTML = `<div class="reels" id="reels">${list.map((p, k) => { const pr = pricing(p); return `<section class="reel">
    <img onerror="this.style.visibility='hidden'" src="${esc(p.img)}" alt=""><div class="shade"></div>
    <div class="prog">${list.map((_, j) => `<i class="${j <= k ? "on" : ""}"></i>`).join("")}</div>
    <div class="rh"><button class="back glass" data-close>${I.back}</button><span class="rav">${avatar()}</span><div><b>${esc(STORE.name)}</b><span>${esc(STORE.city)} · À 1,2 km</span></div><span class="open glass">${I.clock.replace('width="20" height="20"', 'width="13" height="13"')}Ouvert</span></div>
    <button class="pillback" data-close>${I.back.replace('width="20" height="20"', 'width="15" height="15"')}Côté clients · Revenir au magasin</button>
    <div class="side"><button data-fav="${p.id}"><i class="glass">${I.heart(p.liked)}</i><span id="fav-${p.id}">${(p.fav || 0) + (p.liked ? 1 : 0)}</span></button><button data-tip="Itinéraire vers ${esc(STORE.address)}"><i class="glass">${I.pin}</i>Itinéraire</button><button data-tip="Lien de la promo copié"><i class="glass">${I.share}</i>Partager</button><button data-savep="${p.id}"><i class="glass">${I.save(p.saved)}</i>${p.saved ? "Enregistré" : "Enregistrer"}</button></div>
    <div class="info"><small>${esc(STORE.name)} · Jusqu'au ${fmtShort(p.end)}</small><h3>${esc(p.title)}</h3><p>${esc(p.sub || `Valable du ${fmtShort(p.start)} au ${fmtShort(p.end)}`)}</p>
      <div class="pr">${pr.price != null ? `<b>${eur(pr.price)}</b>${pr.old ? `<s>${eur(pr.old)}</s>` : ""}` : ""}<em>${esc(pr.badge)}</em></div></div>
    <button class="cta" data-code="${p.id}">${I.bar.replace('width="14" height="14"', 'width="20" height="20"')}J'en profite</button>
  </section>`; }).join("")}</div>`;
  const r = $("#reels"); r.scrollTop = idx * window.innerHeight;
  document.body.style.overflow = "hidden";
  $$("[data-close]", layer).forEach(b => b.onclick = closeLayer);
  $$("[data-tip]", layer).forEach(b => b.onclick = () => toast(b.dataset.tip));
  $$("[data-fav]", layer).forEach(b => b.onclick = () => { const p = find(b.dataset.fav); p.liked = !p.liked; save(); b.querySelector("i").innerHTML = I.heart(p.liked); $("#fav-" + p.id).textContent = (p.fav || 0) + (p.liked ? 1 : 0); });
  $$("[data-savep]", layer).forEach(b => b.onclick = () => { const p = find(b.dataset.savep); p.saved = !p.saved; save(); b.innerHTML = `<i class="glass">${I.save(p.saved)}</i>${p.saved ? "Enregistré" : "Enregistrer"}`; });
  $$("[data-code]", layer).forEach(b => b.onclick = () => codeBox(find(b.dataset.code)));
}
function barcode(code) {
  const digits = (code || "9901230000017").replace(/\D/g, "").padEnd(13, "0");
  let bars = ""; const add = (w, on) => bars += `<span style="width:${w * 2.2}px;background:${on ? "#16130f" : "transparent"}"></span>`;
  add(1, 1); add(1, 0); add(1, 1);
  for (const ch of digits) { const n = +ch; add((n % 3) + 1, 1); add(((n + 1) % 3) + 1, 0); add(((n + 2) % 2) + 1, 1); add((n % 2) + 1, 0); }
  add(1, 1); add(1, 0); add(1, 1);
  return bars;
}
function codeBox(p) {
  const el = document.createElement("div"); el.className = "codebox";
  const draw = (shown) => {
    el.innerHTML = `<div class="in2"><small>${esc(p.title.toUpperCase())}</small><h3>Code de réduction</h3>
      <div style="position:relative"><div class="bars ${shown ? "" : "mask"}">${barcode(p.code)}</div>${shown ? "" : `<div class="lock"><i>${I.lock}</i><span>Code masqué</span></div>`}</div>
      <div class="digits ${shown ? "" : "mask-d"}">${esc(p.code || "9 901230 000017")}</div>
      ${shown ? `<div class="used">${I.check}Promotion activée · présentez ce code en caisse</div><button class="dark-btn" id="cb-x">Terminé</button>` :
      `<p class="small" style="font-size:14px;margin:14px 0 0;line-height:1.45">Révélez le code pour le scanner en caisse : on compte ainsi chaque promo réellement utilisée.</p><button class="big-btn" id="cb-go">${I.eye}Utiliser cette promotion</button>`}</div>`;
    $("#cb-go", el) && ($("#cb-go", el).onclick = () => draw(true));
    $("#cb-x", el) && ($("#cb-x", el).onclick = () => el.remove());
  };
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  draw(false); document.body.appendChild(el);
}

/* ===================== Couches ===================== */
function sheet(html, keepUnder) {
  const layer = $("#layer");
  if (keepUnder && layer.querySelector(".full")) {
    const ov = document.createElement("div"); ov.className = "ov"; ov.id = "subsheet"; ov.innerHTML = `<div class="sheet">${html}</div>`;
    ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
    document.body.appendChild(ov);
    $$("[data-close]", ov).forEach(b => b.onclick = () => ov.remove());
    return;
  }
  layer.innerHTML = `<div class="ov"><div class="sheet">${html}</div></div>`;
  const ov = $(".ov", layer);
  ov.onclick = (e) => { if (e.target === ov && !$(".spin", ov)) closeLayer(); };
  $$("[data-close]", layer).forEach(b => b.onclick = closeLayer);
  document.body.style.overflow = "hidden";
}
function closeSheetOnly() { $("#subsheet")?.remove(); }
function closeLayer() { $("#layer").innerHTML = ""; $("#subsheet")?.remove(); document.body.style.overflow = ""; }

$("#nav").classList.add("hidden"); $("#fab").classList.add("hidden");
boot();
</script>
