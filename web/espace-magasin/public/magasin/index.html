<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vitriin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vitriin">
<link rel="manifest" href="/magasin/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Racing+Sans+One&display=swap" rel="stylesheet">
<style>
/* Vitriin App · maquette Claude Design « Vitriin App » (magenta), version démo. */
:root{
  --p:#e5087e; --v:#951b81; --grad:linear-gradient(100deg,#e5087e 0%,#951b81 100%);
  --ink:#2D2D2D; --muted:#7b766f; --faint:#a8a29b; --line:#EEECE8; --bg:#f6f3ee;
  --rose:#fdf1f4; --rose2:#fde7ef; --mint:#eef5f0; --teal:#0c9875; --teal2:#5ebca3;
  --sand:#faf6ee; --sandline:#ecdcc0; --red:#c8342b;--blue:#2f6fdb; --redbg:#fdeeec; --lilac:#f7eef6;
  --fb:#1877F2; --ig:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,textarea{font-family:inherit;color:var(--ink)}
img{display:block}
.hidden{display:none!important}
.num{font-family:'Racing Sans One','DM Sans',sans-serif;font-weight:400;letter-spacing:.01em}
@media (min-width:560px){
  body{background:#e9e6e1}
  #app{max-width:430px;margin:0 auto;background:#fff;min-height:100dvh;box-shadow:0 0 40px rgba(0,0,0,.08);position:relative}
}
#app{position:relative;min-height:100dvh;overflow-x:hidden}
.screen{padding:calc(var(--sat) + 18px) 16px calc(var(--nav) + var(--sab) + 28px)}
h1.title{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{font-size:14px;color:var(--muted);margin-top:3px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.chev{flex:none;opacity:.8}

/* ---- Header ---- */
.head{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none;overflow:hidden}
.av img,.rav img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.head .sp b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.head .sp span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.logo-sw{position:relative;border:none;padding:0;width:52px;height:52px;flex:none;background:none}
.logo-sw .eyeb{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--p);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.logo-sw .eyeb svg{width:13px;height:13px}
.sec .cnt{background:var(--p);color:#fff;font-size:12.5px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.todo-box{border:1px solid var(--line);border-radius:18px;padding:2px 14px;background:#fff}
.todo-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.todo-row:last-child{border-bottom:none}
.todo-row .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.todo-row .ic svg{width:19px;height:19px}
.todo-row b{display:block;font-size:15px;line-height:1.3}
.todo-row .sp>span{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-row .sp{min-width:0}
.all-ok{display:flex;align-items:center;gap:10px;padding:14px 0;color:var(--teal);font-weight:700;font-size:15px}
.week{width:100%;margin-top:22px;display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:14px 16px;text-align:left}
.week b{display:block;font-size:15px}.week .sp>span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.btn-red{background:var(--red);color:#fff;font-weight:700;font-size:13.5px;padding:10px 15px;border-radius:999px;white-space:nowrap;flex:none}

/* ---- Sections ---- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.link{color:var(--p);font-weight:700;font-size:15px;display:flex;align-items:center;gap:3px}
.carousel{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .slide{flex:none;width:84%;scroll-snap-align:start}
.carousel .big{margin-bottom:0}
.rav{border:none;padding:0;cursor:pointer}
.price{display:flex;align-items:baseline;gap:7px;margin-top:5px;flex-wrap:wrap}
.price .num{font-size:21px;color:var(--p)}
.price s{font-size:13px;color:var(--faint)}
.tag{position:absolute;top:9px;left:9px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px}
.t-own{background:#f6ecd8;color:#6b5a3e}.t-net{background:#f6e6f4;color:var(--v)}
.disc{position:absolute;top:9px;right:9px;background:var(--p);color:#fff;font-family:'Racing Sans One',sans-serif;font-size:14px;padding:3px 9px;border-radius:9px}
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-pub{background:#e3f3ec;color:var(--teal)}.s-rec{background:var(--rose2);color:var(--p)}.s-act{background:#eef0fb;color:#5b63c4}
.s-sch{background:#fbf0e6;color:#b07a2e}.s-draft{background:#f0eeec;color:var(--muted)}.s-dec{background:var(--redbg);color:var(--red)}
.s-mand{background:#2D2D2D;color:#fff}
.meta{font-size:12.5px;color:var(--muted);margin-left:6px}

/* ---- Activité ---- */
.dot{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.35}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:currentColor}
.d-ok{color:var(--teal)}.d-ko{color:var(--red)}

/* ---- Nav + FAB ---- */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:20}
@media (min-width:560px){.nav{max-width:430px;margin:0 auto}}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#a8a29b;font-size:11.5px;font-weight:600;position:relative}
.nav button.on{color:var(--p)}
.nav .bd{position:absolute;top:7px;left:calc(50% + 4px);background:var(--p);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + var(--sab) + 14px);width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(229,8,126,.42);z-index:21}
@media (min-width:560px){.fab{right:calc(50% - 215px + 16px)}}

/* ---- Promos ---- */
.seg{display:flex;background:#f3f1ed;border-radius:999px;padding:4px;margin-top:16px}
.seg button{flex:1;padding:11px 8px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg .c{background:var(--p);color:#fff;font-size:11.5px;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.intro{font-size:14px;color:var(--muted);line-height:1.45;margin:14px 0}
/* Cartes promo : « à traiter » (ligne, piste B) et grande carte (piste A) */
.card{position:relative;background:#fff;cursor:pointer}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
.sec-h h2{font-size:17px;margin:0}.sec-h span{font-size:13px;color:var(--muted)}
.big{border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:12px}
.big .im{position:relative;height:190px;background:var(--bg)}
.big .im img{width:100%;height:100%;object-fit:cover;display:block}
.big .bd{padding:12px 16px 14px}
.big h3{font-size:17px;margin:0;letter-spacing:-.01em}
.big .d{font-size:14px;color:var(--muted);margin-top:3px}
.chip{position:absolute;top:12px;left:12px;background:var(--cc);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}

.big .btns{margin-top:12px}
.big .btns button{padding:11px 8px;font-size:14.5px;border-radius:12px}
.cats{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--ink)}
.cats button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cc)}
.cats button em{font-style:normal;font-size:12px;color:var(--muted)}
.cats button.on{background:var(--cc);border-color:var(--cc);color:#fff}
.cats button.on::before{background:#fff}.cats button.on em{color:#fff;opacity:.85}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:flex-start}
.pager::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;padding:12px 16px 0;box-sizing:border-box;min-height:50vh}
.fiche .stchip{background:var(--cc);color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}
.fiche .fhero .photo{position:absolute;inset:0;width:100%;background:transparent}
.fiche .ph-hint{position:absolute;left:14px;bottom:14px;background:rgba(45,45,45,.7);color:#fff;font-size:13px;font-weight:700;padding:7px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;pointer-events:none}
.fiche .ph-hint svg,.fiche .fhero .lib svg{width:16px;height:16px}
.fiche .fhero .lib{position:absolute;right:14px;bottom:14px;background:#fff;color:var(--v);font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
.kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
/* Page promo : jamais de défilement horizontal (iPhone faisait bouger la page de côté). */
.fiche{overflow-x:hidden}
.fiche .scroll{overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}
.fiche .scroll .in{min-width:0;max-width:100%;box-sizing:border-box}
.fiche .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fiche input[type=date]{-webkit-appearance:none;appearance:none;min-height:50px;text-align:left}
.kpis4 span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis4 div{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.kpis4 b{display:block;font-size:17px}.kpis4 span{font-size:11px;color:var(--muted)}
.offer{position:absolute;left:12px;bottom:12px;background:var(--p);color:#fff;font-weight:700;font-size:19px;padding:5px 11px;border-radius:12px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big .eye{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--p);display:flex;align-items:center;justify-content:center}
.big .eye svg{width:19px;height:19px}
/* Fiche promo */
.fiche .fhero{position:relative;height:290px;background:var(--bg);flex:none}
.fiche .fhero img{width:100%;height:100%;object-fit:cover;display:block}
.fiche .fhero .fx,.fiche .fhero .cl{position:absolute;top:calc(var(--sat) + 12px);height:44px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13.5px}
.fiche .fhero .fx{left:14px;width:44px;color:var(--ink)}.fiche .fhero .cl{right:14px;padding:0 14px;color:var(--p)}
.fiche .scroll{padding:16px 18px 20px}
.fiche h1{font-size:23px;margin:6px 0 4px;letter-spacing:-.02em}
.fiche .pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fiche .pr b{font-size:26px;color:var(--p)}.fiche .pr s{color:var(--muted);font-size:15px}
.fiche .box{border:1px solid var(--line);border-radius:16px;padding:2px 14px;margin-top:14px}
.fiche .box .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.fiche .box .li:last-child{border-bottom:none}
.fiche details{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.fiche summary{font-weight:700;font-size:14.5px;cursor:pointer}
.fiche .acts{display:flex;gap:10px}
.fiche .acts button{flex:1;min-height:50px;border-radius:15px;font-weight:700;font-size:15px}
.fiche .links{display:flex;justify-content:center;gap:22px;margin-top:8px}
.fiche .links button{font-weight:700;font-size:14px;padding:8px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.badge{background:var(--p);color:#fff;font-family:'Racing Sans One',sans-serif;font-size:13px;padding:2px 8px;border-radius:7px}
.small{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}
.code{display:flex;gap:6px;align-items:flex-start;font-size:13px;margin-top:5px;line-height:1.35}
.code svg{flex:none;margin-top:3px}
.band{background:var(--sand);border-top:1px solid #f0e6d6;padding:12px 13px 13px}
.band .row{font-size:14px;color:#5b4b33;gap:8px}
.btns{display:flex;gap:9px;margin-top:11px}
.btns button{flex:1;padding:13px 8px;border-radius:13px;font-weight:700;font-size:14.5px;white-space:nowrap}
.b-ghost{background:#fff;border:1.5px solid var(--line)!important}
.b-sand{background:#fff;border:1.5px solid var(--sandline)!important}
.b-grad{background:var(--grad);color:#fff}
.b-grad:disabled{background:#e8e5df;color:#a8a29b}
.foot{border-top:1px solid var(--line);padding:11px 13px 13px}
.chans{display:flex;gap:7px;align-items:center}
.ch{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ch.fb{background:var(--fb)}.ch.ig{background:var(--ig);border-radius:9px}
.ch.off{background:#e7e4df!important}
.ch.ko::after{content:"×";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;line-height:13px;text-align:center;font-weight:700;border:1.5px solid #fff}
.see{display:inline-flex;align-items:center;gap:6px;color:var(--p);font-weight:700;font-size:14px;margin-top:9px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}

/* ---- Stats ---- */
.sk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.skc{border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.skc b{font-size:13.5px}
.skc .num{font-size:24px;margin-top:5px;color:var(--ink);line-height:1}
.skc .small{margin-top:3px;font-size:12px}
.split{display:flex;gap:12px;margin-top:9px;font-size:13px;font-weight:600}
.split span{display:flex;align-items:center;gap:5px}
.split span::before{content:"";width:8px;height:8px;border-radius:50%}
.split .f::before{background:var(--fb)}.split .i::before{background:#e1306c}
.eng{display:flex;align-items:center;justify-content:space-between;background:var(--lilac);border-radius:14px;padding:10px 14px;margin-top:8px;font-weight:600;font-size:15px}
.eng .num{font-size:22px;color:var(--v)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend .f::before,.legend .i::before{content:"";width:8px;height:8px;border-radius:50%}
.legend .f::before{background:var(--fb)}.legend .i::before{background:#e1306c}
.resolve{background:var(--redbg);border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;margin-top:10px}
.resolve p{margin:0;font-size:13.5px;color:var(--red);font-weight:600;line-height:1.35}
.resolve b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.sp-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tap{cursor:pointer}.tap:active{background:var(--bg)}
.st-tab{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.st-tab th{padding:6px 4px;width:30%}.st-tab th:first-child{width:40%}
.st-tab td{padding:10px 4px;border-top:1px solid var(--line);text-align:center;font-weight:700}
.st-tab td:first-child{text-align:left;font-weight:500;color:var(--muted)}
.st-tab td.sm{font-size:12px;font-weight:500;color:var(--muted)}
.st-line{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.st-line b{font-size:17px}.st-line small{font-size:12px;color:var(--muted);font-weight:500}
.sp-row:last-child{border-bottom:none}
.sp-row>img{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.mini div{background:#f6f4f0;border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.mini b{color:var(--ink);font-size:14px;margin-right:4px}

/* ---- Réglages ---- */
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:22px 0 9px}
.box{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px}
.li+.li{border-top:1px solid var(--line)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:#e3f3ec;color:var(--teal)}.p-ko{background:var(--redbg);color:var(--red)}.p-off{background:#f0eeec;color:var(--muted)}
.tg:disabled{opacity:.45}
.li.soon .ch{opacity:.45}
.store-card{padding-bottom:12px}
.store-card .infos{padding:0 0 4px 68px;display:flex;flex-direction:column;gap:6px}
.info-l{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}.info-l svg{color:var(--muted);flex:none}
.edit-btn{margin:10px 0 0 68px;color:var(--p);font-weight:700;font-size:14.5px;padding:6px 0}
.affil{display:flex;align-items:center;gap:8px;margin:14px 2px 0;font-size:14px;color:var(--muted)}.affil svg{width:18px;height:18px;color:var(--v);flex:none}.affil b{color:var(--ink)}
.tg{width:48px;height:28px;border-radius:999px;background:#dcd8d1;position:relative;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.tg.on{background:var(--teal2)}.tg.on::after{left:23px}
.out{width:100%;margin-top:22px;border:1.5px solid var(--line);border-radius:16px;padding:15px;color:var(--red);font-weight:700;font-size:15.5px}

.in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:16px;outline:none;background:#fff}

.recap{background:var(--rose);border-radius:14px;padding:13px 14px;font-size:14.5px;line-height:1.45;margin-top:14px}
.big-btn{width:100%;margin-top:14px;background:var(--grad);color:#fff;font-weight:700;font-size:16.5px;padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px}
.big-btn:disabled{background:#e8e5df;color:#a8a29b}
.txt-btn{width:100%;margin-top:10px;color:var(--muted);font-weight:600;font-size:15px;padding:10px}
.full{position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;animation:up .22s ease-out}

.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}

function mapRow(row, accounts) {
  const pr = row.promotions, det = pr.details || {};
  const pubs = row.publications || [];
  const byCh = { fb: pubs.find(x => x.channel === "facebook"), ig: pubs.find(x => x.channel === "instagram") };
  const ch = {};
  ["fb", "ig"].forEach(c => { const x = byCh[c]; if (x?.status === "published") ch[c] = "ok"; else if (x?.status === "failed") ch[c] = "ko"; });
  const done = pubs.filter(x => x.status === "published" || x.status === "failed");
  const planned = pubs.find(x => x.status === "pending" && new Date(x.published_at) > Date.now());
  let status;
  if (pr.status === "draft") status = "draft";
  else if (done.length) status = "published";
  else if (planned) status = "scheduled";
  else if (row.status === "declined") status = "declined";
  else if (row.status === "active") status = "active";
  else status = "received";
  const start = new Date(pr.starts_at), end = new Date(pr.ends_at);
  const m = (x) => x?.status === "published" && x.metrics ? [+x.metrics.reach || 0, +x.metrics.views || 0, (+x.metrics.reactions || 0) + (+x.metrics.shares || 0), +x.metrics.comments || 0] : null;
  const stats = done.length ? { fb: m(byCh.fb), ig: m(byCh.ig) } : null;
  const chAt = { fb: byCh.fb?.status === "published" ? byCh.fb.published_at : null, ig: byCh.ig?.status === "published" ? byCh.ig.published_at : null };
  const sched = planned ? new Date(planned.published_at) : null;
  return {
    id: row.id, spId: row.id, promoId: pr.id, src: pr.created_by_network_id ? "net" : "own",
    // Personnalisation du magasin (si la centrale l'autorise) par-dessus la version centrale.
    suspended: !!row.suspended, hidden: !!row.hidden, ov: row.overrides || {}, base: { title: pr.title, text: pr.description || "", img: pr.media_url },
    kind: pr.promo_type ? "promo" : "post", title: row.overrides?.title || pr.title, img: row.overrides?.media_url || pr.media_url,
    media: row.overrides?.media_url ? [row.overrides.media_url] : Array.isArray(det.media) && det.media.length ? det.media : (pr.media_url ? [pr.media_url] : []),
    // Visuels d'origine de la centrale : alimentent la médiathèque du magasin.
    netMedia: pr.created_by_network_id ? (Array.isArray(det.media) && det.media.length ? det.media : (pr.media_url ? [pr.media_url] : [])) : [],
    formats: Array.isArray(det.formats) ? det.formats : [], mech: pr.mechanic, text: row.overrides?.text || pr.description || "",
    type: pr.promo_type, orig: det.orig ?? null, val: det.val ?? null, xy: det.xy || [2, 1], sub: det.sub || "", cond: det.sub || "",
    start, end, code: pr.discount_code, ean: pr.ean_code, mandatory: pr.is_mandatory, deadline: start > Date.now() ? start : end,
    status, ch, chAt, stats,
    pubAt: done.length ? Math.max(...done.map(x => new Date(x.published_at).getTime())) : null,
    schedAt: sched ? new Date(sched.getFullYear(), sched.getMonth(), sched.getDate()).getTime() : null,
    schedTime: sched ? sched.toTimeString().slice(0, 5) : null,
    fav: stats ? (stats.fb?.[2] || 0) + (stats.ig?.[2] || 0) : 0,
    liked: !!prefs.liked[row.id], saved: !!prefs.saved[row.id],
  };
}

  if (e0) throw e0;
  if (!mem.length) throw new Error("Ce compte n'est rattaché à aucun magasin.");
  const st = mem[0].stores;
  await sb.rpc("demo_tick", { p_store_id: st.id }); // fait avancer la démo ; sans effet ailleurs
  const [net, acc, rows, rev, tk] = await Promise.all([
    sb.rpc("get_store_network", { p_store_id: st.id }),
    sb.from("social_accounts").select("channel, display_name, status, enabled").eq("store_id", st.id),
    sb.from("store_promotions").select("id, status, overrides, suspended, hidden, created_at, activated_at, promotions(id, title, description, mechanic, promo_type, discount_code, ean_code, media_url, starts_at, ends_at, is_mandatory, status, details, created_by_network_id, created_by_store_id), publications(channel, status, published_at, metrics)").eq("store_id", st.id).order("created_at", { ascending: false }),
    // Codes révélés par les clients (drive to store), lisibles par le magasin seulement.
    sb.from("code_reveals").select("store_promotion_id, revealed_at, confidence, used_at").eq("store_id", st.id).order("revealed_at", { ascending: false }).range(0, 9999),

  const allRev = (!rev.error && rev.data) || [];

  S.codes7By = reveals.filter(r => Date.now() - new Date(r.revealed_at) < 7 * DAY).reduce((m, r) => (m[r.store_promotion_id] = (m[r.store_promotion_id] || 0) + 1, m), {});
  const n = net.data?.[0];
  const fb = acc.data.find(a => a.channel === "facebook"), ig = acc.data.find(a => a.channel === "instagram");
  Object.assign(STORE, {
    id: st.id, slug: st.slug || "", name: st.name, city: st.city || "", address: st.address || "", autoAccept: st.auto_accept !== false, hasNet: !!n,
    // Logo du magasin, sinon celui de l'enseigne (même règle que la Centrale).
    logo: st.logo_url || n?.logo_url || null, canEdit: !!n?.store_edit, canDelete: !!n?.store_delete, support: n?.support_email || "", phone: n?.phone || "", cgv: n?.cgv_url || "",
    net: n?.network_name || "votre centrale", netFull: n ? `${n.network_name} · ${st.city || ""}` : "Magasin indépendant",
    page: fb?.display_name || "Non connectée", insta: ig?.display_name || "Non connecté",
    postal: st.postal_code || "", contact: { first: st.contact_first_name || "", last: st.contact_last_name || "", phone: st.contact_phone || "", email: st.contact_email || "", web: st.website || "" },
    pub: { desc: st.description || "", cover: st.cover_url || "", phone: st.public_phone || "", email: st.public_email || "" },
  });
  const chState = (a) => !a ? "none" : a.enabled === false ? "off" : a.status === "active" ? "ok" : "broken";
  S.fb = chState(fb); S.ig = chState(ig);
  const all = rows.data.filter(r => r.promotions).map(r => mapRow(r, acc.data));
  S.promos = all.filter(p => !p.hidden); S.trash = all.filter(p => p.hidden); // corbeille : onglet « Supprimées »
}

/* ===================== Calculs ===================== */
function pricing(p) {
  const o = p.orig;
  // Promo saisie par la centrale sans chiffres détaillés : on affiche son texte d'offre tel quel.
  if (p.mech && (p.val == null || (p.type === "x_plus_y" && p.orig == null && p.val == null))) return { price: null, old: null, badge: p.mech };
  if (!p.type) return { price: null, old: null, badge: "" };
  switch (p.type) {
    case "percent": return { price: o != null ? Math.round(o * (100 - p.val)) / 100 : null, old: o, badge: `-${p.val} %` };
    case "amount": return { price: o != null ? Math.max(0, o - p.val) : null, old: o, badge: `-${eur(p.val).replace(",00", "")}` };
    case "new_price": return { price: p.val, old: o, badge: o ? `-${Math.round((1 - p.val / o) * 100)} %` : "Nouveau" };
    case "x_plus_y": return { price: p.val, old: o, badge: `${p.xy?.[0] ?? 2} + ${p.xy?.[1] ?? 1} offert` };
    case "cashback": return { price: null, old: null, badge: `${p.val} % cagnottés` };
    case "free_with_condition": return { price: null, old: null, badge: "Offert" };
  }
  return { price: null, old: null, badge: "" };
}

const CATS = [

const catColor = (k) => CATS.find(c => c.k === k).c;
function catOf(p) {
  if (p.hidden || isOver(p) || p.status === "declined") return "del";

  if (p.status === "scheduled" || (p.status === "published" && p.start > Date.now())) return "soon";

  by.susp.sort((a, b) => a.end - b.end); by.del.sort((a, b) => b.end - a.end);

// Balayage entre catégories : défilement horizontal natif, une page par catégorie.
function bindPager() {
  const pg = $("#pager"); if (!pg) return;

const tkMsgs = (list) => list.map(m => `<div class="tmsg ${m.kind}"><small>${m.kind === "staff" ? "Équipe Vitriin" : "Vous"} · ${fmtDay(new Date(m.at).getTime())} ${new Date(m.at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</small>${esc(m.body)}</div>`).join("");
const tkWait = (t, list) => t.status !== "resolved" && list.length && list[list.length - 1].kind === "client" ? `<p class="small" style="margin-top:10px">Message bien reçu : l'équipe Vitriin vous répond ici sous 24 h (jours ouvrés). Cette page se met à jour toute seule.</p>` : "";
let tkPoll = null;
async function sheetTicket(id) {
  const { data, error } = await sb.rpc("support_thread", { p_id: id });
  if (error) return toast(errText(error));
  const t = data.ticket;
  sheet(`<div class="grab"></div><h2>${esc(t.subject)}</h2><p class="small" id="tk-stat" style="font-size:13.5px;margin-top:4px">${TK_ST[t.status] || ""}</p>

        ${editable ? "" : `<p class="hint" style="color:var(--muted);margin-top:14px">${p.hidden || isOver(p) ? "Cette promo n'est plus modifiable." : `Votre centrale ${esc(STORE.net)} ne permet pas de modifier ses promos.`}</p>`}
        <div class="${editable ? "" : "ro-box"}">
          <div class="fl">TITRE</div><input class="in" id="pf-title" maxlength="90" value="${esc(F.title)}" ${editable ? "" : "disabled"}>
          <div class="fl">TEXTE DU POST</div><textarea class="in" id="pf-text" rows="4" maxlength="1500" ${editable ? "" : "disabled"}>${esc(F.text)}</textarea>
          ${p.src === "own" ? `<div class="fl">PÉRIODE</div><div class="two"><input class="in" type="date" id="pf-start" value="${iso(F.start)}" ${editable ? "" : "disabled"}><input class="in" type="date" id="pf-end" value="${iso(F.end)}" ${editable ? "" : "disabled"}></div>` : ""}
          ${fixed.length ? `<div class="fl">${p.src === "net" ? "FIXÉ PAR LA CENTRALE" : "OFFRE"}</div><div class="ro-line">${fixed.map(esc).join(" · ")}</div>` : ""}
          ${p.src === "own" && p.kind !== "post" && editable ? `<button class="txt-btn" data-fx="offer" style="color:var(--p);font-weight:700;text-align:left;padding-left:0">Modifier l'offre, le type ou les codes</button>` : ""}
        </div>
      </div>
      <div class="actions"><div class="acts">
        ${canSuspend(p) ? `<button class="b-ghost" data-fx="susp" style="color:var(--blue)">Suspendre</button>` : canDelete(p) ? `<button class="b-ghost" data-fx="del" style="color:var(--red)">Supprimer</button>` : ""}
        <button class="b-grad" data-fx="ok">${p.status === "received" && !p.hidden && !isOver(p) ? "Valider la promo" : "Valider"}</button></div>
        ${p.suspended && !isOver(p) ? `<div class="links"><button data-fx="resume" style="color:var(--teal)">Reprendre la promo</button></div>` : ""}
      </div></div>`;
    document.body.style.overflow = "hidden";
    const v = (id) => $("#" + id, layer);
    v("pf-title").oninput = (e) => F.title = e.target.value;
    v("pf-text").oninput = (e) => F.text = e.target.value;
    v("pf-start") && (v("pf-start").onchange = (e) => F.start = new Date(e.target.value + "T00:00"));
    v("pf-end") && (v("pf-end").onchange = (e) => F.end = new Date(e.target.value + "T00:00"));
    $$("[data-fx]", layer).forEach(b => b.onclick = () => fx[b.dataset.fx]?.());
  };
  // Photo : on touche l'image → le sélecteur natif du téléphone (appareil photo
  // ou photothèque) s'ouvre directement. La médiathèque de la centrale a son bouton.
  const setImg = (src) => { F.img = src; draw(); };
  const photoMenu = () => pickMedia("file", setImg);
  const save = async () => {
    const btn = $('[data-fx="ok"]', layer); btn.disabled = true;
    try {
      if (editable) {
        const img = await ensureUploaded(F.img);
        if (p.src === "own") {
          const start = new Date(F.start); start.setHours(0, 0, 0, 0); const end = new Date(F.end); end.setHours(23, 59, 0, 0);
          if (!F.title.trim()) throw new Error("Donnez un titre à la promo.");
          if (end <= start) throw new Error("La fin doit suivre le début.");
          const ch = {};
          if (F.title.trim() !== p.title) ch.title = F.title.trim();
          if ((F.text || "") !== (p.text || "")) ch.description = F.text.trim() || null;
          if (img !== p.img) ch.media_url = img;
          if (start.getTime() !== new Date(p.start).setHours(0, 0, 0, 0)) ch.starts_at = start.toISOString();
          if (end.getTime() !== new Date(p.end).setHours(23, 59, 0, 0)) ch.ends_at = end.toISOString();
          if (Object.keys(ch).length) { const { error } = await sb.from("promotions").update(ch).eq("id", p.promoId); if (error) throw error; }
        } else {
          const ov = {};
          if (F.title.trim() && F.title.trim() !== p.base.title) ov.title = F.title.trim();
          if ((F.text || "").trim() !== (p.base.text || "").trim()) ov.text = (F.text || "").trim();
          if (img && img !== p.base.img) ov.media_url = img;
          if (JSON.stringify(ov) !== JSON.stringify(p.ov || {})) { const { error } = await sb.from("store_promotions").update({ overrides: ov }).eq("id", p.spId); if (error) throw error; }
        }
      }
      // « Valider » sur une promo reçue : elle est aussi acceptée.
      if (p.status === "received" && !p.hidden && !isOver(p)) { const { error } = await sb.from("store_promotions").update({ status: "active" }).eq("id", p.spId); if (error) throw error; }
      closeLayer(); await loadData(); render(true); toast("Enregistré.");
    } catch (e) { toast(errText(e)); btn.disabled = false; }
  };
  const fx = {
    close: closeLayer, photo: photoMenu, lib: () => pickMedia("lib", setImg), ok: save, clients: () => { closeLayer(); clients(p.id); },
    susp: () => askSuspend(p), del: () => askDelete(p), resume: () => askResume(p),
    offer: () => { closeLayer(); createForm(p.kind, p); },
  };
  draw();
}

/* ===================== Actions ===================== */
async function setStatus(p, status, msg) {
  const { error } = await sb.from("store_promotions").update({ status }).eq("id", p.spId);
  if (error) return toast(errText(error));
  p.status = status; render(true); toast(msg(p)); refresh();
}
function reconnect() {
  sheet(`<div class="pub"><div class="spin"></div><h2>Connexion à Instagram…</h2><p class="small" style="font-size:14px">Via votre Page Facebook ${esc(STORE.page)}</p></div>`);
  const failed = S.promos.filter(p => p.ch?.ig === "ko");
  Promise.all([sb.rpc("demo_reconnect", { p_store_id: STORE.id, p_channel: "instagram" }), new Promise(r => setTimeout(r, 1300))]).then(async ([{ error }]) => {
    if (error) { closeLayer(); return toast(errText(error)); }
    await loadData(); closeLayer(); render(true);
    toast(failed.length ? `Instagram reconnecté · « ${failed[0].title} » republiée` : "Instagram reconnecté");
  });
}
function publish(p, retryOnly) {
  const chans = p._chans || (retryOnly ? ["ig"] : ["fb", "ig"].filter(c => (c === "fb" ? S.fb : S.ig) === "ok"));
  if (!chans.length) return toast("Connectez d'abord Facebook ou Instagram dans les Réglages.");
  sheet(`<div class="pub" id="pubbox"><div class="spin"></div><h2>Publication en cours…</h2><p class="small" style="font-size:14px">« ${esc(p.title)} » sur ${chans.includes("fb") ? "votre Page Facebook" : ""}${chans.length > 1 ? " et " : ""}${chans.includes("ig") ? "votre compte Instagram" : ""}</p>
    <div class="lines">${chans.map(c => `<div><span class="ch ${c === "fb" ? "fb" : "ig"}">${c === "fb" ? I.fbs : I.igs}</span>${c === "fb" ? "Facebook" : "Instagram"}<em id="pl-${c}" style="color:var(--muted)">En cours…</em></div>`).join("")}</div></div>`);
  // Publication simulée côté base (réseau de démo) : la centrale la voit aussitôt.
  const call = Promise.resolve(sb.rpc("demo_publish", { p_store_promotion_id: p.spId, p_channels: chans.map(c => c === "fb" ? "facebook" : "instagram") }));
  let i = 0;
  const step = async () => {
    const c = chans[i];
    if (!c) {
      const { error } = await call;
      if (error) { closeLayer(); return toast(errText(error)); }
      delete p._chans;
      try { await loadData(); } catch {}
      $("#pubbox").innerHTML = `<div class="done">${I.check.replace('width="16" height="16"', 'width="30" height="30"')}</div><h2>C'est publié !</h2><p class="small" style="font-size:14px">Vos clients voient « ${esc(p.title)} » dès maintenant.</p>
        <div class="lines">${chans.map(x => `<div><span class="ch ${x === "fb" ? "fb" : "ig"}">${x === "fb" ? I.fbs : I.igs}</span>${x === "fb" ? "Facebook" : "Instagram"}<em style="color:var(--teal)">Publiée ✓</em></div>`).join("")}</div>
        ${S.ig !== "ok" ? '<p class="small" style="font-size:13.5px;margin-top:10px">Instagram est déconnecté : reconnectez-le pour y publier aussi.</p>' : ""}
        <p class="small" style="font-size:12.5px;margin-top:10px;color:var(--muted)">Démo : publication simulée, rien n'est posté sur Facebook ni Instagram.</p>
        <button class="big-btn" id="pub-ok">Parfait</button>`;
      $("#pub-ok").onclick = () => { closeLayer(); UI.tab = "home"; render(); };
      return;
    }
    setTimeout(() => { const el = $("#pl-" + c); if (el) { el.textContent = "Publiée ✓"; el.style.color = "var(--teal)"; } i++; step(); }, c === "ig" ? 1300 : 900);
  };
  step();
}
function sheetSchedule(p) {
  const last = p.deadline ? new Date(p.deadline.getTime ? p.deadline.getTime() - DAY : new Date(p.deadline).getTime() - DAY) : d(14);
  const days = []; for (let k = 0; k < 9; k++) days.push(d(k));
  let sel = 1, time = "09:00";
  const draw = () => {
    sheet(`<div class="grab"></div><h2>Programmer la publication</h2><p class="small" style="font-size:14px;margin-top:4px">« ${esc(p.title)} »${p.deadline ? ` · à publier avant le ${fmtLong(p.deadline)}` : ""}</p>
      <div class="fl">DATE</div><div class="days">${days.map((x, k) => `<button class="day ${k === sel ? "on" : ""}" data-k="${k}" ${x > last ? "disabled" : ""}><small>${k === 0 ? "Auj." : x.toLocaleDateString("fr-FR", { weekday: "short" })}</small><b>${x.getDate()}</b><span>${x.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "")}</span></button>`).join("")}</div>
      ${p.deadline ? `<div class="hint">Dernier jour possible : ${fmtDay(last)} (échéance de la centrale : ${fmtLong(p.deadline)})</div>` : ""}
      <div class="fl">HEURE</div><input class="in" type="time" id="s-time" value="${time}">
      <div class="recap">Publication le <b>${fmtDay(days[sel])} à <span id="s-t">${time}</span></b> sur Facebook${S.ig === "ok" ? " et Instagram" : ""}.</div>
      <button class="big-btn" id="s-go">Programmer</button><button class="txt-btn" data-close>Annuler</button>`);
    $$(".day").forEach(b => b.onclick = () => { sel = +b.dataset.k; time = $("#s-time").value || time; draw(); });
    $("#s-time").oninput = (e) => { time = e.target.value; $("#s-t").textContent = time; };
    $("#s-go").onclick = async () => {
      const [hh, mm] = (time || "09:00").split(":").map(Number);
      const at = new Date(days[sel]); at.setHours(hh, mm, 0, 0);
      if (at <= new Date()) return toast("Choisissez une heure à venir.");
      const chans = ["fb", "ig"].filter(c => (c === "fb" ? S.fb : S.ig) === "ok").map(c => c === "fb" ? "facebook" : "instagram");
      $("#s-go").disabled = true;
      const { error } = await sb.rpc("demo_publish", { p_store_promotion_id: p.spId, p_channels: chans, p_at: at.toISOString() });
      if (error) { $("#s-go").disabled = false; return toast(errText(error)); }
      await loadData(); closeLayer(); render(true); toast(`Programmée le ${fmtDay(days[sel])} à ${time}.`);
    };
  };
  draw();
}
function sheetChoose() {

    <button class="choice" id="c-promo"><span class="ic" style="background:var(--rose);color:var(--p)">${I.tag}</span><span class="sp"><b>Une promo</b><span>Prix, remise et période de validité</span></span></button>

/* ===================== Création ===================== */
function createForm(kind, draft) {
  const F = draft ? { kind: "promo", xy: [2, 1], cond: "", text: "", ...draft, codes: draft.code ? [draft.code] : [], fb: true, ig: S.ig === "ok" } :
    { kind, title: "", img: null, type: "percent", orig: 129, val: 30, xy: [2, 1], cond: "", text: "", start: d(0), end: d(13), codes: [], fb: true, ig: S.ig === "ok" };
  const layer = $("#layer");
  // Promo déjà publiée ou programmée : on enregistre sans republier.
  const editLive = !!draft && draft.status !== "draft";
  const draw = () => {
    const isPost = F.kind === "post";
    const missing = [!F.img && "photo", !isPost && !F.title.trim() && "titre", isPost && !F.text.trim() && "texte", !F.fb && !F.ig && "canal"].filter(Boolean);
    const pr = pricing(F);
    layer.innerHTML = `<div class="full">
      <div class="bar"><button class="x" data-close aria-label="Fermer">${I.x}</button><b>${draft ? (isPost ? "Modifier le post" : "Modifier la promo") : isPost ? "Nouveau post" : "Nouvelle promo"}</b></div>
      <div class="scroll">
        <span class="label">Photo ou vidéo <span class="req">*</span></span>
        ${F.img ? `<div class="preview-img"><img onerror="this.style.visibility='hidden'" src="${esc(F.img)}" alt=""><button id="f-rm">Changer</button></div>` :
        `<div class="media"><button data-src="cam"><span style="color:var(--p)">${I.cam}</span>Photo</button><button data-src="file"><span style="color:var(--p)">${I.vid}</span>Vidéo</button><button data-src="file"><span style="color:var(--p)">${I.img}</span>Galerie</button><button class="net" data-src="lib"><span style="color:var(--v)">${I.net}</span>Médiathèque de la centrale</button></div>`}
        ${isPost ? `<span class="label">Texte <span class="req">*</span></span><textarea class="in" id="f-text" rows="5" placeholder="Ex : Nouvelle collection trail en magasin, venez l'essayer !">${esc(F.text)}</textarea>` : `
        <span class="label">Titre <span class="req">*</span></span><input class="in" id="f-title" placeholder="Ex : Air Runner 95" value="${esc(F.title)}" maxlength="60">
        <span class="label">Type de promo</span>
        <div class="types">${TYPES.map(t => `<button class="${F.type === t.k ? "on" : ""}" data-type="${t.k}">${t.i}${t.l}</button>`).join("")}</div>
        <div style="margin-top:14px">${typeFields(F)}</div>
        ${pr.price != null ? `<div class="calc"><span class="badge" style="font-size:15px;padding:3px 9px">${esc(pr.badge)}</span><span class="num">${eur(pr.price)}</span>${pr.old ? `<s>${eur(pr.old)}</s>` : ""}</div>` : ""}
        <span class="label">Période de validité</span>
        <div class="two"><div class="date">${I.cal("#0c9875")}<input type="date" id="f-start" value="${iso(F.start)}"></div><div class="date">${I.cal("#e5087e")}<input type="date" id="f-end" value="${iso(F.end)}"></div></div>
        <div class="row" style="align-items:flex-start;margin-top:20px"><b style="font-size:15px" class="sp">Code de réduction en caisse</b><span style="font-size:12.5px;color:var(--muted);text-align:right">Facultatif · plusieurs<br>codes possibles</span></div>
        <p class="small" style="margin:6px 0 10px">Le client présente ce code en caisse : la caisse le scanne et applique la remise.</p>
        <button class="gen" id="f-gen">${I.bar}Générer un code de réduction</button>
        <div class="codes">${F.codes.map((c, k) => `<div class="codechip">${I.bar}${esc(c)}<button data-rmcode="${k}" aria-label="Retirer">×</button></div>`).join("")}</div>
        ${F.codes.length ? '<p class="small" style="color:#8a6a3a">À déclarer dans votre logiciel de caisse avant le début de la promo.</p>' : ""}
        <div class="addrow"><input class="in" id="f-code" placeholder="Ou saisir un code de réduction existant"><button id="f-add">Ajouter</button></div>`}
        <span class="label">Canaux <span class="req">*</span></span>
        <button class="chk ${F.fb ? "on" : ""}" data-chan="fb"><span class="bx">${F.fb ? `<span style="color:#fff">${I.check}</span>` : ""}</span><span class="ch fb" style="width:34px;height:34px">${I.fbs}</span><span class="sp"><b>Facebook</b><span>Page ${esc(STORE.page)}</span></span></button>
        <button class="chk ${F.ig ? "on" : ""}" data-chan="ig" ${S.ig !== "ok" ? 'style="background:#faf9f7"' : ""}><span class="bx">${F.ig ? `<span style="color:#fff">${I.check}</span>` : ""}</span><span class="ch ig" style="width:34px;height:34px">${I.igs}</span><span class="sp"><b>Instagram</b><span style="${S.ig !== "ok" ? "color:var(--red)" : ""}">${S.ig === "ok" ? esc(STORE.insta) : "À reconnecter"}</span></span>${S.ig !== "ok" ? '<span class="blue" id="f-reco">Reconnecter</span>' : ""}</button>
        <p class="small" style="margin-top:10px">Google, TikTok et WhatsApp arrivent bientôt.</p>
      </div>
      <div class="actions">
        ${missing.length ? `<div class="todo">À compléter : ${missing.join(" · ")}</div>` : ""}
        <button class="big-btn" id="f-pub" ${missing.length ? "disabled" : ""} style="margin-top:8px">${editLive ? "Enregistrer les modifications" : `${I.send}Publier`}</button>
        ${isPost || editLive ? "" : '<button class="txt-btn" id="f-draft" style="border:1.5px solid var(--line);border-radius:16px;color:var(--ink);font-weight:700">Enregistrer en brouillon</button>'}
      </div></div>`;
    bindForm();
  };
  const num = (v) => { const n = parseFloat(String(v).replace(",", ".").replace(/[^\d.]/g, "")); return isNaN(n) ? null : n; };
  const bindForm = () => {
    $$("[data-close]", layer).forEach(b => b.onclick = closeLayer);
    $$("[data-src]", layer).forEach(b => b.onclick = () => pickMedia(b.dataset.src, (src) => { F.img = src; draw(); }));
    $("#f-rm", layer) && ($("#f-rm").onclick = () => { F.img = null; draw(); });
    $("#f-title", layer) && ($("#f-title").oninput = (e) => { F.title = e.target.value; refreshFoot(); });
    $("#f-text", layer) && ($("#f-text").oninput = (e) => { F.text = e.target.value; refreshFoot(); });
    $$("[data-type]", layer).forEach(b => b.onclick = () => { F.type = b.dataset.type; const def = { percent: [129, 30], amount: [90, 20], new_price: [129, 99], x_plus_y: [44.7, 29.8], cashback: [null, 10], free_with_condition: [null, 0] }[F.type]; [F.orig, F.val] = def; keepScroll(draw); });
    $$("[data-f]", layer).forEach(inp => inp.oninput = () => { const k = inp.dataset.f; if (k === "cond") F.cond = inp.value; else if (k === "x") F.xy[0] = num(inp.value) || 0; else if (k === "y") F.xy[1] = num(inp.value) || 0; else F[k] = num(inp.value); updCalc(); });
    $("#f-start", layer) && ($("#f-start").onchange = (e) => { F.start = new Date(e.target.value + "T00:00"); });
    $("#f-end", layer) && ($("#f-end").onchange = (e) => { F.end = new Date(e.target.value + "T00:00"); });
    $("#f-gen", layer) && ($("#f-gen").onclick = () => { F.codes.push("9 901230 " + String(Math.floor(Math.random() * 1e6)).padStart(6, "0")); keepScroll(draw); });
    $("#f-add", layer) && ($("#f-add").onclick = () => { const v = $("#f-code").value.trim().toUpperCase(); if (v.length < 3) return toast("Saisissez un code d'au moins 3 caractères."); F.codes.push(v); keepScroll(draw); });
    $$("[data-rmcode]", layer).forEach(b => b.onclick = (e) => { e.stopPropagation(); F.codes.splice(+b.dataset.rmcode, 1); keepScroll(draw); });
    $$("[data-chan]", layer).forEach(b => b.onclick = (e) => {
      if (e.target.id === "f-reco") { sb.rpc("demo_reconnect", { p_store_id: STORE.id, p_channel: "instagram" }).then(({ error }) => { if (error) return toast(errText(error)); S.ig = "ok"; F.ig = true; toast("Instagram reconnecté"); keepScroll(draw); }); return; }
      const c = b.dataset.chan; if (c === "ig" && S.ig !== "ok") return toast("Reconnectez d'abord Instagram.");
      F[c] = !F[c]; keepScroll(draw);
    });
    $("#f-pub").onclick = () => submit(false);
    $("#f-draft", layer) && ($("#f-draft").onclick = () => submit(true));
  };
  const refreshFoot = () => { const isPost = F.kind === "post"; const missing = [!F.img && "photo", !isPost && !F.title.trim() && "titre", isPost && !F.text.trim() && "texte", !F.fb && !F.ig && "canal"].filter(Boolean); const todo = $(".todo", layer); if (missing.length) { if (todo) todo.textContent = "À compléter : " + missing.join(" · "); else $(".actions", layer).insertAdjacentHTML("afterbegin", `<div class="todo">À compléter : ${missing.join(" · ")}</div>`); } else todo?.remove(); $("#f-pub").disabled = !!missing.length; };
  const updCalc = () => { const pr = pricing(F); const c = $(".calc", layer); if (c && pr.price != null) c.innerHTML = `<span class="badge" style="font-size:15px;padding:3px 9px">${esc(pr.badge)}</span><span class="num">${eur(pr.price)}</span>${pr.old ? `<s>${eur(pr.old)}</s>` : ""}`; };
  const keepScroll = (fn) => { const sc = $(".scroll", layer)?.scrollTop || 0; fn(); const s2 = $(".scroll", layer); if (s2) s2.scrollTop = sc; };
  const submit = async (asDraft) => {
    const isPost = F.kind === "post";
    const btn = $("#f-pub", layer); if (btn) btn.disabled = true;
    try {
      const media = await ensureUploaded(F.img);
      const pr = pricing({ ...F, mech: null });
      const sub = F.type === "free_with_condition" ? F.cond : F.type === "x_plus_y" ? `Les ${(F.xy[0] || 0) + (F.xy[1] || 0)} pour ${eur(F.val || 0)}` : "";
      const code = (F.codes[0] || "").replace(/\s+/g, "").toUpperCase();
      const title = isPost ? (F.text.trim().split(/\n/)[0].slice(0, 40) || "Post") : F.title.trim() || "Sans titre";
      const start = new Date(F.start); start.setHours(0, 0, 0, 0);
      const end = new Date(F.end); end.setHours(23, 59, 0, 0);
      const row = {
        created_by_store_id: STORE.id, title, media_url: media,
        mechanic: isPost ? null : (F.type === "free_with_condition" ? (F.cond || "Offert") : pr.price != null ? `${eur(pr.price)}${pr.old ? " au lieu de " + eur(pr.old) : ""}` : pr.badge),
        description: isPost ? F.text.trim() : [sub, code ? `Code en caisse : ${code}` : ""].filter(Boolean).join("\n\n") || null,
        promo_type: isPost ? null : F.type, discount_code: code && /^[A-Z0-9-]{3,24}$/.test(code) ? code : null,
        details: isPost ? null : { orig: F.orig, val: F.val, xy: F.xy, sub },
        starts_at: start.toISOString(), ends_at: end.toISOString(), status: asDraft ? "draft" : "active",
      };
      let spId = draft?.spId;
      if (draft) {
        const { created_by_store_id, ...changes } = row; // le magasin auteur ne change pas
        const { error } = await sb.from("promotions").update(changes).eq("id", draft.promoId);
        if (error) throw error;
      } else {
        const { data: pz, error } = await sb.from("promotions").insert(row).select("id").single();
        if (error) throw error;
        const { data: sp, error: e2 } = await sb.from("store_promotions").insert({ promotion_id: pz.id, store_id: STORE.id }).select("id").single();
        if (e2) throw e2;
        spId = sp.id;
      }
      closeLayer();
      if (editLive) { await loadData(); render(true); return toast("Modifications enregistrées."); }
      if (asDraft) { await loadData(); UI.tab = "promos"; UI.cat = "todo"; render(); return toast("Brouillon enregistré."); }
      publish({ spId, title, _chans: ["fb", "ig"].filter(c => F[c]) });
    } catch (e) { toast(errText(e)); if (btn) btn.disabled = false; }
  };
  document.body.style.overflow = "hidden";
  draw();
}
// Photo prise ou choisie sur le téléphone : convertie en JPEG au format
// Instagram, puis déposée dans le dossier du magasin (bucket promo-media).
async function ensureUploaded(src) {
  if (!src || !src.startsWith("data:")) return src;
  const blob = await (await fetch(src)).blob();
  const bmp = await createImageBitmap(blob, { imageOrientation: "from-image" });
  let sw = bmp.width, sh = bmp.height, sx = 0, sy = 0; const ratio = sw / sh;
  if (ratio < 0.8) { const h = Math.round(sw / 0.8); sy = Math.round((sh - h) / 2); sh = h; }
  else if (ratio > 1.91) { const w = Math.round(sh * 1.91); sx = Math.round((sw - w) / 2); sw = w; }
  const k = Math.min(1, 1440 / Math.max(sw, sh));
  const cv = document.createElement("canvas"); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  const jpeg = await new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(new Error("Conversion impossible.")), "image/jpeg", 0.9));
  const path = `${STORE.id}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from("promo-media").upload(path, jpeg, { contentType: "image/jpeg", upsert: false });
  if (error) throw error;
  return sb.storage.from("promo-media").getPublicUrl(path).data.publicUrl;
}
function typeFields(F) {
  const v = (n) => n == null ? "" : String(n).replace(".", ",");
  const e2 = (n) => n == null ? "" : n.toFixed(2).replace(".", ",");
  switch (F.type) {
    case "percent": return `<div class="two"><div><label>Prix original (€)</label><input class="in" inputmode="decimal" data-f="orig" value="${e2(F.orig)}"></div><div><label class="pk">Remise (%)</label><input class="in pk" inputmode="decimal" data-f="val" value="${v(F.val)}"></div></div>`;
    case "amount": return `<div class="two"><div><label>Prix original (€)</label><input class="in" inputmode="decimal" data-f="orig" value="${e2(F.orig)}"></div><div><label class="pk">Remise (€)</label><input class="in pk" inputmode="decimal" data-f="val" value="${e2(F.val)}"></div></div>`;
    case "new_price": return `<div class="two"><div><label>Prix original (€)</label><input class="in" inputmode="decimal" data-f="orig" value="${e2(F.orig)}"></div><div><label class="pk">Nouveau prix (€)</label><input class="in pk" inputmode="decimal" data-f="val" value="${e2(F.val)}"></div></div>`;
    case "x_plus_y": return `<div class="two"><div><label>Achetés</label><input class="in" inputmode="numeric" data-f="x" value="${F.xy[0]}"></div><div><label class="pk">Offerts</label><input class="in pk" inputmode="numeric" data-f="y" value="${F.xy[1]}"></div></div><div class="two" style="margin-top:10px"><div><label>Prix normal du lot (€)</label><input class="in" inputmode="decimal" data-f="orig" value="${e2(F.orig)}"></div><div><label class="pk">Prix payé (€)</label><input class="in pk" inputmode="decimal" data-f="val" value="${e2(F.val)}"></div></div>`;
    case "cashback": return `<div><label class="pk" style="display:block;font-size:13px;margin-bottom:6px">% crédité sur la carte fidélité</label><input class="in pk" inputmode="decimal" data-f="val" value="${v(F.val)}"></div>`;
    case "free_with_condition": return `<div><label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">Condition</label><input class="in" data-f="cond" placeholder="Ex : chaussettes offertes dès 80 € d'achat" value="${esc(F.cond || "")}"></div>`;
  }
  return "";
}
const iso = (t) => { const x = new Date(t); return new Date(x.getTime() - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function pickMedia(src, done) {
  if (src === "lib") {
    // Les visuels des promos envoyées par la centrale, les plus récents d'abord, sans doublon.
    const items = [...new Set([...S.promos, ...(S.trash || [])].sort((x, y) => y.start - x.start).flatMap(p => p.netMedia || []).filter(u => /^https:\/\//.test(u)))].slice(0, 60);
    sheet(`<div class="grab"></div><h2>Médiathèque de la centrale</h2><p class="small" style="font-size:14px;margin-top:4px">Visuels partagés par ${esc(STORE.net)}, prêts à l'emploi.</p>
      ${items.length ? "" : `<div class="empty" style="margin-top:14px">Votre centrale n'a pas encore partagé de visuel.</div>`}
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">${items.map((s, k) => `<button data-lib="${k}" style="aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg)"><img onerror="this.style.visibility='hidden'" src="${esc(s)}" alt="" style="width:100%;height:100%;object-fit:cover"></button>`).join("")}</div>
      <button class="txt-btn" data-close>Annuler</button>`, true);
    $$("[data-lib]").forEach(b => b.onclick = () => { const s = items[+b.dataset.lib]; closeSheetOnly(); done(s); });
    return;
  }
  const input = src === "cam" ? $("#cam") : $("#file");
  input.onchange = () => { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(f); input.value = ""; };
  input.click();
}

/* ===================== Vue client ===================== */
function clients(startId) {
  const list = S.promos.filter(p => p.status === "published" && p.img && p.kind !== "post");
  if (!list.length) return toast("Publiez une promo pour la voir côté clients.");
  const idx = Math.max(0, list.findIndex(p => p.id === startId));
  const layer = $("#layer");
  layer.innerHTML = `<div class="reels" id="reels">${list.map((p, k) => { const pr = pricing(p); return `<section class="reel">
    <img onerror="this.style.visibility='hidden'" src="${esc(p.img)}" alt=""><div class="shade"></div>
    <div class="prog">${list.map((_, j) => `<i class="${j <= k ? "on" : ""}"></i>`).join("")}</div>
    <div class="rh"><button class="rav" data-close aria-label="Revenir à l'espace magasin">${avatar()}</button><div><b>${esc(STORE.name)}</b><span>${esc(STORE.city)} · À 1,2 km</span></div><span class="open glass">${I.clock.replace('width="20" height="20"', 'width="13" height="13"')}Ouvert</span></div>
    <div class="side"><button data-fav="${p.id}"><i class="glass">${I.heart(p.liked)}</i><span id="fav-${p.id}">${(p.fav || 0) + (p.liked ? 1 : 0)}</span></button><button data-tip="Itinéraire vers ${esc(STORE.address)}"><i class="glass">${I.pin}</i>Itinéraire</button><button data-tip="Lien de la promo copié"><i class="glass">${I.share}</i>Partager</button><button data-savep="${p.id}"><i class="glass">${I.save(p.saved)}</i>${p.saved ? "Enregistré" : "Enregistrer"}</button></div>
    <div class="info"><small>${esc(STORE.name)} · Jusqu'au ${fmtShort(p.end)}</small><h3>${esc(p.title)}</h3><p>${esc(p.sub || `Valable du ${fmtShort(p.start)} au ${fmtShort(p.end)}`)}</p>
      <div class="pr">${pr.price != null ? `<b>${eur(pr.price)}</b>${pr.old ? `<s>${eur(pr.old)}</s>` : ""}` : ""}<em>${esc(pr.badge)}</em></div></div>
    <button class="cta" data-code="${p.id}">${I.bar.replace('width="14" height="14"', 'width="20" height="20"')}J'en profite</button>
  </section>`; }).join("")}</div>`;
  const r = $("#reels"); r.scrollTop = idx * window.innerHeight;
  document.body.style.overflow = "hidden";
  $$("[data-close]", layer).forEach(b => b.onclick = closeLayer);
  $$("[data-tip]", layer).forEach(b => b.onclick = () => toast(b.dataset.tip));
  $$("[data-fav]", layer).forEach(b => b.onclick = () => { const p = find(b.dataset.fav); p.liked = !p.liked; save(); b.querySelector("i").innerHTML = I.heart(p.liked); $("#fav-" + p.id).textContent = (p.fav || 0) + (p.liked ? 1 : 0); });
  $$("[data-savep]", layer).forEach(b => b.onclick = () => { const p = find(b.dataset.savep); p.saved = !p.saved; save(); b.innerHTML = `<i class="glass">${I.save(p.saved)}</i>${p.saved ? "Enregistré" : "Enregistrer"}`; });
  $$("[data-code]", layer).forEach(b => b.onclick = () => codeBox(find(b.dataset.code)));
}
function barcode(code) {
  const digits = (code || "9901230000017").replace(/\D/g, "").padEnd(13, "0");
  let bars = ""; const add = (w, on) => bars += `<span style="width:${w * 2.2}px;background:${on ? "#16130f" : "transparent"}"></span>`;
  add(1, 1); add(1, 0); add(1, 1);
  for (const ch of digits) { const n = +ch; add((n % 3) + 1, 1); add(((n + 1) % 3) + 1, 0); add(((n + 2) % 2) + 1, 1); add((n % 2) + 1, 0); }
  add(1, 1); add(1, 0); add(1, 1);
  return bars;
}
// Identifiant anonyme de l'appareil : un client compte une fois par promo et par jour.
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join(""));
function clientId() {
  try { let id = localStorage.getItem("vitriin-client"); if (!id) { id = newId(); localStorage.setItem("vitriin-client", id); } return id; }
  catch { return newId(); }
}
// Code révélé : on demande la position (une fois, le client peut refuser) pour
// rattacher l'utilisation au magasin le plus proche. La position n'est pas
// conservée : le serveur ne garde que le magasin trouvé.
const herePos = () => new Promise((ok) => {
  if (!navigator.geolocation) return ok(null);
  navigator.geolocation.getCurrentPosition((x) => ok(x.coords), () => ok(null), { enableHighAccuracy: false, timeout: 6000, maximumAge: 600000 });
});
async function countReveal(p) {
  try {
    const c = await herePos();
    await sb.rpc("record_code_reveal_at", { p_store_promotion_id: p.spId, p_client_id: clientId(), p_lat: c ? c.latitude : null, p_lng: c ? c.longitude : null });
    await loadData();
  } catch {}
}
function codeBox(p) {
  const el = document.createElement("div"); el.className = "codebox";
  const draw = (shown) => {
    el.innerHTML = `<div class="in2"><small>${esc(p.title.toUpperCase())}</small><h3>Code de réduction</h3>
      <div style="position:relative"><div class="bars ${shown ? "" : "mask"}">${barcode(p.code)}</div>${shown ? "" : `<div class="lock"><i>${I.lock}</i><span>Code masqué</span></div>`}</div>
      <div class="digits ${shown ? "" : "mask-d"}">${esc(p.code || "9 901230 000017")}</div>
      ${shown ? `<div class="used">${I.check}Promotion activée · présentez ce code en caisse</div><button class="dark-btn" id="cb-x">Terminé</button>` :
      `<p class="small" style="font-size:14px;margin:14px 0 0;line-height:1.45">Révélez le code pour le scanner en caisse : on compte ainsi chaque promo réellement utilisée.</p><button class="big-btn" id="cb-go">${I.eye}Utiliser cette promotion</button>`}</div>`;
    $("#cb-go", el) && ($("#cb-go", el).onclick = () => { draw(true); countReveal(p); });
    $("#cb-x", el) && ($("#cb-x", el).onclick = () => el.remove());
  };
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  draw(false); document.body.appendChild(el);
}

/* ===================== Couches ===================== */
function sheet(html, keepUnder) {
  const layer = $("#layer");
  if (keepUnder && layer.querySelector(".full")) {
    const ov = document.createElement("div"); ov.className = "ov"; ov.id = "subsheet"; ov.innerHTML = `<div class="sheet">${html}</div>`;
    ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
    document.body.appendChild(ov);
    $$("[data-close]", ov).forEach(b => b.onclick = () => ov.remove());
    return;
  }
  layer.innerHTML = `<div class="ov"><div class="sheet">${html}</div></div>`;
  const ov = $(".ov", layer);
  ov.onclick = (e) => { if (e.target === ov && !$(".spin", ov)) closeLayer(); };
  $$("[data-close]", layer).forEach(b => b.onclick = closeLayer);
  document.body.style.overflow = "hidden";
}
function closeSheetOnly() { $("#subsheet")?.remove(); }
function closeLayer() { $("#layer").innerHTML = ""; $("#subsheet")?.remove(); document.body.style.overflow = ""; }

$("#nav").classList.add("hidden"); $("#fab").classList.add("hidden");
boot();
