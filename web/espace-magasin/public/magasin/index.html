<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vitriin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vitriin">
<link rel="manifest" href="/magasin/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Racing+Sans+One&display=swap" rel="stylesheet">
<style>
/* Vitriin App · espace magasin. Écrans de MOD-077/081, charte de la Centrale (MOD-085) : blanc, tuiles #F6F5F3 sans bordure,
   titres en graisse 500, bouton principal en pastille encre, magenta réservé à l'accent, menu du bas en pastille. */
:root{
  --p:#e5087e; --v:#951b81; --grad:linear-gradient(100deg,#e5087e 0%,#951b81 100%);
  --ink:#2D2D2D; --ink2:#55514C; --muted:#6F6A63; --faint:#6F6A63; --line:#ECE8E2; --line2:#D8D4CE; --chip:#EBE8E3; --bg:#F6F5F3; --surf:#F6F5F3; --cream:#F5ECD3; --pink:#FBE6F1;
  --rose:#FDF1F7; --rose2:#FBE6F1; --mint:#DDF1EA; --teal:#08705A; --teal2:#0c9875; --tealt:#08705A;
  --sand:#faf6ee; --sandline:#ecdcc0; --red:#B3261E; --redf:#D0342C; --blue:#2f6fdb; --redbg:#FBE9E7; --lilac:#f7eef6;
  --fb:#0866FF; --ig:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --nav:72px; --dock:calc(72px + 18px + var(--sab));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,textarea{font-family:inherit;color:var(--ink)}
img{display:block}
.hidden{display:none!important}
b,strong,h1,h2,h3,h4,th,summary{font-weight:600}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:'Racing Sans One','DM Sans',sans-serif;font-weight:400;letter-spacing:.01em}
@media (min-width:560px){
  body{background:#e9e6e1}
  #app{max-width:430px;margin:0 auto;background:#fff;min-height:100dvh;box-shadow:0 0 40px rgba(0,0,0,.08);position:relative}
}
#app{position:relative;min-height:100dvh;overflow-x:hidden}
.screen{padding:calc(var(--sat) + 22px) 20px calc(var(--dock) + 28px)}
h1.title{font-size:34px;font-weight:500;letter-spacing:-.035em;margin:0;line-height:1.08}
.t-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rb{width:44px;height:44px;border-radius:50%;background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.rb svg{width:20px;height:20px}
.sub{font-size:15px;color:var(--muted);margin-top:4px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.chev{flex:none;opacity:.8}

/* ---- Header ---- */
.head{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px;flex:none;overflow:hidden}
.av img,.rav img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.head{gap:12px;margin-bottom:0}
.head .sp span{display:block;font-size:14px;color:var(--muted)}
.head .sp b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.logo-sw{position:relative;border:none;padding:0;width:46px;height:46px;flex:none;background:none}
.logo-sw .eyeb{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--p);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.logo-sw .eyeb svg{width:13px;height:13px}
.sec .cnt{background:var(--chip);color:var(--ink);font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px}
.todo-box{display:flex;flex-direction:column;gap:10px}
.todo-row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:none;border-radius:22px;background:var(--surf);text-align:left}
.todo-row .chev{color:var(--muted)}.todo-row .chev svg{width:16px;height:16px}
.todo-row .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;color:var(--ink)}
.todo-row .ic svg{width:20px;height:20px}
.todo-row b{display:block;font-size:15px;line-height:1.3}
.todo-row .sp>span{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-row .sp{min-width:0}
.all-ok{display:flex;align-items:center;gap:10px;padding:16px 18px;color:var(--tealt);font-weight:600;font-size:15px;background:var(--mint);border-radius:22px}
.week{width:100%;margin-top:22px;display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:20px;padding:14px 16px;text-align:left}
/* Carte d'action noire « Valider la promo d'un client » */
.scan-card{width:100%;margin-top:20px;border-radius:28px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:18px 20px;text-align:left}
.scan-card .ti{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#E5087E,#951B81);display:flex;align-items:center;justify-content:center;flex:none}
.scan-card b{display:block;font-size:17px;font-weight:600}.scan-card .sp>span{display:block;font-size:14px;color:#D9D5CF;margin-top:2px}
.scan-card .chev{color:#fff}
.kpi3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi3>*{background:var(--surf);border-radius:22px;padding:16px 16px 14px;text-align:left;min-width:0}
.kpi3 b{display:block;font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi3 span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
/* Carrousel « En ce moment » : petites cartes */
.week b{display:block;font-size:15px}.week .sp>span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.btn-red{background:var(--redf);color:#fff;font-weight:600;font-size:13.5px;padding:10px 15px;border-radius:999px;white-space:nowrap;flex:none}

/* ---- Sections ---- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px}
.sec h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.02em}
.link{color:var(--ink);font-weight:600;font-size:14px;display:flex;align-items:center;gap:3px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px}
.carousel{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .slide{flex:none;width:84%;scroll-snap-align:start}
/* Cartes promo grand format (v2, MOD-081) : la photo d'abord, peu de texte, actions nettes */
.pc{margin-bottom:28px}
.pc .pim{position:relative;aspect-ratio:4/3;border-radius:28px;overflow:hidden;background:var(--surf)}
.pc .pim img{width:100%;height:100%;object-fit:cover;display:block}
.pc .pb,.hm .pb{position:absolute;left:14px;bottom:14px;background:var(--p);color:#fff;font-family:'Racing Sans One',sans-serif;font-size:30px;line-height:1;padding:8px 13px 7px;border-radius:15px;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .stp{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.95);color:var(--ink);font-size:14px;font-weight:600;padding:8px 13px;border-radius:999px;max-width:calc(100% - 110px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .stp::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none}
.pc .nets{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.pc .nets .ch{width:34px;height:34px;border-radius:50%;background:#fff!important}
.pc .nets .ch.ig{padding:6px}.pc .nets .ch.ig svg{border-radius:7px;background:var(--ig);padding:3px;width:100%;height:100%}
.pc .pt{padding:14px 4px 0}
.pc h3{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .d{font-size:15px;color:var(--muted);margin-top:4px}
.pc .btns{margin-top:14px}.pc .btns button{min-height:54px;font-size:16px;border-radius:999px}
.pc .b-ghost{background:var(--surf);border:none!important}
.hm{flex:none;width:78%;text-align:left;scroll-snap-align:start}
.hm .im{position:relative;aspect-ratio:4/3;border-radius:28px;overflow:hidden;background:var(--surf)}
.hm .im img{width:100%;height:100%;object-fit:cover;display:block}
.hm b{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm>span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
/* Onglet Magasin : en-tête photo + tuiles */
.shero{position:relative;margin-top:16px}
.shero .cov{height:150px;border-radius:28px;background:var(--surf) center/cover no-repeat}
.shero .av{position:absolute;left:18px;bottom:-34px;width:84px;height:84px;font-size:32px;border:4px solid #fff}
.sname{font-size:30px;font-weight:500;letter-spacing:-.03em;margin:46px 0 0;line-height:1.1}
.saddr{font-size:15px;color:var(--muted);margin:4px 0 0}
.sinfos{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--surf);color:var(--ink);font-weight:600;font-size:15px;min-height:46px;padding:0 18px;border-radius:999px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile2{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--surf);border-radius:24px;padding:16px;text-align:left;color:inherit;text-decoration:none;min-height:150px}
.tile2 .ti{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tile2 .ti svg{width:26px;height:26px}
.tile2 b{font-size:17px;font-weight:600;letter-spacing:-.01em}.tile2 span.s{font-size:13.5px;color:var(--muted);margin-top:-6px}
/* Zone de la barre d'état : fond blanc, le contenu ne passe plus dessous */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:var(--sat);background:#fff;z-index:25}
.carousel .big{margin-bottom:0}
.rav{border:none;padding:0;cursor:pointer}
.price{display:flex;align-items:baseline;gap:7px;margin-top:5px;flex-wrap:wrap}
.price .num{font-size:21px;color:var(--p)}
.price s{font-size:13px;color:var(--faint)}
.tag{position:absolute;top:9px;left:9px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px}
.t-own{background:#f6ecd8;color:#6b5a3e}.t-net{background:#f6e6f4;color:var(--v)}
.disc{position:absolute;top:9px;right:9px;background:var(--p);color:#fff;font-family:'Racing Sans One',sans-serif;font-size:14px;padding:3px 9px;border-radius:9px}
.st{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-pub{background:#e3f3ec;color:var(--teal)}.s-rec{background:var(--rose2);color:var(--p)}.s-act{background:#eef0fb;color:#5b63c4}
.s-sch{background:#fbf0e6;color:#b07a2e}.s-draft{background:#f0eeec;color:var(--muted)}.s-dec{background:var(--redbg);color:var(--red)}
.s-mand{background:#2D2D2D;color:#fff}
.meta{font-size:12.5px;color:var(--muted);margin-left:6px}

/* ---- Activité ---- */
.dot{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.35}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:currentColor}
.d-ok{color:var(--teal)}.d-ko{color:var(--red)}

/* ---- Nav + FAB ---- */
.nav{position:fixed;left:16px;right:16px;bottom:calc(18px + var(--sab));height:var(--nav);border-radius:999px;background:#fff;box-shadow:0 12px 32px rgba(45,45,45,.16),0 0 0 1px var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:20}
@media (min-width:560px){.nav{left:calc(50% - 199px);right:auto;width:398px}}
.nav button[data-tab]{display:flex;align-items:center;justify-content:center;height:52px;min-width:52px;border-radius:999px;color:var(--ink2);font-size:0;font-weight:600;position:relative;white-space:nowrap;transition:background .15s}
.nav button[data-tab] svg{width:22px;height:22px;flex:none}
.nav button.on{background:var(--ink);color:#fff;font-size:14px;padding:0 16px}.nav button.on svg{margin-right:8px}
.nav .bd{position:absolute;top:5px;left:30px;background:var(--p);color:#fff;font-size:10px;font-weight:600;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}.nav button.on .bd{border-color:var(--ink)}
.fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#E5087E,#951B81);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:389px){.nav{left:12px;right:12px}.nav button[data-tab]{height:48px;min-width:46px}.nav button.on{padding:0 14px;font-size:13.5px}.nav button.on svg{margin-right:7px}.nav .bd{top:3px;left:27px}.fab{width:52px;height:52px}}
@media (max-width:339px){.nav button[data-tab]{min-width:44px}.nav button.on{font-size:0;padding:0;min-width:48px}.nav button.on svg{margin-right:0}.fab{width:48px;height:48px}}

/* ---- Promos ---- */
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;margin-top:16px}
.seg button{flex:1;padding:11px 8px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--ink);color:#fff}.box .seg{background:#fff}
.seg .c{background:var(--p);color:#fff;font-size:11.5px;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.intro{font-size:14px;color:var(--muted);line-height:1.45;margin:14px 0}
/* Cartes promo : « à traiter » (ligne, piste B) et grande carte (piste A) */
.card{position:relative;background:#fff;cursor:pointer}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
.sec-h h2{font-size:17px;margin:0}.sec-h span{font-size:13px;color:var(--muted)}
.big{border:1.5px solid var(--line);border-radius:24px;overflow:hidden;margin-bottom:12px}
/* Carte promo en ligne (liste Promos) : vignette 88 px + statut + méthode de validation */
.net-card{display:flex;align-items:center;gap:12px;border-radius:24px;background:var(--pink);padding:14px 16px;margin:4px 0 12px}
.net-card .ic{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.net-card .ic svg{width:20px;height:20px}
.net-card b{display:block;font-size:15px}.net-card .sp>span{display:block;font-size:13px;color:#6E1460}
.net-card button{border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:10px 14px;min-height:44px;flex:none}
.big .im{position:relative;height:190px;background:var(--bg)}
.big .im img{width:100%;height:100%;object-fit:cover;display:block}
.big .bd{padding:12px 16px 14px}
.big h3{font-size:17px;margin:0;letter-spacing:-.01em}
.big .d{font-size:14px;color:var(--muted);margin-top:3px}
.chip{position:absolute;top:12px;left:12px;background:var(--cc);color:#fff;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px}

.big .btns{margin-top:12px}
.big .btns button{padding:11px 8px;font-size:14.5px;border-radius:12px}
.cats{display:flex;gap:8px;overflow-x:auto;margin:18px -20px 4px;padding:0 20px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;display:flex;align-items:center;gap:6px;padding:0 16px;border-radius:999px;border:none;background:var(--surf);font-weight:600;font-size:14px;color:var(--ink);min-height:44px}
.cats button em{font-style:normal}.cats button em::before{content:"· "}
.cats button.on{background:var(--ink);color:#fff}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:flex-start}
.pager::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;padding:12px 20px 0;box-sizing:border-box;min-height:50vh}
.fiche .stchip{background:var(--cc);color:#fff;font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px}
.fiche .fhero .photo{position:absolute;inset:0;width:100%;background:transparent}
.fiche .ph-hint{position:absolute;left:14px;bottom:14px;background:rgba(45,45,45,.7);color:#fff;font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;pointer-events:none}
.fiche .ph-hint svg,.fiche .fhero .lib svg{width:16px;height:16px}
.fiche .fhero .lib{position:absolute;right:14px;bottom:14px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
.kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
/* Page promo : jamais de défilement horizontal (iPhone faisait bouger la page de côté). */
.fiche{overflow-x:hidden}
.fiche .scroll{overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}
.fiche .scroll .in{min-width:0;max-width:100%;box-sizing:border-box}
.fiche .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fiche input[type=date]{-webkit-appearance:none;appearance:none;min-height:50px;text-align:left}
.kpis4 span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis4 div{background:var(--surf);border-radius:18px;padding:14px 6px;text-align:center}
.kpis4 b{display:block;font-size:22px;font-weight:500;letter-spacing:-.03em}.kpis4 span{font-size:11px;color:var(--muted)}
.offer{position:absolute;left:12px;bottom:12px;background:var(--p);color:#fff;font-weight:600;font-size:19px;padding:5px 11px;border-radius:12px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big .eye{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--p);display:flex;align-items:center;justify-content:center}
.big .eye svg{width:19px;height:19px}
/* Fiche promo */
.fiche .fhero{position:relative;height:290px;background:var(--bg);flex:none}
.fiche .fhero img{width:100%;height:100%;object-fit:cover;display:block}
.fiche .fhero .fx,.fiche .fhero .cl{position:absolute;top:calc(var(--sat) + 12px);height:44px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13.5px}
.fiche .fhero .fx{left:14px;width:44px;color:var(--ink)}.fiche .fhero .cl{right:14px;padding:0 14px;color:var(--ink)}
.fiche .scroll{padding:16px 18px 20px}
.fiche h1{font-size:26px;margin:6px 0 4px;letter-spacing:-.03em;font-weight:500;line-height:1.15}
.fiche .pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fiche .pr b{font-size:26px;color:var(--p)}.fiche .pr s{color:var(--muted);font-size:15px}
.fiche .box{border:none;border-radius:20px;padding:2px 16px;margin-top:14px;background:var(--surf)}

.blue{background:var(--fb);color:#fff;font-weight:600;font-size:13px;padding:8px 13px;border-radius:999px;margin-left:auto;flex:none}
.todo{text-align:center;font-size:13.5px;color:var(--muted);margin-bottom:2px}

/* ---- Publication en cours ---- */
.pub{text-align:center;padding:10px 4px 6px}
/* Création écran par écran (MOD-076) */
.full.still{animation:none}
.wz-top{flex:none;padding:6px 20px 2px}
.wz-top span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
.wz-bar{display:flex;gap:6px}
.wz-bar i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.wz-bar i.on{background:var(--ink)}
.wz-h{font-size:30px;font-weight:500;margin:8px 0 8px;letter-spacing:-.035em;line-height:1.1}
.wz-p{font-size:15px;margin:0 0 14px;line-height:1.45}
/* Validation : tuiles 2×2 */
.vt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vt button{position:relative;border:2px solid transparent;border-radius:24px;background:var(--surf);padding:13.5px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px}
.vt button.on{border:2px solid var(--ink);padding:13.5px;background:#fff}
.vt button:disabled{opacity:.4}
.vt button:last-child:nth-child(odd){grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.vt .vi{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.vt .vi svg{width:22px;height:22px}.vt .vi svg.sm{width:16px;height:16px}
.vt button.on .vi{background:var(--ink);color:#fff}
.vt b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.vt span.s{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.vt .ok{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.vt .ok svg{width:13px;height:13px}
.vt .reco{position:absolute;top:14px;right:12px;font-size:11px;font-weight:600;color:var(--v);background:#fff;border-radius:999px;padding:3px 8px}
.vt button.on .reco{display:none}
.infob{display:flex;gap:10px;background:var(--surf);border-radius:22px;padding:14px 16px;margin-top:12px;font-size:14px;line-height:1.45;color:var(--ink2)}
.infob svg{flex:none;margin-top:2px;color:var(--ink)}
/* Diffusion : aperçu du post */
.post{border:none;border-radius:24px;padding:14px;margin-top:4px;background:var(--surf)}
.post .ph{display:flex;align-items:center;gap:10px}
.post .ph .av{width:34px;height:34px;font-size:15px}
.post .ph b{display:block;font-size:14px}.post .ph span{display:block;font-size:12px;color:var(--muted)}
.post .pim{position:relative;height:196px;border-radius:20px;overflow:hidden;margin-top:10px;background:var(--chip)}
.post .pim img{width:100%;height:100%;object-fit:cover}
.post .pim .pb{position:absolute;left:12px;top:12px;background:var(--p);color:#fff;font-family:'Racing Sans One',sans-serif;font-size:26px;line-height:1;padding:7px 11px 6px;border-radius:13px}
.post .pim .dt{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px}
.post h4{font-size:16px;font-weight:600;margin:10px 2px 0}
.post .pp{display:flex;align-items:baseline;gap:8px;margin:2px 2px 0;font-size:13px;color:var(--muted);flex-wrap:wrap}
.post .pp b{font-size:16px;color:var(--p)}.post .pp s{color:var(--faint)}
.chk .ch.big{width:36px;height:36px}.chk .ch.big.ig{border-radius:11px}
.always{font-size:12px;font-weight:600;color:var(--tealt);background:var(--mint);border-radius:999px;padding:4px 9px;margin-left:auto;white-space:nowrap}
.vit{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#E5087E,#951B81);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:none}
.acts2{display:flex;gap:10px}.acts2 .big-btn{margin-top:0}
.acts2 .gry{flex:none;min-height:58px;padding:0 22px;border-radius:999px;background:var(--surf);color:var(--ink);font-weight:600;font-size:16px}
/* Scanner de QR client (MOD-075) */
.scan{position:fixed;inset:0;z-index:30;background:#141414;color:#fff;overflow:hidden;animation:fade .18s}
@media (min-width:560px){.scan{max-width:430px;margin:0 auto}}
.scan::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 35%,#3A3A3A 0%,#1B1B1B 60%,#111 100%)}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.scan .top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 18px) 16px 0}
.scan .top>span{font-size:15px;font-weight:600}
.scan .rbd{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.scan .rbd.on{background:#fff;color:var(--ink)}
.scan .hd{position:relative;text-align:center;padding:30px 32px 0}
.scan .hd h1{margin:0;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.scan .hd p{margin:8px 0 0;font-size:15px;line-height:1.45;color:#D9D5CF}
.scan .vf{position:relative;margin:30px auto 0;width:264px;height:264px}
.scan .vf i{position:absolute;width:56px;height:56px;border:0 solid #fff}
.scan .vf i:nth-child(1){left:0;top:0;border-left-width:5px;border-top-width:5px;border-top-left-radius:28px}
.scan .vf i:nth-child(2){right:0;top:0;border-right-width:5px;border-top-width:5px;border-top-right-radius:28px}
.scan .vf i:nth-child(3){left:0;bottom:0;border-left-width:5px;border-bottom-width:5px;border-bottom-left-radius:28px}
.scan .vf i:nth-child(4){right:0;bottom:0;border-right-width:5px;border-bottom-width:5px;border-bottom-right-radius:28px}
.scan .vf u{position:absolute;left:22px;right:22px;top:20px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(229,8,126,0),#E5087E,#951B81,rgba(149,27,129,0));animation:scanl 2.2s ease-in-out infinite alternate}
@keyframes scanl{to{top:240px}}
.scan .msg{position:relative;text-align:center;font-size:14px;color:#D9D5CF;margin:18px 28px 0;min-height:20px}
.scan .res{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 14px);border-radius:30px;background:#fff;color:var(--ink);padding:18px 18px 16px;animation:up .22s ease-out}
.scan .res .rh{display:flex;align-items:center;gap:12px}
.scan .res .ri{width:48px;height:48px;border-radius:16px;background:var(--mint);color:var(--tealt);display:flex;align-items:center;justify-content:center;flex:none;font-size:24px;font-weight:600}
.scan .res .ri.ko{background:var(--redbg);color:var(--red)}
.scan .res .ri .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--rose2);border-top-color:var(--p);animation:rot .8s linear infinite}
.scan .res b{display:block;font-size:18px;font-weight:600}.scan .res .rh .sp>span{display:block;font-size:14px;color:var(--muted)}
.scan .res p{margin:12px 0 0;font-size:14px;line-height:1.45;color:var(--ink2)}
.scan .res .rb2{display:flex;gap:10px;margin-top:14px}
.scan .res .rb2 button{height:54px;border-radius:999px;font-size:15px;font-weight:600}
.scan .res .rb2 .a{flex:none;padding:0 18px;background:var(--surf);color:var(--ink)}
.scan .res .rb2 .b{flex:1;background:var(--ink);color:#fff}
.pub .done.ko{background:var(--redbg);color:var(--red);font-size:30px;font-weight:600}
.pub .spin{width:56px;height:56px;border-radius:50%;border:4px solid var(--rose2);border-top-color:var(--p);margin:6px auto 16px;animation:rot .8s linear infinite}
.pub .done{width:62px;height:62px;border-radius:50%;background:var(--mint);color:var(--teal);display:flex;align-items:center;justify-content:center;margin:2px auto 14px}
.pub h2{font-size:24px}
.pub .lines{text-align:left;margin:16px 0 4px;border:none;border-radius:20px;padding:4px 16px;background:var(--surf)}
.pub .lines div{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:15px;font-weight:600}
.pub .lines div+div{border-top:1px solid #E2DED8}
.pub .lines em{margin-left:auto;font-style:normal;font-size:13.5px;font-weight:600}

/* ---- Vue client : la vraie app particulier (/v/) en aperçu, même design partout ---- */
.apercu{position:fixed;inset:0;z-index:35;background:#000}
.apercu iframe{display:block;width:100%;height:100%;border:0}
@media (min-width:560px){.apercu iframe{max-width:430px;margin:0 auto}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock) + 16px);background:#2D2D2D;color:#fff;font-size:14.5px;font-weight:600;padding:13px 20px;border-radius:999px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .2s;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes rot{to{transform:rotate(360deg)}}
/* Support Vitriin */
.tk-new{font-size:12px;font-weight:600;color:#fff;background:var(--p);border-radius:999px;padding:3px 9px;white-space:nowrap;margin-right:6px}
.tk-topics{display:flex;flex-wrap:wrap;gap:8px}
.tk-chip{border:none;background:var(--surf);border-radius:999px;padding:0 16px;font:600 14px 'DM Sans',sans-serif;color:var(--ink);min-height:44px}
.tk-chip.on{background:var(--ink);color:#fff}
.tk-thread{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tmsg{border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;max-width:88%}
.tmsg small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.tmsg.client{background:var(--bg);align-self:flex-end}.tmsg.staff{background:var(--pink);align-self:flex-start}

function mapRow(row, accounts) {
  const pr = row.promotions, det = pr.details || {};
  const pubs = row.publications || [];
  const byCh = { fb: pubs.find(x => x.channel === "facebook"), ig: pubs.find(x => x.channel === "instagram") };
  const ch = {};
  ["fb", "ig"].forEach(c => { const x = byCh[c]; if (x?.status === "published") ch[c] = "ok"; else if (x?.status === "failed") ch[c] = "ko"; });
  const done = pubs.filter(x => x.status === "published" || x.status === "failed");
  // Programmée : statut scheduled (planificateur, MOD-082), ou pending daté dans le futur (démo).
  const planned = pubs.find(x => x.status === "scheduled" || (x.status === "pending" && new Date(x.published_at) > Date.now()));
  let status;
  if (pr.status === "draft") status = "draft";
  else if (done.length) status = "published";
  else if (planned) status = "scheduled";
  else if (row.status === "declined") status = "declined";
  else if (row.status === "active") status = "active";
  else status = "received";
  const start = new Date(pr.starts_at), end = new Date(pr.ends_at);
  const m = (x) => x?.status === "published" && x.metrics ? [+x.metrics.reach || 0, +x.metrics.views || 0, (+x.metrics.reactions || 0) + (+x.metrics.shares || 0), +x.metrics.comments || 0] : null;
  const stats = done.length ? { fb: m(byCh.fb), ig: m(byCh.ig) } : null;
  const chAt = { fb: byCh.fb?.status === "published" ? byCh.fb.published_at : null, ig: byCh.ig?.status === "published" ? byCh.ig.published_at : null };
  const sched = planned ? new Date(planned.scheduled_at || planned.published_at) : null;
  const pubAtNet = pr.publish_at ? new Date(pr.publish_at) : null;
  return {
    id: row.id, spId: row.id, promoId: pr.id, src: pr.created_by_network_id ? "net" : "own",
    // Personnalisation du magasin (si la centrale l'autorise) par-dessus la version centrale.
    suspended: !!row.suspended, hidden: !!row.hidden, ov: row.overrides || {}, base: { title: pr.title, text: pr.description || "", img: pr.media_url },
    kind: pr.promo_type ? "promo" : "post", title: row.overrides?.title || pr.title, img: row.overrides?.media_url || pr.media_url,
    media: row.overrides?.media_url ? [row.overrides.media_url] : Array.isArray(det.media) && det.media.length ? det.media : (pr.media_url ? [pr.media_url] : []),
    // Visuels d'origine de la centrale : alimentent la médiathèque du magasin.
    netMedia: pr.created_by_network_id ? (Array.isArray(det.media) && det.media.length ? det.media : (pr.media_url ? [pr.media_url] : [])) : [],
    formats: Array.isArray(det.formats) ? det.formats : [], mech: pr.mechanic, text: row.overrides?.text || pr.description || "",
    type: pr.promo_type, orig: det.orig ?? null, val: det.val ?? null, xy: det.xy || [2, 1], sub: det.sub || "", cond: det.sub || "",
    start, end, code: pr.discount_code, ean: pr.ean_code, mandatory: pr.is_mandatory, pinSp: !!row.pin_required, pinNet: !!pr.pin_required, validation: pr.validation || null,
    // Date de publication proposée par la centrale, ou imposée (promo obligatoire) : le magasin valide.
    pubAtNet, pubLock: !!pr.publish_at_locked && !!pubAtNet,
    camp: pr.campaign_id || null, star: !!pr.is_featured,
    deadline: pr.publish_at_locked && pubAtNet ? pubAtNet : start > Date.now() ? start : end,
    status, ch, chAt, stats,
    pubAt: done.length ? Math.max(...done.map(x => new Date(x.published_at).getTime())) : null,
    schedAt: sched ? new Date(sched.getFullYear(), sched.getMonth(), sched.getDate()).getTime() : null,
    schedTime: sched ? sched.toTimeString().slice(0, 5) : null,
    schedFull: sched ? sched.getTime() : null,
    schedCh: pubs.filter(x => x === planned || x.status === "scheduled").map(x => x.channel),
  };
}

async function loadData() {
  const { data: mem, error: e0 } = await sb.from("store_members").select("store_id, stores(id, slug, name, address, city, postal_code, auto_accept, logo_url, contact_first_name, contact_last_name, contact_phone, contact_email, website, description, cover_url, public_phone, public_email)").limit(1);
  if (e0) throw e0;
  if (!mem.length) throw new Error("Ce compte n'est rattaché à aucun magasin.");
  const st = mem[0].stores;
  await sb.rpc("demo_tick", { p_store_id: st.id }); // fait avancer la démo ; sans effet ailleurs
  const [net, acc, rows, rev, tk, lk, dm, pn, cp] = await Promise.all([
    sb.rpc("get_store_network", { p_store_id: st.id }),
    sb.from("social_accounts").select("channel, display_name, status, enabled").eq("store_id", st.id),
    sb.from("store_promotions").select("id, status, overrides, suspended, hidden, pin_required, created_at, activated_at, promotions(id, title, description, mechanic, promo_type, discount_code, ean_code, media_url, starts_at, ends_at, is_mandatory, pin_required, validation, status, details, created_by_network_id, created_by_store_id, publish_at, publish_at_locked, campaign_id, is_featured), publications(channel, status, published_at, scheduled_at, metrics)").eq("store_id", st.id).order("created_at", { ascending: false }),
    // Codes révélés par les clients (drive to store), lisibles par le magasin seulement.
    sb.from("code_reveals").select("store_promotion_id, revealed_at, confidence, used_at, validated_by").eq("store_id", st.id).order("revealed_at", { ascending: false }).range(0, 9999),
    sb.rpc("support_mine"),
    // « J'aime » des clients sur l'app Vitriin.
    sb.from("promo_likes").select("store_promotion_id, created_at").eq("store_id", st.id).range(0, 9999),
    sb.rpc("my_store_is_demo", { p_store_id: st.id }),
    // Code vendeur : le code, le réglage de la centrale et celui du magasin (MOD-074).
    sb.rpc("store_pin_settings", { p_store_id: st.id }),
    // Campagnes proposées par la centrale (MOD-083), et si ce magasin a accepté leur planning.
    sb.from("campaigns").select("id, name, starts_on, ends_on, status, campaign_acceptances(store_id, accepted_at)").eq("status", "proposed").order("starts_on").range(0, 99),
  ]);
  const e = net.error || acc.error || rows.error; if (e) throw e;
  // Un code affiché loin du magasin ou hors des heures d'ouverture, et non confirmé, ne compte pas comme utilisé.
  const allRev = (!rev.error && rev.data) || [];
  const reveals = allRev.filter(r => r.confidence !== "distance" || r.used_at);
  S.codesDetail = allRev.reduce((m, r) => { const d = m[r.store_promotion_id] ||= { probable: 0, incertain: 0, distance: 0, used: 0, decl: 0 }; if (r.used_at) d[r.validated_by === "client" ? "decl" : "used"]++; else d[r.confidence || "incertain"]++; return m; }, {});
  S.tickets = (!tk.error && tk.data) || [];
  S.codes7 = reveals.filter(r => Date.now() - new Date(r.revealed_at) < 7 * DAY).length;
  S.codesBy = reveals.reduce((m, r) => (m[r.store_promotion_id] = (m[r.store_promotion_id] || 0) + 1, m), {});
  const likes = (!lk.error && lk.data) || [];

function pricing(p) {
  const o = p.orig;
  // Promo saisie par la centrale sans chiffres détaillés : on affiche son texte d'offre tel quel.
  if (p.mech && (p.val == null || (p.type === "x_plus_y" && p.orig == null && p.val == null))) return { price: null, old: null, badge: p.mech };
  if (!p.type) return { price: null, old: null, badge: "" };
  switch (p.type) {
    case "percent": return { price: o != null ? Math.round(o * (100 - p.val)) / 100 : null, old: o, badge: `-${p.val} %` };
    case "amount": return { price: o != null ? Math.max(0, o - p.val) : null, old: o, badge: `-${eur(p.val).replace(",00", "")}` };
    case "new_price": return { price: p.val, old: o, badge: o ? `-${Math.round((1 - p.val / o) * 100)} %` : "Nouveau" };
    case "x_plus_y": return { price: p.val, old: o, badge: `${p.xy?.[0] ?? 2} + ${p.xy?.[1] ?? 1} offert` };
    case "cashback": return { price: null, old: null, badge: `${p.val} % cagnottés` };
    case "free_with_condition": return { price: null, old: null, badge: "Offert" };
  }
  return { price: null, old: null, badge: "" };
}

const tkMsgs = (list) => list.map(m => `<div class="tmsg ${m.kind}"><small>${m.kind === "staff" ? "Équipe Vitriin" : "Vous"} · ${fmtDay(new Date(m.at).getTime())} ${new Date(m.at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</small>${esc(m.body)}</div>`).join("");

async function sheetTicket(id) {
  const { data, error } = await sb.rpc("support_thread", { p_id: id });
  if (error) return toast(errText(error));
  const t = data.ticket;
  sheet(`<div class="grab"></div><h2>${esc(t.subject)}</h2><p class="small" id="tk-stat" style="font-size:13.5px;margin-top:4px">${TK_ST[t.status] || ""}</p>

document.addEventListener("click", (e) => {

  if (!t || t.closest("#layer")) return;
  const ds = t.dataset;
  if (ds.go) { const [a, b] = ds.go.split(":"); go(a, b); }
  else if (ds.activate) setStatus(find(ds.activate), "active", (p) => `« ${p.title} » activée. Publiez-la ou programmez-la.`);
  else if (ds.decline) setStatus(find(ds.decline), "declined", (p) => `« ${p.title} » refusée. Votre centrale est informée.`);

  else if (ds.toggle === "autoAccept") setAutoAccept(!STORE.autoAccept);
  else if (ds.pinscope) setPinScope(ds.pinscope);
  else if (ds.toggle) { S[ds.toggle] = !S[ds.toggle]; save(); render(true); }

  else if (ds.card) openPromo(find(ds.card));
  else if (ds.camp) sheetCampaign(campById(ds.camp));
  else if (ds.stat) statsPromo(find(ds.stat));
  else if (ds.act === "reconnect") reconnect();
  else if (ds.act === "connect-meta") connectAccount("meta");
  else if (ds.act === "connect-google") connectAccount("google");
  else if (ds.act === "store-edit") sheetStore();
  else if (ds.act === "support") sheetSupport();

        ${editable ? `<button class="photo" data-fx="photo" aria-label="Changer la photo"></button><span class="ph-hint">${I.cam}Changer la photo</span>${STORE.hasNet ? `<button class="lib" data-fx="lib">${I.net}Photothèque</button>` : ""}` : ""}
        <button class="fx" data-fx="close" aria-label="Fermer">${I.x}</button>
        ${k === "live" && p.img && p.kind !== "post" ? `<button class="cl" data-fx="clients">${I.eye}Côté clients</button>` : ""}</div>
      <div class="scroll">
        <div class="row" style="justify-content:space-between;align-items:center;gap:10px">
          <span class="stchip">${esc(st.l)}</span>${chanIcons(p, true)}</div>
        <div class="kpis4">${[["Portée", 0], ["Vues", 1], ["Interactions", 2]].map(([l, i]) => `<div><b>${p.stats ? nf(sum(i)) : "—"}</b><span>${l}</span></div>`).join("")}<div><b>${nf((S.codesBy || {})[p.spId] || 0)}</b><span>Codes utilisés</span></div></div>
        ${editable ? "" : `<p class="hint" style="color:var(--muted);margin-top:14px">${p.hidden || isOver(p) ? "Cette promo n'est plus modifiable." : `Votre centrale ${esc(STORE.net)} ne permet pas de modifier ses promos.`}</p>`}
        <div class="${editable ? "" : "ro-box"}">

          if (F.title.trim() !== p.title) ch.title = F.title.trim();
          if ((F.text || "") !== (p.text || "")) ch.description = F.text.trim() || null;
          if (img !== p.img) ch.media_url = img;

          if (end.getTime() !== new Date(p.end).setHours(23, 59, 0, 0)) ch.ends_at = end.toISOString();

          if ((F.text || "").trim() !== (p.base.text || "").trim()) ov.text = (F.text || "").trim();

        }

      // « Valider » sur une promo reçue : elle est aussi acceptée.
      if (p.status === "received" && !p.hidden && !isOver(p)) { const { error } = await sb.from("store_promotions").update({ status: "active" }).eq("id", p.spId); if (error) throw error; }
      closeLayer(); await loadData(); render(true); toast("Enregistré.");
    } catch (e) { toast(errText(e)); btn.disabled = false; }
  };
  const fx = {
    close: closeLayer, photo: photoMenu, lib: () => pickMedia("lib", setImg), ok: save, clients: () => { closeLayer(); clients(p.id); },
    susp: () => askSuspend(p), del: () => askDelete(p), resume: () => askResume(p),
    offer: () => { closeLayer(); createForm(p.kind, p); },
    pin: () => { F.pin = !F.pin; draw(); },
    resched: () => { closeLayer(); sheetSchedule(p); },
    unsched: async () => {

      if (error) return toast(errText(error));
      closeLayer(); await loadData(); render(true); toast(p.mandatory ? "Publication déprogrammée. Votre centrale la voit à nouveau « à valider »." : "Publication déprogrammée.");
    },
  };
  draw();
}

function publish(p, retryOnly) {

// Programmer la publication (MOD-082). Réseau réel : RPC schedule_publication,
// le planificateur publie à l'heure dite. Démo : demo_publish datée, comme avant.
// Date imposée par la centrale (promo obligatoire) : le magasin valide, l'heure ne se change pas.
function sheetSchedule(p, back) {
  const NAME = { fb: "Facebook", ig: "Instagram", gb: "Google" }, DB = { fb: "facebook", ig: "instagram", gb: "google_business" };
  const avail = ["fb", "ig", "gb"].filter(c => (c === "fb" ? S.fb : c === "ig" ? S.ig : GBP_READY && !STORE.demo ? S.gb : "none") === "ok");
  if (!avail.length) return toast("Connectez d'abord Facebook ou Instagram dans l’onglet Magasin.");
  if (p.pubLock && !imposed(p)) return toast("La date fixée par votre centrale est passée : publiez maintenant.");
  const locked = imposed(p);
  const prev = p.schedCh?.length ? avail.filter(c => p.schedCh.includes(DB[c])) : [];
  let chans = prev.length ? prev : [...avail];
  const nDays = Math.max(1, Math.min(21, Math.ceil((new Date(p.end).getTime() - today.getTime()) / DAY)));
  const days = []; for (let k = 0; k < nDays; k++) days.push(d(k));
  const prop = p.schedFull ? new Date(p.schedFull) : p.pubAtNet && p.pubAtNet > Date.now() ? p.pubAtNet : null;
  // Par défaut : la date déjà programmée, sinon celle proposée par la centrale, sinon le premier jour de la
  // promo (aujourd'hui si elle a déjà commencé), à 9h, ou à l'heure pleine suivante si 9h est passé.
  const dayOf = (t) => Math.max(0, Math.min(nDays - 1, Math.round((new Date(t).setHours(0, 0, 0, 0) - today.getTime()) / DAY)));
  let sel = prop ? dayOf(prop) : dayOf(p.start);
  let time = prop ? hhmm(prop) : "09:00";
  if (!prop && sel === 0 && new Date().getHours() >= 9) time = `${String(Math.min(23, new Date().getHours() + 1)).padStart(2, "0")}:00`;
  const atOf = () => { if (locked) return new Date(p.pubAtNet); const [hh, mm] = (time || "09:00").split(":").map(Number); const at = new Date(days[sel]); at.setHours(hh, mm, 0, 0); return at; };
  const draw = () => {
    const at = atOf(), list = chans.map(c => NAME[c]);
    sheet(`<div class="grab"></div><h2>${locked ? "Valider la publication" : "Programmer la publication"}</h2><p class="small" style="font-size:14px;margin-top:4px">« ${esc(p.title)} » · du ${fmtShort(p.start)} au ${fmtShort(p.end)}</p>
      ${locked ? `<div class="recap" style="display:flex;gap:10px;align-items:flex-start"><svg aria-hidden="true" style="width:18px;height:18px;flex:none;margin-top:2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Date fixée par votre centrale ${esc(STORE.net)} : <b>${fmtDay(p.pubAtNet)} à ${hhmm(p.pubAtNet).replace(":", "h")}</b>. Vous validez, Vitriin publie à l'heure dite sur vos comptes.</span></div>`
      : `<div class="fl">Date</div><div class="days">${days.map((x, k) => `<button class="day ${k === sel ? "on" : ""}" data-k="${k}"><small>${k === 0 ? "Auj." : x.toLocaleDateString("fr-FR", { weekday: "short" })}</small><b>${x.getDate()}</b><span>${x.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "")}</span></button>`).join("")}</div>
      ${p.pubAtNet && !p.pubLock ? `<div class="hint">Date proposée par votre centrale : ${fmtDay(p.pubAtNet)} à ${hhmm(p.pubAtNet).replace(":", "h")}</div>` : ""}
      <div class="fl">Heure</div><input class="in" type="time" id="s-time" value="${time}">`}
      <div class="fl">Réseaux</div><div class="sch-ch">${avail.map(c => `<button class="${chans.includes(c) ? "on" : ""}" data-ch="${c}" aria-pressed="${chans.includes(c)}">${NAME[c]}</button>`).join("")}</div>
      <div class="recap">${list.length ? `Publication le <b>${fmtDay(at)} à ${hhmm(at).replace(":", "h")}</b> sur ${list.join(" et ")}.` : "Choisissez au moins un réseau."} Vous pourrez la déprogrammer à tout moment.</div>
      <button class="big-btn" id="s-go" ${list.length ? "" : "disabled"}>${locked ? "Valider et programmer" : "Programmer"}</button><button class="txt-btn" data-close>Annuler</button>`);
    $$(".day").forEach(b => b.onclick = () => { sel = +b.dataset.k; time = $("#s-time")?.value || time; draw(); });
    $("#s-time") && ($("#s-time").onchange = (e) => { time = e.target.value; draw(); });
    $$(".sch-ch button").forEach(b => b.onclick = () => { const c = b.dataset.ch; chans = chans.includes(c) ? chans.filter(x => x !== c) : [...chans, c]; time = $("#s-time")?.value || time; draw(); });
    $("#s-go").onclick = async () => {
      const at = atOf();
      if (at.getTime() <= Date.now() + 60e3) return toast("Choisissez une heure à venir.");
      if (at >= new Date(p.end)) return toast("La publication doit avoir lieu avant la fin de la promo.");
      $("#s-go").disabled = true;
      const { error } = STORE.demo
        ? await sb.rpc("demo_publish", { p_store_promotion_id: p.spId, p_channels: chans.filter(c => c !== "gb").map(c => DB[c]), p_at: at.toISOString() })
        : await sb.rpc("schedule_publication", { p_store_promotion_id: p.spId, p_channels: chans.map(c => DB[c]), p_at: at.toISOString() });
      if (error) { $("#s-go").disabled = false; return toast(errText(error)); }
      await loadData(); render(true); back ? back() : closeLayer(); toast(`Programmée le ${fmtDay(at)} à ${hhmm(at).replace(":", "h")}.`);
    };
    if (back) $$("#layer [data-close]").forEach(b => b.onclick = back);
  };
  draw();
}
/* ---------- Campagnes (MOD-083) ---------- */
// La centrale propose un planning pour tout un temps fort (ex. Black Friday,
// 80 promos sur 15 jours). Le magasin l'accepte d'un geste, ou décale une promo
// avec la flèche. Tant qu'il n'a pas accepté, les promos de la campagne restent
// regroupées dans une seule carte au lieu d'encombrer « À traiter ».
const campById = (id) => (S.camps || []).find(c => c.id === id);
const campItems = (c) => S.promos.filter(p => p.camp === c.id && !p.hidden && p.status !== "declined");
const campOpen = () => (S.camps || []).filter(c => !c.accepted && campItems(c).length && Date.now() < new Date(c.ends_on + "T23:59:59").getTime());
const campWait = (p) => { const c = p.camp && campById(p.camp); return !!(c && !c.accepted && p.status !== "published" && p.status !== "scheduled"); };
const campWhen = (p) => p.status === "scheduled" && p.schedFull ? p.schedFull : p.pubAtNet ? p.pubAtNet.getTime() : null;
const hLbl = (t) => hhmm(t).replace(/^0/, "").replace(":00", "h").replace(":", "h");
const campDate = (s) => { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); };
const campCard = (c) => { const n = campItems(c).length; return `<div class="net-card"><span class="ic">${I.net}</span><span class="sp"><b>${esc(c.name)} · ${n} promo${n > 1 ? "s" : ""}</b><span>Planning proposé par votre centrale</span></span><button data-camp="${c.id}">Voir</button></div>`; };

function sheetCampaign(c) {
  if (!c) return;
  const items = campItems(c).filter(p => !isOver(p)), connected = S.fb === "ok" || S.ig === "ok";
  const days = {}; items.forEach(p => { const t = campWhen(p); (days[t ? dayKey(t) : "zz"] ||= []).push(p); });
  const keys = Object.keys(days).sort();
  const slots = [...new Set(items.filter(p => p.pubAtNet).map(p => hhmm(p.pubAtNet)))].sort().slice(0, 4).map(h => hLbl(new Date("2026-01-01T" + h)));

    $("#f-draft", layer) && ($("#f-draft").onclick = () => submit(true));
  };
  const refreshFoot = () => { const ok = stepOk(), t = $(".todo", layer), b = $("#f-next", layer) || $("#f-pub", layer); if (t) { t.style.visibility = ok ? "hidden" : ""; t.textContent = ok ? " " : hint(); } if (b) b.disabled = !ok; };
  const updCalc = () => { const pr = pricing(F); const c = $(".calc", layer); if (c && pr.price != null) c.innerHTML = `<span class="badge" style="font-size:15px;padding:3px 9px">${esc(pr.badge)}</span><span class="num">${eur(pr.price)}</span>${pr.old ? `<s>${eur(pr.old)}</s>` : ""}`; };
  const keepScroll = (fn) => { const sc = $(".scroll", layer)?.scrollTop || 0; fn(); const s2 = $(".scroll", layer); if (s2) s2.scrollTop = sc; };
  const submit = async (asDraft) => {
    const isPost = F.kind === "post";
    const btn = $("#f-pub", layer); if (btn) btn.disabled = true;
    try {
      const media = await ensureUploaded(F.img);
      const pr = pricing({ ...F, mech: null });
      const sub = F.type === "free_with_condition" ? F.cond : F.type === "x_plus_y" ? `Les ${(F.xy[0] || 0) + (F.xy[1] || 0)} pour ${eur(F.val || 0)}` : "";
      const title = isPost ? (F.text.trim().split(/\n/)[0].slice(0, 40) || "Post") : F.title.trim() || "Sans titre";
      const start = new Date(F.start); start.setHours(0, 0, 0, 0);
      const end = new Date(F.end); end.setHours(23, 59, 0, 0);
      const ean = !isPost && F.check === "ean" && eanOk(F.ean) ? F.ean : null;
      const web = !isPost && F.check === "web" && webOk(F.web) ? F.web : null;
      const row = {
        created_by_store_id: STORE.id, title, media_url: media,
        mechanic: isPost ? null : (F.type === "free_with_condition" ? (F.cond || "Offert") : pr.price != null ? `${eur(pr.price)}${pr.old ? " au lieu de " + eur(pr.old) : ""}` : pr.badge),
        description: isPost ? F.text.trim() : sub || null,
        promo_type: isPost ? null : F.type, validation: isPost ? null : F.check, ean_code: ean,
        details: isPost ? null : { orig: F.orig, val: F.val, xy: F.xy, sub },
        starts_at: start.toISOString(), ends_at: end.toISOString(), status: asDraft ? "draft" : "active",
      };
      // Ancien code de réduction : remplacé par l'EAN s'il en tenait lieu, sinon conservé.
      if (web) row.discount_code = web; else if (!draft || legacyEan || draft.validation === "web") row.discount_code = null;
      let spId = draft?.spId;
      if (draft) {
        const { created_by_store_id, ...changes } = row; // le magasin auteur ne change pas
        const { error } = await sb.from("promotions").update(changes).eq("id", draft.promoId);
        if (error) throw error;
      } else {
        const { data: pz, error } = await sb.from("promotions").insert(row).select("id").single();
        if (error) throw error;
        const { data: sp, error: e2 } = await sb.from("store_promotions").insert({ promotion_id: pz.id, store_id: STORE.id }).select("id").single();
        if (e2) throw e2;
        spId = sp.id;
      }
      closeLayer();
      if (editLive) { await loadData(); render(true); return toast("Modifications enregistrées."); }
      if (asDraft) { await loadData(); UI.tab = "promos"; UI.cat = "todo"; render(); return toast("Brouillon enregistré."); }
      publish({ spId, title, _chans: ["fb", "ig"].filter(c => F[c]) });
    } catch (e) { toast(errText(e)); if (btn) btn.disabled = false; }
  };
  document.body.style.overflow = "hidden";
  draw();
}
// Photo prise ou choisie sur le téléphone : convertie en JPEG au format
// Instagram, puis déposée dans le dossier du magasin (bucket promo-media).
async function ensureUploaded(src) {
  if (!src || !src.startsWith("data:")) return src;
  const blob = await (await fetch(src)).blob();
  const bmp = await createImageBitmap(blob, { imageOrientation: "from-image" });
  let sw = bmp.width, sh = bmp.height, sx = 0, sy = 0; const ratio = sw / sh;
  if (ratio < 0.8) { const h = Math.round(sw / 0.8); sy = Math.round((sh - h) / 2); sh = h; }
  else if (ratio > 1.91) { const w = Math.round(sh * 1.91); sx = Math.round((sw - w) / 2); sw = w; }
  const k = Math.min(1, 1440 / Math.max(sw, sh));
  const cv = document.createElement("canvas"); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  const jpeg = await new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(new Error("Conversion impossible.")), "image/jpeg", 0.9));
  const path = `${STORE.id}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from("promo-media").upload(path, jpeg, { contentType: "image/jpeg", upsert: false });
  if (error) throw error;
  return sb.storage.from("promo-media").getPublicUrl(path).data.publicUrl;
}
function typeFields(F) {
  const v = (n) => n == null ? "" : String(n).replace(".", ",");
  const e2 = (n) => n == null ? "" : n.toFixed(2).replace(".", ",");
  switch (F.type) {
    case "percent": return `<div class="two"><div><label>Prix original (€)</label><input class="in" inputmode="decimal" data-f="orig" value="${e2(F.orig)}"></div><div><label class="pk">Remise (%)</label><input class="in pk" inputmode="decimal" data-f="val" value="${v(F.val)}"></div></div>`;
    case "amount": return `<div class="two"><div><label>Prix original (€)</label><input class="in" inputmode="decimal" data-f="orig" value="${e2(F.orig)}"></div><div><label class="pk">Remise (€)</label><input class="in pk" inputmode="decimal" data-f="val" value="${e2(F.val)}"></div></div>`;
    case "new_price": return `<div class="two"><div><label>Prix original (€)</label><input class="in" inputmode="decimal" data-f="orig" value="${e2(F.orig)}"></div><div><label class="pk">Nouveau prix (€)</label><input class="in pk" inputmode="decimal" data-f="val" value="${e2(F.val)}"></div></div>`;
    case "x_plus_y": return `<div class="two"><div><label>Achetés</label><input class="in" inputmode="numeric" data-f="x" value="${F.xy[0]}"></div><div><label class="pk">Offerts</label><input class="in pk" inputmode="numeric" data-f="y" value="${F.xy[1]}"></div></div><div class="two" style="margin-top:10px"><div><label>Prix normal du lot (€)</label><input class="in" inputmode="decimal" data-f="orig" value="${e2(F.orig)}"></div><div><label class="pk">Prix payé (€)</label><input class="in pk" inputmode="decimal" data-f="val" value="${e2(F.val)}"></div></div>`;
    case "cashback": return `<div><label class="pk" style="display:block;font-size:13px;margin-bottom:6px">% crédité sur la carte fidélité</label><input class="in pk" inputmode="decimal" data-f="val" value="${v(F.val)}"></div>`;
    case "free_with_condition": return `<div><label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">Condition</label><input class="in" data-f="cond" placeholder="Ex : chaussettes offertes dès 80 € d'achat" value="${esc(F.cond || "")}"></div>`;
  }
  return "";
}
const iso = (t) => { const x = new Date(t); return new Date(x.getTime() - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
// Photothèque de la centrale : les visuels des promos qu'elle a envoyées, les plus récents d'abord, sans doublon.
const libItems = () => STORE.hasNet ? [...new Set([...S.promos, ...(S.trash || [])].sort((x, y) => y.start - x.start).flatMap(p => p.netMedia || []).filter(u => /^https:\/\//.test(u)))].slice(0, 60) : [];
function pickMedia(src, done) {
  if (src === "lib") {
    const items = libItems();
    sheet(`<div class="grab"></div><h2>Photothèque de la centrale</h2><p class="small" style="font-size:14px;margin-top:4px">Visuels partagés par ${esc(STORE.net)}, prêts à l'emploi.</p>
      ${items.length ? "" : `<div class="empty" style="margin-top:14px">Votre centrale n'a pas encore partagé de visuel.</div>`}
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">${items.map((s, k) => `<button data-lib="${k}" style="aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg)"><img onerror="this.style.visibility='hidden'" src="${esc(s)}" alt="" style="width:100%;height:100%;object-fit:cover"></button>`).join("")}</div>
      <button class="txt-btn" data-close>Annuler</button>`, true);
    $$("[data-lib]").forEach(b => b.onclick = () => { const s = items[+b.dataset.lib]; closeSheetOnly(); done(s); });
    return;
  }
  const input = src === "cam" ? $("#cam") : $("#file");
  input.onchange = () => { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(f); input.value = ""; };
  input.click();
}

/* ===================== Vue client ===================== */
// Aperçu côté clients : on ouvre l'app particulier elle-même (/v/ en mode aperçu), jamais une copie.
// En aperçu, rien n'est enregistré (ni code affiché, ni suivi, ni favori) : les statistiques restent justes.
function clients(startId) {
  if (!STORE.slug) return toast("Votre vitrine n'a pas encore d'adresse.");
  const p = startId ? find(startId) : null;
  const live = p && p.spId && p.status === "published" && p.start <= Date.now() && p.end >= Date.now();
  const q = `?apercu=1&s=${encodeURIComponent(STORE.slug)}`;
  const url = live ? `/v/p/${p.spId}${q}` : `/v/m/${encodeURIComponent(STORE.slug)}${q}`;
  $("#layer").innerHTML = `<div class="apercu"><iframe src="${url}" title="Votre vitrine vue par vos clients" allow="geolocation; clipboard-write; web-share"></iframe></div>`;
  document.body.style.overflow = "hidden";
}
addEventListener("message", (e) => { if (e.origin === location.origin && e.data === "vitriin:apercu-close") closeLayer(); });

/* ===================== Couches ===================== */
function sheet(html, keepUnder) {
  const layer = $("#layer");
  if (keepUnder && layer.querySelector(".full")) {
    const ov = document.createElement("div"); ov.className = "ov"; ov.id = "subsheet"; ov.innerHTML = `<div class="sheet">${html}</div>`;
    ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
    document.body.appendChild(ov);
    $$("[data-close]", ov).forEach(b => b.onclick = () => ov.remove());
    return;
  }
  layer.innerHTML = `<div class="ov"><div class="sheet">${html}</div></div>`;
  const ov = $(".ov", layer);
  ov.onclick = (e) => { if (e.target === ov && !$(".spin", ov)) closeLayer(); };
  $$("[data-close]", layer).forEach(b => b.onclick = closeLayer);
  document.body.style.overflow = "hidden";
}
function closeSheetOnly() { $("#subsheet")?.remove(); }
function closeLayer() { $("#layer").innerHTML = ""; $("#subsheet")?.remove(); document.body.style.overflow = ""; }

$("#nav").classList.add("hidden"); $("#fab").classList.add("hidden");
boot();
</script>
